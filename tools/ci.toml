tiers = ["check", "main"]

[toolchain.python]
files = []

[toolchain.node]
files = ["package.json", "package-lock.json", ".npmrc", "ui/tsconfig.json"]

[toolchain.comments]
files = ["tools/comment-lint-requirements.txt"]

[toolchain.workflows]
files = []

[toolchain.tools]
files = ["tools/python-requirements.txt", "tools/comment-lint-requirements.txt"]

[toolchain.rust]
files = ["Cargo.toml", "Cargo.lock", "rust-toolchain.toml", ".cargo/**", "clippy.toml", ".clippy.toml", "vendor/**", "crates/test-unify/**"]

[pipeline]
implementation = ["tools/ci.py", "tools/ci.toml", ".github/workflows/ci.yml"]

[group.linux]
setup = ["python", "node"]

[group.windows]
setup = ["python", "toolchain", "node"]

[group.rust]
setup = ["rust"]

[[job]]
name = "machine-paths"
group = "linux"
tier = "check"
toolchain = "python"
inputs = ["**"]
command = ["{python}", "tools/check-machine-paths.py"]

[[job]]
name = "agent-context"
group = "linux"
tier = "check"
toolchain = "python"
base = true
inputs = ["AGENTS.md", "tools/agent-context-budget.json", "tools/check-agent-context.py"]
command = ["{python}", "tools/check-agent-context.py", "--against", "{base}"]

[[job]]
name = "comments"
group = "linux"
tier = "check"
toolchain = "comments"
base = true
inputs = ["**"]
command = ["{python}", "tools/check-comments.py", "--against", "{base}"]

[[job]]
name = "patterns"
group = "linux"
tier = "check"
toolchain = "python"
base = true
inputs = ["**"]
command = ["{python}", "tools/check-patterns.py", "--against", "{base}"]

[[job]]
name = "workflows"
group = "linux"
tier = "check"
toolchain = "workflows"
inputs = [".github/**", "tools/check-workflows.py"]
command = ["{python}", "tools/check-workflows.py"]

[[job]]
name = "suppressions"
group = "linux"
tier = "check"
toolchain = "python"
base = true
inputs = ["crates/**/*.rs", "fuzz/**/*.rs", "vendor/**/*.rs", "tools/check-suppressions.py"]
command = ["{python}", "tools/check-suppressions.py", "--against", "{base}"]

[[job]]
name = "citations"
group = "linux"
tier = "check"
kind = "files"
toolchain = "python"
inputs = ["crates/**", "tools/**", "docs/**", "ui/src/**", "fuzz/**", "*.md"]
shared = ["tools/check-citations.py"]
command = ["{python}", "tools/check-citations.py", "{files}"]
whole = ["{python}", "tools/check-citations.py"]

[[job]]
name = "build-dependencies"
group = "linux"
tier = "check"
toolchain = "python"
inputs = ["Cargo.toml", "Cargo.lock", "crates/*/Cargo.toml", "tools/check-build-dependencies.py"]
command = ["{python}", "tools/check-build-dependencies.py"]

[[job]]
name = "content-dependencies"
group = "linux"
tier = "check"
toolchain = "python"
inputs = ["Cargo.toml", "Cargo.lock", "crates/*/Cargo.toml", "tools/check-content-dependencies.py"]
command = ["{python}", "tools/check-content-dependencies.py"]

[[job]]
name = "feature-unification"
group = "windows"
tier = "check"
toolchain = "rust"
inputs = ["Cargo.toml", "Cargo.lock", "crates/*/Cargo.toml", "vendor/*/Cargo.toml", "tools/check-feature-unification.py"]
ci-only = true
command = ["{python}", "tools/check-feature-unification.py"]

[[job]]
name = "nextest-config"
group = "linux"
tier = "check"
toolchain = "python"
inputs = [".config/nextest.toml", "Cargo.toml", "crates/*/Cargo.toml", "tools/check-nextest-config.py"]
command = ["{python}", "tools/check-nextest-config.py"]

[[job]]
name = "tool-tests"
group = "windows"
tier = "check"
toolchain = "tools"
inputs = ["tools/**", ".github/workflows/**"]
ci-only = true
unset = ["WARM_TARGET_END_TO_END"]
command = ["{python}", "tools/test-python.py"]

[[job]]
name = "smoke-tests"
group = "windows"
tier = "check"
toolchain = "python"
inputs = ["tools/smoke.ps1", "tools/smoke.tests.ps1", "tools/game-clock.ps1"]
ci-only = true
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "tools/smoke.tests.ps1"]

[[job]]
name = "ui-typecheck"
group = "linux"
tier = "check"
toolchain = "node"
inputs = ["ui/**", "tools/**/*.ts", "tools/**/*.mjs", "tools/**/*.js"]
command = ["{npm}", "run", "check:ui"]

[[job]]
name = "widget-manifest"
group = "linux"
tier = "check"
toolchain = "node"
inputs = ["ui/src/widgets/**", "ui/src/families/**", "ui/src/dashboard/definitions.ts", "ui/src/dashboard/options.ts", "ui/src/draw/views/drawn.ts", "tools/check-widget-manifest.mjs", "tools/ui-import-graph.mjs"]
command = ["{node}", "tools/check-widget-manifest.mjs"]

[[job]]
name = "future-reads"
group = "linux"
tier = "check"
toolchain = "node"
inputs = ["ui/src/widgets/**", "ui/src/families/**", "ui/src/dashboard/**", "tools/check-future-reads.mjs", "tools/future-reads-ratchet.json"]
command = ["{node}", "tools/check-future-reads.mjs"]

[[job]]
name = "dead-code"
group = "linux"
tier = "check"
toolchain = "node"
base = true
inputs = ["ui/**", "crates/**", "tools/**/*.mjs", "tools/**/*.ts", "tools/**/*.js", "tools/**/*.cjs", "tools/**/*.py", "tools/**/*.ps1", "tools/**/*.json", "tools/**/*.toml"]
command = ["{node}", "tools/check-dead-code.mjs", "--against", "{base}"]

[[job]]
name = "ui-tests"
group = "linux"
tier = "check"
toolchain = "node"
inputs = ["ui/**", "tools/**/*.ts", "tools/**/*.mjs", "tools/**/*.js", "crates/**/*.json", "crates/**/*.golden"]
ci-only = true
command = ["{node}", "tools/test-ui.mjs", "--group", "node"]

[[job]]
name = "ui-parity-tests"
group = "windows"
tier = "check"
toolchain = "node"
ci-only = true
inputs = ["ui/**", "crates/dashboard-core/src/map_settings.rs"]
command = ["{npm}", "run", "test:parity"]

[[job]]
name = "ui-browser-tests"
group = "windows"
tier = "main"
toolchain = "node"
ci-only = true
inputs = ["ui/**", "tools/**/*.ts", "tools/**/*.mjs", "tools/**/*.js", "crates/**/*.json", "crates/**/*.golden"]
command = ["{node}", "tools/test-ui.mjs", "--group", "browser"]

[[job]]
name = "rust-clippy"
group = "rust"
tier = "check"
kind = "crates"
toolchain = "rust"
base = true
dependents = false
shared = ["tools/check-clippy.py"]
command = ["{python}", "tools/check-clippy.py", "--against", "{base}", "--", "cargo", "clippy", "--all-targets", "--keep-going", "--no-deps", "{packages}"]
ci-only = true
shards = 1
warm = ["cargo", "clippy", "--workspace", "--all-targets", "--keep-going", "--no-deps"]

[[job]]
name = "fuzz-build"
group = "rust"
tier = "check"
toolchain = "rust"
inputs = ["fuzz/**", "crates/replay-files/**"]
manifest = "fuzz/Cargo.toml"
command = ["cargo", "check", "--all-targets", "--manifest-path", "fuzz/Cargo.toml"]
ci-only = true
warm = ["cargo", "check", "--all-targets", "--manifest-path", "fuzz/Cargo.toml"]

[[job]]
name = "dashboard-contract"
group = "rust"
tier = "check"
toolchain = "rust"
inputs = ["ui/src/generated/dashboard.ts"]
package = "dashboard"
ci-only = true
command = ["cargo", "run", "--profile", "ci", "-p", "dashboard", "--features", "export-types", "--bin", "export-types", "--", "--check"]
warm = ["cargo", "build", "--profile", "ci", "-p", "dashboard", "--features", "export-types", "--lib"]

[[job]]
name = "dashboard-shipped"
group = "rust"
tier = "check"
toolchain = "rust"
package = "dashboard"
ci-only = true
command = ["cargo", "check", "--profile", "ci", "-p", "dashboard", "--lib"]
warm = ["cargo", "check", "--profile", "ci", "-p", "dashboard", "--lib"]

[[job]]
name = "rust-test"
group = "rust"
tier = "check"
kind = "crates"
toolchain = "rust"
command = ["cargo", "nextest", "run", "--cargo-profile", "ci", "--profile", "hosted", "--no-fail-fast", "--no-tests=pass", "{packages}"]
report = "target/nextest/hosted/junit.xml"
shards = 8
warm = ["cargo", "test", "--profile", "ci", "--workspace", "--no-run", "--no-fail-fast"]
not-run = { "needs the game install until the dashboard rework (#169)" = { crates = ["dashboard", "dashboard-air", "dashboard-base", "dashboard-core", "dashboard-effects", "dashboard-land", "dashboard-politics", "dashboard-research", "dashboard-text", "dashboard-wars", "dashboard-world"], panic = '^(?:.*: Custom \{ kind: NotFound, error: "BATTLEPLAN_GAME_DIR is unset; executable metadata tests require an explicit supported installation" \}|[\w -]+ requires? BATTLEPLAN_GAME_DIR with the supported installation|BATTLEPLAN_GAME_DIR(?: must name the installed game| must name the supported installation for executable metadata)?)$' } }
widen = [".config/nextest.toml"]
