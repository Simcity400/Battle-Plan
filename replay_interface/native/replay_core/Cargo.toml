[package]
name = "replay_core"
version = "0.1.0"
edition = "2021"
description = "Replay ingest and scrubbable world timeline for .battleplan recordings"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Verified .battleplan container/dir-store reader owned by the extraction side.
# Reused as a library on purpose (one container implementation, no fork); the
# ingest boundary above it is replay_core::source (REPLAY_ARCHITECTURE.md).
snapshot = { path = "../../../extractor/native/snapshot" }
