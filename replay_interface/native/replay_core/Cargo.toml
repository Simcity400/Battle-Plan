[package]
name = "replay_core"
version = "0.1.0"
edition = "2021"
description = "Replay ingest and scrubbable world timeline for .battleplan recordings"

# Construction seams for CONSUMER crates' tests (game_ui). Enabled only through
# game_ui's [dev-dependencies], which the v2 resolver does not unify into a
# normal build, so default product resolution does not compile them. An explicit
# --all-features build does; see
# `PackagedStaticArtifact::unauthenticated_for_consumer_tests`.
[features]
test_support = []
# Lane MN batch 2 measurement. Times each typed-view builder inside
# `WorldFrame::from_raw_with_design_catalog` and exposes a construction entry a
# measurement can reach without a container. Measurement only: never on by
# default, nothing ships with it, and with it off the timing calls compile away.
mn_frame_profile = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Neutral, statically linked portable-file implementation. Installed extractor
# and replayer packages share no runtime/library/path dependency; the
# `.battleplan` file is their sole runtime interface.
snapshot = { package = "portable_replay_format", path = "../../../portable_replay/native/snapshot" }
portable_render_stream = { path = "../../../portable_replay/native/render_stream" }
portable_content_manifest = { path = "../../../portable_replay/native/content_manifest" }
# Admission bounds shared with the extractor producer. See that crate's module
# docs: a rule enforced in one place and not its sibling is not enforced.
portable_admission = { path = "../../../portable_replay/native/admission" }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
# Self dev-dependency, features only: it turns on this crate's own
# `test_support` seam for its integration tests (which link the lib as an
# external crate and so cannot see `cfg(test)`). Normal builds are unaffected.
replay_core = { path = ".", features = ["test_support"] }
# Waits out the Windows sharing violation a real-time scanner causes on a
# freshly written file. Test-only: nothing this package ships calls it.
portable_test_fs_retry = { path = "../../../portable_replay/native/test_fs_retry" }
# The D98 producer identity both trees read, embedded rather than opened: the
# artifact is a cross-tree contract, not replay data, and the replay tree may
# not name a path under the acquisition tree. Test-only.
portable_engine_evidence = { path = "../../../portable_replay/native/engine_evidence" }
