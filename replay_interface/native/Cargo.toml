[workspace]
resolver = "2"
members = [
    "map_viewer",
    "replay_core",
    "replay_fixture_gen",
    "replay_app",
    "game_ui",
    "replay_test_gates",
]

# Native replay-interface workspace:
# replay_core owns .battleplan ingest and the scrubbable world timeline,
# replay_app is the product D3D11 replay surface, map_viewer owns map bundle
# tooling and captured-pass validation/replay.
#
# Acquisition does NOT live here. `terrain_capture` — the injected D3D11
# capture DLL that produces the map-frame bundles map_viewer consumes — is an
# acquisition tool that patches live game code, so it lives with the other
# injected code at `extractor/native/terrain_capture`. This workspace consumes
# sealed captures and takes zero dependencies on extractor crates
# (`game_ui/tests/replay_dependency_boundary.rs`).

# Fail-closed doctrine: the untrusted-input parsers (bespoke ZIP reader,
# stream verifier, compact-stream framing) must panic on integer overflow in
# release builds rather than silently wrap. QA gates build debug binaries
# (where overflow checks are on by default); this keeps the shipped
# configuration matching the tested one.
[profile.release]
overflow-checks = true
