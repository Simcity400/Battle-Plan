[package]
name = "replay_package_runtime"
version = "0.1.0"
edition = "2021"
description = "Non-UI package verification, launcher discovery, and atomic release promotion for Battle Plan"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
# Waits out the Windows sharing violation a real-time scanner causes on a
# freshly written file. Test-only: nothing this package ships calls it.
portable_test_fs_retry = { path = "../../../portable_replay/native/test_fs_retry" }
