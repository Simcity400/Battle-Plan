[package]
name = "map_viewer"
version = "0.1.0"
edition = "2021"
description = "Rust-native the game map bundle tooling and D3D11 terrain replay backend"

[dependencies]
minifb = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winapi = { version = "0.3.9", features = [
    "d3d11",
    "d3dcommon",
    "d3dcompiler",
    "dxgi",
    "dxgiformat",
    "minwindef",
    "unknwnbase",
    "winerror",
] }
