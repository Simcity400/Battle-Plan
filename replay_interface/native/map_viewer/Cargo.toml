[package]
name = "map_viewer"
version = "0.1.0"
edition = "2021"
description = "Rust-native the game map bundle tooling and D3D11 terrain replay backend"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A5 keying swap: the renderer reads owner/controller/cosmetic from the
# scrubbable WorldTimeline typed views instead of the static history parse.
# Acyclic (replay_core depends only on serde/serde_json/snapshot).
replay_core = { path = "../replay_core" }
snapshot = { package = "portable_replay_format", path = "../../../portable_replay/native/snapshot" }
zip = { version = "2", default-features = false, features = ["deflate"] }
winapi = { version = "0.3.9", features = [
    "d3d11",
    "d3dcommon",
    "d3dcompiler",
    "dxgi",
    "dxgiformat",
    "minwindef",
    "unknwnbase",
    "winerror",
] }

[dev-dependencies]
flate2 = "1"
serde_json = "1"
# Neutral, deterministic map-frame-bundle fixture. It is shared ground on
# purpose: the producer (extractor/native/terrain_capture) cannot be a
# dev-dependency here, and this workspace may not open files under extractor/
# either, so the bundle both sides argue about lives in portable_replay.
terrain_fixture = { package = "portable_terrain_fixture", path = "../../../portable_replay/native/terrain_fixture" }
# Fixture-driven placement gate (C2): open the A2 fixtures through the real
# ReplaySource / WorldTimeline and prove placement == generator ground truth.
# Test-only on purpose — map_viewer stays decoupled from replay_core in
# production (replay_app is the wiring layer), matching the other recording-fed
# consumers (naval_supremacy_tint, map_furniture) which take primitive inputs.
replay_core = { path = "../replay_core" }
