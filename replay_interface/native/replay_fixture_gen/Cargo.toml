[package]
name = "replay_fixture_gen"
version = "0.1.0"
edition = "2021"
description = "Deterministic fixture .battleplan generator for replay_core conformance tests"

[dependencies]
portable_content_manifest = { path = "../../../portable_replay/native/content_manifest" }
# The combat records this generator writes are the recorder's and the
# replay's one struct, so a fixture cannot spell a shape the replay refuses.
portable_render_stream = { path = "../../../portable_replay/native/render_stream" }
serde_json = "1"
snapshot = { package = "portable_replay_format", path = "../../../portable_replay/native/snapshot" }

[dev-dependencies]
# Waits out the Windows sharing violation a real-time scanner causes on a
# freshly written file (lane KY). Test-only: nothing this package ships calls it.
portable_test_fs_retry = { path = "../../../portable_replay/native/test_fs_retry" }
