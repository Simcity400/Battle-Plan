[package]
name = "replay_app"
version = "0.1.0"
edition = "2021"
description = "Battle Plan product surface: Win32 + D3D11 swapchain app"
build = "build.rs"

# Test preconditions (the real the game install, the preserved capture corpus) are
# decided once, at build time, by `build.rs` from the table in `test_gates.rs`,
# and become `cfg`s that mark the affected tests `#[ignore]`. See the
# `replay_test_gates` crate docs.
[build-dependencies]
replay_test_gates = { path = "../replay_test_gates" }

[dev-dependencies]
replay_test_gates = { path = "../replay_test_gates" }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
replay_core = { path = "../replay_core" }
snapshot = { package = "portable_replay_format", path = "../../../portable_replay/native/snapshot" }
portable_content_manifest = { path = "../../../portable_replay/native/content_manifest" }
map_viewer = { path = "../map_viewer" }
game_ui = { path = "../game_ui" }
winapi = { version = "0.3.9", features = [
    "d3d11",
    "d3dcommon",
    "d3dcompiler",
    "dxgi",
    "dxgiformat",
    "dxgitype",
    "errhandlingapi",
    "libloaderapi",
    "minwindef",
    "unknwnbase",
    "windef",
    "winerror",
    "winuser",
] }
