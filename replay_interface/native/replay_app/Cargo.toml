[package]
name = "replay_app"
version = "0.1.0"
edition = "2021"
description = "Battle Plan product surface: Win32 + D3D11 swapchain app"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
replay_core = { path = "../replay_core" }
portable_content_manifest = { path = "../../../portable_replay/native/content_manifest" }
map_viewer = { path = "../map_viewer" }
game_ui = { path = "../game_ui" }
winapi = { version = "0.3.9", features = [
    "d3d11",
    "d3dcommon",
    "d3dcompiler",
    "dxgi",
    "dxgi1_2",
    "dxgiformat",
    "dxgitype",
    "errhandlingapi",
    "libloaderapi",
    "minwindef",
    "unknwnbase",
    "windef",
    "winerror",
    "winuser",
] }

[dev-dependencies]
snapshot = { path = "../../../extractor/native/snapshot" }
