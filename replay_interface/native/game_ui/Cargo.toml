[package]
name = "game_ui"
version = "0.1.0"
edition = "2021"
description = "game UI parser, sprite registry, and texture decoder foundation"
build = "build.rs"

# Test preconditions (the real the game install) are decided once, at build time,
# by `build.rs` from the table in `test_gates.rs`, and become `cfg`s that mark
# the affected tests `#[ignore]`. See the `replay_test_gates` crate docs.
[build-dependencies]
replay_test_gates = { path = "../replay_test_gates" }

[dev-dependencies]
# Waits out the Windows sharing violation a real-time scanner causes on a
# freshly written file. Test-only: nothing this package ships calls it.
portable_test_fs_retry = { path = "../../../portable_replay/native/test_fs_retry" }
replay_test_gates = { path = "../replay_test_gates" }
# The engine evidence the UZ derivations read. It lives in portable_replay/
# because a replay-side test must not open a path under the acquisition tree;
# replay_dependency_boundary.rs enforces that.
portable_engine_evidence = { path = "../../../portable_replay/native/engine_evidence" }
# Turns on replay_core's `test_support` seam so this crate's tests can author
# packaged static-catalog bytes and drive the real semantic admission over them.
# Declared here rather than in [dependencies] because the v2 resolver does not
# unify a dev-dependency feature into a normal build: default product resolution
# does not compile the seam. An explicit --all-features build still would.
replay_core = { path = "../replay_core", features = ["test_support"] }

[dependencies]
# Consumers read world state only through replay_core's typed views. The topbar/ideology bindings
# (D1/D2) map those views to UI strings; no recording bytes are parsed here.
replay_core = { path = "../replay_core" }
map_viewer = { path = "../map_viewer" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snapshot = { package = "portable_replay_format", path = "../../../portable_replay/native/snapshot" }
portable_content_manifest = { path = "../../../portable_replay/native/content_manifest" }
flate2 = "1"

[[bin]]
name = "ui_probe"
path = "src/bin/ui_probe.rs"

[[bin]]
name = "acceptance"
path = "src/bin/acceptance.rs"
test = false
bench = false
