[package]
name = "shader-pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
# Constructors other crates' tests build effects with.
test-support = []

[dependencies]
installed-content-core.workspace = true
wgpu = "30.0.0"
# Exact: the persistent cache ABI names this translator version.
naga = { version = "=30.0.1", features = ["spv-in", "wgsl-out"] }
bytemuck.workspace = true
pollster.workspace = true
uuid = { workspace = true, features = ["v4"] }
sha2.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
mimalloc.workspace = true
engine-executable.workspace = true
installed-content-core = { workspace = true, features = ["test-support"] }

# Generated by tools/check-feature-unification.py --fix (do not edit): the features
# `cargo test --workspace` resolves for crates these tests build, so `cargo test -p`
# builds them identically.
[target.'cfg(all())'.dev-dependencies]
engine-allocation = { workspace = true, features = ["test-support"] }
replay-identity = { workspace = true, features = ["test-support"] }
shader-pipeline = { path = ".", features = ["test-support"] }
test-unify = { workspace = true }
unify-foldhash = { workspace = true }
unify-indexmap = { workspace = true }
unify-log = { workspace = true }
unify-once_cell = { workspace = true }
unify-thiserror = { workspace = true }
unify-windows = { workspace = true }
unify-windows-core = { workspace = true }
uuid = { version = "1.26.0", default-features = false, features = ["default", "rng", "serde", "std", "v4"] }
wgpu = { version = "30.0.1", default-features = false, features = ["default", "dx12", "fragile-send-sync-non-atomic-wasm", "gles", "metal", "parking_lot", "std", "vulkan", "web", "webgl", "webgpu", "wgpu-core", "wgsl"] }
