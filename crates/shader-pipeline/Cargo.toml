[package]
name = "shader-pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
installed-content.workspace = true
wgpu = "30.0.0"
# Exact: the persistent cache ABI names this translator version.
naga = { version = "=30.0.1", features = ["spv-in", "wgsl-out"] }
bytemuck.workspace = true
pollster.workspace = true
uuid = { workspace = true, features = ["v4"] }
sha2.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
installed-content = { workspace = true, features = ["test-support"] }
