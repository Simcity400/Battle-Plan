[package]
name = "shader-pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
test-support = []

[dependencies]
content-reader-gui.workspace = true
content-reader-image.workspace = true
content-reader-key-names.workspace = true
content-reader-layers.workspace = true
content-reader-script.workspace = true
job-priority.workspace = true
wgpu = "30.0.0"
naga = { version = "=30.0.1", features = ["spv-in", "wgsl-in", "wgsl-out"] }
bytemuck.workspace = true
pollster.workspace = true
uuid = { workspace = true, features = ["v4"] }
sha2.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader"] }

[dev-dependencies]
content-reader-image = { workspace = true, features = ["test-support"] }
content-reader-layers = { workspace = true, features = ["test-support"] }
content-reader-script = { workspace = true, features = ["test-support"] }
engine-heap.workspace = true
engine-executable.workspace = true

[lints]
workspace = true

# Generated by tools/check-feature-unification.py --fix (do not edit): the features
# `cargo test --workspace` resolves for crates these tests build, so `cargo test -p`
# builds them identically.
[target.'cfg(all())'.dev-dependencies]
content-reader-gui = { workspace = true, features = ["test-support"] }
content-reader-key-names = { workspace = true, features = ["test-support"] }
engine-allocation = { workspace = true, features = ["test-support", "zstd"] }
engine-native-memory = { workspace = true, features = ["batch-fallback-test-counts", "test-support"] }
replay-identity = { workspace = true, features = ["test-support"] }
shader-pipeline = { workspace = true, features = ["test-support"] }
test-unify = { workspace = true }
unify-bitflags-2 = { workspace = true }
unify-indexmap = { workspace = true }
unify-log = { workspace = true }
unify-num-traits = { workspace = true }
unify-once_cell = { workspace = true }
unify-smallvec = { workspace = true }
unify-thiserror = { workspace = true }
unify-windows = { workspace = true }
unify-windows-core = { workspace = true }
uuid = { version = "1.26.0", default-features = false, features = ["default", "rng", "serde", "std", "v4"] }
wgpu = { version = "30.0.1", default-features = false, features = ["default", "dx12", "fragile-send-sync-non-atomic-wasm", "gles", "metal", "parking_lot", "std", "vulkan", "web", "webgl", "webgpu", "wgpu-core", "wgsl"] }
