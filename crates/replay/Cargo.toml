[package]
name = "replay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
default = ["recording"]
journal = ["replay-frame/capture"]
recording = ["journal", "dep:recorder-derive-framework"]
test-support = ["recording", "replay-frame/test-support"]
keep-journal = []
memory-labels = ["engine-allocation/memory-labels"]
multiplied = ["recording", "replay-columnar/sparse-inserts"]

[dependencies]
rayon.workspace = true
engine-allocation = { workspace = true, features = ["zstd"] }
job-priority.workspace = true
replay-columnar.workspace = true
recorder-derive-framework = { workspace = true, optional = true }
dashboard-declare.workspace = true
replay-data.workspace = true
replay-frame.workspace = true
blake3.workspace = true
crc32fast = "1"
foldhash = "0.2"
replay-spool.workspace = true
self_cell = "1.3"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
zstd = "0.13"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
recorder-derive.workspace = true
recorder-derive-framework.workspace = true
engine-occupation.workspace = true
replay-data = { workspace = true, features = ["test-support"] }
replay-frame = { workspace = true, features = ["test-support"] }

[[bin]]
name = "columnar-staging"
required-features = ["journal"]

[lints]
workspace = true

# Generated by tools/check-feature-unification.py --fix (do not edit): the features
# `cargo test --workspace` resolves for crates these tests build, so `cargo test -p`
# builds them identically.
[target.'cfg(all())'.dev-dependencies]
content-reader-country-names = { workspace = true, features = ["test-support"] }
content-reader-localisation = { workspace = true, features = ["test-support"] }
content-reader-province-area = { workspace = true, features = ["test-support"] }
content-reader-regions = { workspace = true, features = ["test-support"] }
engine-executable = { workspace = true, features = ["test-support"] }
engine-native = { workspace = true, features = ["batch-fallback-test-counts", "test-support"] }
recorder-derive = { workspace = true, features = ["test-support"] }
replay = { workspace = true, features = ["default", "journal", "recording", "test-support"] }
replay-derive = { workspace = true, features = ["test-support"] }
replay-identity = { workspace = true, features = ["test-support"] }
test-unify = { workspace = true }
unify-bitflags-2 = { workspace = true }
unify-bytemuck = { workspace = true }
unify-either = { workspace = true }
unify-num-traits = { workspace = true }
unify-smallvec = { workspace = true }
