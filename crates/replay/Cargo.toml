[package]
name = "replay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
default = ["recording"]
recording = ["dep:recorder-derive-framework", "dep:replay-journal", "replay-capture-spool/journal", "replay-journal/recording"]
test-support = ["recording", "replay-journal/test-support", "replay-frame/test-support"]

[dependencies]
blake3.workspace = true
engine-allocation.workspace = true
recorder-derive-framework = { workspace = true, optional = true }
replay-capture-spool.workspace = true
replay-columnar.workspace = true
replay-data.workspace = true
replay-frame.workspace = true
replay-journal = { workspace = true, optional = true }
replay-lanes.workspace = true
replay-recording.workspace = true
replay-settings.workspace = true

serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
recorder-derive.workspace = true
recorder-derive-framework.workspace = true
replay-capture-spool = { workspace = true, features = ["test-support"] }
replay-data = { workspace = true, features = ["test-support"] }
replay-frame = { workspace = true, features = ["test-support"] }
replay-journal = { workspace = true, features = ["test-support"] }
replay-recording = { workspace = true, features = ["test-support"] }

[lints]
workspace = true

# Generated by tools/check-feature-unification.py --fix (do not edit): the features
# `cargo test --workspace` resolves for crates these tests build, so `cargo test -p`
# builds them identically.
[target.'cfg(all())'.dev-dependencies]
content-reader-country-names = { workspace = true, features = ["test-support"] }
content-reader-key-names = { workspace = true, features = ["test-support"] }
content-reader-localisation = { workspace = true, features = ["test-support"] }
content-reader-map = { workspace = true, features = ["test-support"] }
content-reader-province-area = { workspace = true, features = ["test-support"] }
content-reader-regions = { workspace = true, features = ["test-support"] }
engine-executable = { workspace = true, features = ["test-support"] }
engine-native-land = { workspace = true, features = ["test-support"] }
recorder-derive = { workspace = true, features = ["test-support"] }
replay = { workspace = true, features = ["default", "recording", "test-support"] }
replay-derive = { workspace = true, features = ["test-support"] }
replay-identity = { workspace = true, features = ["test-support"] }
test-unify = { workspace = true }
unify-bitflags-2 = { workspace = true }
unify-bytemuck = { workspace = true }
unify-num-traits = { workspace = true }
unify-smallvec = { workspace = true }
