[package]
name = "content-reader-mesh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "MIT AND Zlib"

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
sha2.workspace = true
content-reader-defines.workspace = true
content-reader-layers.workspace = true
content-reader-parser.workspace = true
content-reader-script.workspace = true

[dev-dependencies]
content-reader-layers = { workspace = true, features = ["layer-fixtures", "test-support"] }
content-reader-script = { workspace = true, features = ["layer-fixtures", "test-support"] }
engine-heap.workspace = true

[features]
layer-fixtures = ["content-reader-layers/layer-fixtures"]
test-support = ["layer-fixtures", "content-reader-layers/test-support", "content-reader-script/test-support"]
