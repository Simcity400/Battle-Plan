[package]
name = "collector-hooks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
test-support = []
tap-foreign-probe = []

[dependencies]
engine-sites.workspace = true
engine-native.workspace = true
engine-allocation.workspace = true
serde = { workspace = true, features = ["derive"] }
collector-primitives.workspace = true
collector-status.workspace = true
retour = "0.3"
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[[example]]
name = "tap_foreign_unwind"
required-features = ["tap-foreign-probe"]

[dev-dependencies]
serde_json.workspace = true
collector-test-support.workspace = true

[lints]
workspace = true

# Generated by tools/check-feature-unification.py --fix (do not edit): the features
# `cargo test --workspace` resolves for crates these tests build, so `cargo test -p`
# builds them identically.
[target.'cfg(all())'.dev-dependencies]
collector-hooks = { workspace = true, features = ["test-support"] }
collector-primitives = { workspace = true, features = ["test-support"] }
engine-allocation = { workspace = true, features = ["test-support", "zstd"] }
engine-executable = { workspace = true, features = ["test-support"] }
engine-native = { workspace = true, features = ["batch-fallback-test-counts", "layout-fixtures", "test-support"] }
test-unify = { workspace = true }
unify-windows-sys-0-52 = { workspace = true }
