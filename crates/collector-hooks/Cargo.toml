[package]
name = "collector-hooks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
test-support = []

[dependencies]
serde = { workspace = true, features = ["derive"] }
engine.workspace = true
collector-primitives.workspace = true
collector-status.workspace = true
retour = "0.3"
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[dev-dependencies]
serde_json.workspace = true
collector-test-support.workspace = true
