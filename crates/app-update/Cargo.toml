[package]
name = "app-update"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
tauri = { version = "2", features = [] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "system-proxy"] }
minisign-verify = "0.2"
semver = "1"
base64 = "0.22"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_RemoteDesktop", "Win32_System_Shutdown", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true

# Generated by tools/check-feature-unification.py --fix (do not edit): the features
# `cargo test --workspace` resolves for crates these tests build, so `cargo test -p`
# builds them identically.
[target.'cfg(all())'.dev-dependencies]
tauri = { version = "2.11.5", default-features = false, features = ["common-controls-v6", "compression", "dbus", "default", "dynamic-acl", "tauri-runtime-wry", "tray-icon", "webkit2gtk", "webview2-com", "wry", "x11"] }
test-unify = { workspace = true }
unify-bitflags = { workspace = true }
unify-hashbrown = { workspace = true }
unify-lock_api = { workspace = true }
unify-log = { workspace = true }
unify-parking_lot = { workspace = true }
unify-rustc-hash = { workspace = true }
unify-smallvec = { workspace = true }
unify-uuid = { workspace = true }
unify-windows-sys-0-59 = { workspace = true }
