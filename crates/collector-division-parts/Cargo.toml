[package]
name = "collector-division-parts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
test-support = ["collector-certificates/test-support", "collector-extended-support/test-support", "collector-hooks/test-support", "collector-memory/test-support", "collector-primitives/test-support", "collector-timing/test-support"]
default = ["army_stat_changes"]
army_stat_changes = []
army_stat_verify = ["army_stat_changes"]
attack_witness = []

[dependencies]
engine.workspace = true
replay.workspace = true
serde = { workspace = true, features = ["derive"] }
collector-certificates.workspace = true
collector-extended-support.workspace = true
collector-hooks.workspace = true
collector-memory.workspace = true
collector-primitives.workspace = true
collector-projection.workspace = true
collector-status.workspace = true
collector-timing.workspace = true

[dev-dependencies]
collector-test-support.workspace = true
serde_json.workspace = true
engine = { workspace = true, features = ["batch-fallback-test-counts"] }
collector-extended-support = { workspace = true, features = ["test-support"] }
collector-certificates = { workspace = true, features = ["test-support"] }
collector-hooks = { workspace = true, features = ["test-support"] }
collector-memory = { workspace = true, features = ["test-support"] }
collector-primitives = { workspace = true, features = ["test-support"] }
collector-timing = { workspace = true, features = ["test-support"] }
