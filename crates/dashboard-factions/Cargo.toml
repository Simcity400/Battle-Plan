[package]
name = "dashboard-factions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
test-support = ["dashboard-base/test-support"]

[dependencies]
replay.workspace = true
replay-data.workspace = true
replay-frame.workspace = true
dashboard-base.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
store = { path = "../store" }
ts-rs = "11.1"
zstd = "0.13"

[dev-dependencies]
engine-projects.workspace = true
dashboard-base = { workspace = true, features = ["test-support"] }
replay = { workspace = true, features = ["test-support"] }
replay-data = { workspace = true, features = ["test-support"] }
replay-frame = { workspace = true, features = ["test-support"] }
store = { path = "../store", features = ["test-support"] }
