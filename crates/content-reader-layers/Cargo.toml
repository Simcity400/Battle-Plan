[package]
name = "content-reader-layers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "MIT AND Zlib"

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
content-reader-image.workspace = true
content-reader-parser.workspace = true
engine-allocation.workspace = true
engine-executable.workspace = true
job-priority.workspace = true
miniz_oxide = "0.8"
replay-identity.workspace = true
replay-spool.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
zstd = "0.13"

[dev-dependencies]
content-reader-image = { workspace = true, features = ["test-support"] }
engine-heap.workspace = true
synthetic-game.workspace = true

[features]
test-support = ["layer-fixtures", "content-reader-image/test-support"]
layer-fixtures = []

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_UI_HiDpi"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_System_IO", "Win32_System_Ioctl"] }

# Generated by tools/check-feature-unification.py --fix (do not edit): the features
# `cargo test --workspace` resolves for crates these tests build, so `cargo test -p`
# builds them identically.
[target.'cfg(all())'.dev-dependencies]
content-reader-layers = { workspace = true, features = ["layer-fixtures", "test-support"] }
engine-allocation = { workspace = true, features = ["test-support", "zstd"] }
replay-identity = { workspace = true, features = ["test-support"] }
test-unify = { workspace = true }
