[package]
name = "content-reader-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "MIT AND Zlib"

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
sha2.workspace = true
content-reader-defines.workspace = true
content-reader-image.workspace = true
content-reader-layers.workspace = true
content-reader-parser.workspace = true
content-reader-script.workspace = true
engine-executable.workspace = true

[dev-dependencies]
content-reader-image = { workspace = true, features = ["test-support"] }
content-reader-layers = { workspace = true, features = ["layer-fixtures", "test-support"] }
content-reader-script = { workspace = true, features = ["layer-fixtures", "test-support"] }
engine-heap.workspace = true

[features]
test-support = ["content-reader-layers/test-support", "content-reader-script/test-support", "content-reader-image/test-support"]
