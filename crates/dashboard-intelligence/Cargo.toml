[package]
name = "dashboard-intelligence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
# The products' test oracles and fixtures, for the tests of crates above this one.
test-support = ["dashboard-base/test-support"]

[dependencies]
dashboard-keyed = { path = "../dashboard-keyed" }
engine-intelligence.workspace = true
replay-derive.workspace = true
replay.workspace = true
engine-executable.workspace = true
engine-native.workspace = true
installed-content-core.workspace = true
installed-content-country-names.workspace = true
installed-content-gfx.workspace = true
installed-content-localisation.workspace = true
replay-data.workspace = true
replay-frame.workspace = true
dashboard-base.workspace = true
dashboard-core.workspace = true
dashboard-text.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
store = { path = "../store" }
ts-rs = "11.1"
zstd = "0.13"

[dev-dependencies]
mimalloc.workspace = true
installed-content-core = { workspace = true, features = ["test-support"] }
installed-content-country-names = { workspace = true, features = ["test-support"] }
installed-content-gfx = { workspace = true, features = ["test-support"] }
installed-content-localisation = { workspace = true, features = ["test-support"] }
dashboard-base = { workspace = true, features = ["test-support"] }
dashboard-core = { workspace = true, features = ["test-support"] }
dashboard-text = { workspace = true, features = ["test-support"] }
# Folder layers, so tests load localisation files as the game content does.
# Prepared files publish without disk flushes, which no test can observe.
store = { path = "../store", features = ["test-support"] }
uuid = { workspace = true, features = ["v4"] }
