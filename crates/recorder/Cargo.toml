[package]
name = "recorder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[[bin]]
name = "recorder"
path = "src/main.rs"
# No tests of its own; `cargo test` would only build and link an empty harness.
test = false

[features]
alloc-fault-injection = []

[dependencies]
installed-content-localisation.workspace = true
installed-content-scripted-localisation.workspace = true
replay.workspace = true
engine-allocation.workspace = true
engine-executable.workspace = true
engine-native.workspace = true
engine-dlc.workspace = true
job-priority.workspace = true
replay-frame.workspace = true
serde.workspace = true
installed-content-core.workspace = true
replay-data.workspace = true
recorder-oracle.workspace = true
recorder-movement-oracle.workspace = true
recorder-derived.workspace = true
recorder-replay.workspace = true
recorder-sizes.workspace = true
recorder-metrics.workspace = true
recorder-platform.workspace = true
serde_json.workspace = true
zstd = "0.13"
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Diagnostics_Debug", "Win32_System_Memory", "Win32_System_Console", "Win32_System_Registry", "Win32_System_Environment", "Win32_System_Performance", "Win32_Storage_FileSystem"] }

[dev-dependencies]
installed-content-core = { workspace = true, features = ["test-support"] }
recorder-test-support.workspace = true
# Hand-built movement maps for the movement oracle tests.

# Generated by tools/check-feature-unification.py --fix (do not edit): the features
# `cargo test --workspace` resolves for crates these tests build, so `cargo test -p`
# builds them identically.
[target.'cfg(all())'.dev-dependencies]
engine-native = { workspace = true, features = ["batch-fallback-test-counts", "test-support"] }
installed-content-country-names = { workspace = true, features = ["test-support"] }
installed-content-division-names = { workspace = true, features = ["layer-fixtures", "test-support"] }
installed-content-localisation = { workspace = true, features = ["test-support"] }
installed-content-raids = { workspace = true, features = ["test-support"] }
installed-content-regions = { workspace = true, features = ["test-support"] }
installed-content-scripted-localisation = { workspace = true, features = ["test-support"] }
installed-content-states = { workspace = true, features = ["test-support"] }
installed-content-weather = { workspace = true, features = ["test-support"] }
recorder-oracle-support = { workspace = true, features = ["test-support"] }
replay = { workspace = true, features = ["test-support"] }
replay-derive = { workspace = true, features = ["test-support"] }
replay-identity = { workspace = true, features = ["test-support"] }
test-unify = { workspace = true }
