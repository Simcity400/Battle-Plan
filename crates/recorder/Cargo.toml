[package]
name = "recorder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[[bin]]
name = "recorder"
path = "src/main.rs"
test = false

[features]
alloc-fault-injection = []

[dependencies]
content-reader-key-names.workspace = true
content-reader-layers.workspace = true
content-reader-map.workspace = true
content-reader-parser.workspace = true
content-reader-politics.workspace = true
content-reader-script.workspace = true
replay.workspace = true
replay-capture-spool.workspace = true
replay-files.workspace = true
replay-journal.workspace = true
replay-recording.workspace = true
replay-settings.workspace = true
dashboard-core.workspace = true
engine-sites.workspace = true
content-reader-localisation.workspace = true
content-reader-scripted-localisation.workspace = true
engine-allocation.workspace = true
engine-executable.workspace = true
engine-native.workspace = true
engine-dlc.workspace = true
job-priority.workspace = true
replay-frame.workspace = true
serde.workspace = true
replay-data.workspace = true
recorder-oracle.workspace = true
recorder-movement-oracle.workspace = true
recorder-derived.workspace = true
recorder-replay.workspace = true
recorder-sizes.workspace = true
recorder-metrics.workspace = true
recorder-platform.workspace = true
serde_json.workspace = true
zstd = "0.13"
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Diagnostics_Debug", "Win32_System_Memory", "Win32_System_Console", "Win32_System_Registry", "Win32_System_Environment", "Win32_System_Performance", "Win32_Storage_FileSystem"] }

[dev-dependencies]
content-reader-layers = { workspace = true, features = ["test-support"] }
content-reader-script = { workspace = true, features = ["test-support"] }
replay-journal = { workspace = true, features = ["test-support"] }
replay = { workspace = true, features = ["test-support"] }
recorder-derive.workspace = true
synthetic-game.workspace = true
recorder-test-support.workspace = true

[lints]
workspace = true

# Generated by tools/check-feature-unification.py --fix (do not edit): the features
# `cargo test --workspace` resolves for crates these tests build, so `cargo test -p`
# builds them identically.
[target.'cfg(all())'.dev-dependencies]
content-reader-country-names = { workspace = true, features = ["test-support"] }
content-reader-division-names = { workspace = true, features = ["layer-fixtures", "test-support"] }
content-reader-gui = { workspace = true, features = ["test-support"] }
content-reader-localisation = { workspace = true, features = ["test-support"] }
content-reader-map = { workspace = true, features = ["test-support"] }
content-reader-mesh = { workspace = true, features = ["layer-fixtures"] }
content-reader-politics = { workspace = true, features = ["test-support"] }
content-reader-province-area = { workspace = true, features = ["test-support"] }
content-reader-raids = { workspace = true, features = ["test-support"] }
content-reader-regions = { workspace = true, features = ["test-support"] }
content-reader-scripted-localisation = { workspace = true, features = ["test-support"] }
content-reader-settings = { workspace = true, features = ["test-support"] }
content-reader-states = { workspace = true, features = ["test-support"] }
content-reader-weather = { workspace = true, features = ["test-support"] }
dashboard-core = { workspace = true, features = ["test-support"] }
engine-native = { workspace = true, features = ["batch-fallback-test-counts", "layout-fixtures", "test-support"] }
recorder-derive = { workspace = true, features = ["test-support"] }
recorder-oracle-support = { workspace = true, features = ["test-support"] }
replay = { workspace = true, features = ["default", "recording", "test-support"] }
replay-capture-spool = { workspace = true, features = ["journal", "test-support"] }
replay-derive = { workspace = true, features = ["test-support"] }
replay-identity = { workspace = true, features = ["test-support"] }
test-unify = { workspace = true }
unify-smallvec = { workspace = true }
unify-uuid = { workspace = true }
unify-winapi-util = { workspace = true }
