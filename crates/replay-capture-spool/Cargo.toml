[package]
name = "replay-capture-spool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
journal = ["replay-frame/capture"]
test-support = ["journal", "replay-frame/test-support", "replay-recording/test-support"]

[dependencies]
crc32fast = "1"
engine-allocation.workspace = true
replay-data.workspace = true
replay-frame.workspace = true
replay-recording.workspace = true
replay-settings.workspace = true
serde = { workspace = true, features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading"] }

[dev-dependencies]
engine-occupation.workspace = true
replay-data = { workspace = true, features = ["test-support"] }
replay-frame = { workspace = true, features = ["capture", "test-support"] }
replay-recording = { workspace = true, features = ["test-support"] }
serde_json.workspace = true

[lints]
workspace = true

# Generated by tools/check-feature-unification.py --fix (do not edit): the features
# `cargo test --workspace` resolves for crates these tests build, so `cargo test -p`
# builds them identically.
[target.'cfg(all())'.dev-dependencies]
engine-executable = { workspace = true, features = ["test-support"] }
engine-native-land = { workspace = true, features = ["test-support"] }
replay-capture-spool = { workspace = true, features = ["journal", "test-support"] }
replay-derive = { workspace = true, features = ["test-support"] }
replay-identity = { workspace = true, features = ["test-support"] }
test-unify = { workspace = true }
