[package]
name = "installed-content-weather"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[dependencies]
replay-data.workspace = true
installed-content-core.workspace = true
installed-content-regions.workspace = true
[dev-dependencies]
installed-content-core = { workspace = true, features = ["layer-fixtures"] }
engine-executable.workspace = true

[features]
test-support = ["installed-content-core/test-support"]

# Generated by tools/check-feature-unification.py --fix (do not edit): the features
# `cargo test --workspace` resolves for crates these tests build, so `cargo test -p`
# builds them identically.
[target.'cfg(all())'.dev-dependencies]
engine-allocation = { workspace = true, features = ["test-support", "zstd"] }
engine-native = { workspace = true, features = ["batch-fallback-test-counts", "test-support"] }
installed-content-regions = { workspace = true, features = ["test-support"] }
installed-content-weather = { workspace = true, features = ["test-support"] }
replay-data = { workspace = true, features = ["test-support"] }
replay-identity = { workspace = true, features = ["test-support"] }
test-unify = { workspace = true }
unify-bitflags-2 = { workspace = true }
unify-either = { workspace = true }
unify-num-traits = { workspace = true }
unify-smallvec = { workspace = true }
