[package]
name = "content-reader-script"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "MIT AND Zlib"

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
content-reader-parser.workspace = true
engine-executable.workspace = true
replay-spool.workspace = true
synthetic-game = { workspace = true, optional = true }

[dev-dependencies]
engine-heap.workspace = true
synthetic-game.workspace = true

[features]
test-support = ["layer-fixtures", "dep:synthetic-game"]
layer-fixtures = []

# Generated by tools/check-feature-unification.py --fix (do not edit): the features
# `cargo test --workspace` resolves for crates these tests build, so `cargo test -p`
# builds them identically.
[target.'cfg(all())'.dev-dependencies]
content-reader-script = { workspace = true, features = ["layer-fixtures", "test-support"] }
engine-allocation = { workspace = true, features = ["test-support", "zstd"] }
test-unify = { workspace = true }
