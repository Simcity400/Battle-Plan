[package]
name = "dashboard-resource-balance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
# Tests that take more than about two seconds; see AGENTS.md.
slow-tests = []
# The products' test fixtures, for the tests of crates above this one.
test-support = ["dashboard-base/test-support"]

[dependencies]
replay.workspace = true
engine-production.workspace = true
replay-data.workspace = true
replay-frame.workspace = true
dashboard-base.workspace = true
dashboard-core.workspace = true
dashboard-text.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
store = { path = "../store" }
ts-rs = "11.1"

[dev-dependencies]
dashboard-base = { workspace = true, features = ["test-support"] }
# Prepared files publish without disk flushes, which no test can observe.
store = { path = "../store", features = ["test-support"] }
