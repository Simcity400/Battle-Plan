[package]
name = "viewer-world"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
test-support = ["viewer-foundation/test-support", "dashboard-text/test-support", "shader-pipeline/test-support"]

[dependencies]
game-model.workspace = true
job-priority.workspace = true
map-display-data.workspace = true
map-snow.workspace = true
replay.workspace = true
engine-air-history.workspace = true
engine-executable.workspace = true
engine-allocation.workspace = true
engine-research.workspace = true
content-reader-core.workspace = true
content-reader-country-names.workspace = true
content-reader-equipment-graphics.workspace = true
content-reader-image.workspace = true
content-reader-localisation.workspace = true
content-reader-raids.workspace = true
content-reader-regions.workspace = true
content-reader-state-categories.workspace = true
content-reader-states.workspace = true
content-reader-weather.workspace = true
replay-data.workspace = true
replay-derive.workspace = true
replay-frame.workspace = true
viewer-foundation = { path = "../viewer-foundation" }
dashboard-core.workspace = true
dashboard-text.workspace = true
shader-pipeline = { path = "../shader-pipeline" }
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts"] }
bytemuck = { workspace = true, features = ["derive"] }

[dev-dependencies]
product-codec.workspace = true
dashboard-text = { workspace = true, features = ["test-support"] }
engine-heap.workspace = true
content-reader-core = { workspace = true, features = ["test-support"] }
content-reader-country-names = { workspace = true, features = ["test-support"] }
content-reader-equipment-graphics = { workspace = true, features = ["test-support"] }
content-reader-image = { workspace = true, features = ["test-support"] }
content-reader-localisation = { workspace = true, features = ["test-support"] }
content-reader-raids = { workspace = true, features = ["test-support"] }
content-reader-regions = { workspace = true, features = ["test-support"] }
content-reader-state-categories = { workspace = true, features = ["test-support"] }
content-reader-states = { workspace = true, features = ["test-support"] }
content-reader-weather = { workspace = true, features = ["test-support"] }
viewer-foundation = { path = "../viewer-foundation", features = ["test-support"] }
shader-pipeline = { path = "../shader-pipeline", features = ["test-support"] }
pollster.workspace = true
serde_json.workspace = true

# Generated by tools/check-feature-unification.py --fix (do not edit): the features
# `cargo test --workspace` resolves for crates these tests build, so `cargo test -p`
# builds them identically.
[target.'cfg(all())'.dev-dependencies]
content-reader-province-area = { workspace = true, features = ["test-support"] }
engine-native = { workspace = true, features = ["batch-fallback-test-counts", "test-support"] }
recorder-derive = { workspace = true, features = ["test-support"] }
replay = { workspace = true, features = ["default", "journal", "recording", "test-support"] }
replay-identity = { workspace = true, features = ["test-support"] }
test-unify = { workspace = true }
unify-bitflags-2 = { workspace = true }
unify-dpi = { workspace = true }
unify-indexmap = { workspace = true }
unify-num-traits = { workspace = true }
unify-once_cell = { workspace = true }
unify-tracing = { workspace = true }
unify-uuid = { workspace = true }
unify-winapi-util = { workspace = true }
unify-windows = { workspace = true }
unify-windows-core = { workspace = true }
unify-windows-sys-0-52 = { workspace = true }
unify-windows-sys-0-59 = { workspace = true }
viewer-world = { path = ".", features = ["test-support"] }

[lints]
workspace = true
