[package]
name = "collector-ledger-tables"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
test-support = ["collector-extended-support/test-support", "collector-lifetime/test-support", "collector-observers/test-support", "collector-primitives/test-support"]

[dependencies]
engine-air-history.workspace = true
engine-allocation.workspace = true
engine-events.workspace = true
engine-native.workspace = true
replay-data.workspace = true
replay-frame = { workspace = true, features = ["capture"] }
serde = { workspace = true, features = ["derive"] }
collector-extended-support.workspace = true
collector-lifetime.workspace = true
collector-observers.workspace = true
collector-primitives.workspace = true
collector-projection.workspace = true

[dev-dependencies]
engine-production.workspace = true
engine-scripts.workspace = true
replay.workspace = true
engine-native = { workspace = true, features = ["batch-fallback-test-counts"] }
collector-test-support.workspace = true
serde_json.workspace = true
collector-extended-support = { workspace = true, features = ["test-support"] }
collector-observers = { workspace = true, features = ["default", "test-support"] }
collector-primitives = { workspace = true, features = ["test-support"] }

# Generated by tools/check-feature-unification.py --fix (do not edit): the features
# `cargo test --workspace` resolves for crates these tests build, so `cargo test -p`
# builds them identically.
[target.'cfg(all())'.dev-dependencies]
collector-certificates = { workspace = true, features = ["test-support"] }
collector-hooks = { workspace = true, features = ["test-support"] }
collector-ledger-tables = { workspace = true, features = ["test-support"] }
collector-timing = { workspace = true, features = ["test-support"] }
content-reader-province-area = { workspace = true, features = ["test-support"] }
content-reader-regions = { workspace = true, features = ["test-support"] }
engine-executable = { workspace = true, features = ["test-support"] }
engine-native = { workspace = true, features = ["batch-fallback-test-counts", "test-support"] }
recorder-derive-framework = { workspace = true, features = ["test-support"] }
replay = { workspace = true, features = ["default", "journal", "recording", "test-support"] }
replay-derive = { workspace = true, features = ["test-support"] }
replay-identity = { workspace = true, features = ["test-support"] }
test-unify = { workspace = true }
unify-bitflags-2 = { workspace = true }
unify-bytemuck = { workspace = true }
unify-either = { workspace = true }
unify-num-traits = { workspace = true }
unify-smallvec = { workspace = true }
unify-windows-sys-0-52 = { workspace = true }

[lints]
workspace = true
