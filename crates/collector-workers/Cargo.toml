[package]
name = "collector-workers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
acquisition_profile = ["collector-memory/acquisition_profile"]
default = []
callback_profile = []
executor_join_help = []
phase_cpu = []
test-support = ["collector-memory/test-support", "dep:collector-test-support"]
worker_sampler = []

[dependencies]
collector-extended-support.workspace = true
engine-allocation.workspace = true
collector-test-support = { workspace = true, optional = true }
collector-memory.workspace = true
collector-primitives.workspace = true
collector-status.workspace = true
collector-timing.workspace = true
engine-native.workspace = true
replay-data.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Kernel", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Performance", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_SystemServices"] }

[dev-dependencies]
collector-extended-support.workspace = true
collector-memory = { workspace = true, features = ["test-support"] }
collector-primitives = { workspace = true, features = ["test-support"] }
collector-test-support.workspace = true
collector-timing = { workspace = true, features = ["test-support"] }
engine-native = { workspace = true, features = ["batch-fallback-test-counts"] }

[lints]
workspace = true

# Generated by tools/check-feature-unification.py --fix (do not edit): the features
# `cargo test --workspace` resolves for crates these tests build, so `cargo test -p`
# builds them identically.
[target.'cfg(all())'.dev-dependencies]
collector-extended-support = { workspace = true, features = ["test-support"] }
collector-workers = { workspace = true, features = ["default", "test-support"] }
engine-allocation = { workspace = true, features = ["test-support", "zstd"] }
engine-executable = { workspace = true, features = ["test-support"] }
replay-data = { workspace = true, features = ["capture", "test-support"] }
replay-identity = { workspace = true, features = ["test-support"] }
test-unify = { workspace = true }
