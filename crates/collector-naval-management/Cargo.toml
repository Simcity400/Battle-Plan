[package]
name = "collector-naval-management"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
test-support = ["collector-hooks/test-support"]

[dependencies]
engine-native-parts.workspace = true
engine-native-memory.workspace = true
engine-native-naval.workspace = true
engine-sites.workspace = true
engine-allocation.workspace = true
engine-native.workspace = true
replay-data.workspace = true
replay-frame = { workspace = true, features = ["capture"] }
collector-certificates.workspace = true
collector-hooks.workspace = true
collector-status.workspace = true
collector-timing.workspace = true
serde.workspace = true

[dev-dependencies]
collector-timing = { workspace = true, features = ["test-support"] }
collector-test-support.workspace = true
collector-hooks = { workspace = true, features = ["test-support"] }
collector-certificates = { workspace = true, features = ["test-support"] }

[lints]
workspace = true

# Generated by tools/check-feature-unification.py --fix (do not edit): the features
# `cargo test --workspace` resolves for crates these tests build, so `cargo test -p`
# builds them identically.
[target.'cfg(all())'.dev-dependencies]
collector-memory = { workspace = true, features = ["test-support"] }
collector-naval-management = { workspace = true, features = ["test-support"] }
collector-primitives = { workspace = true, features = ["test-support"] }
engine-executable = { workspace = true, features = ["test-support"] }
engine-native-intelligence = { workspace = true, features = ["test-support"] }
engine-native-naval = { workspace = true, features = ["test-support"] }
replay-frame = { workspace = true, features = ["capture", "test-support"] }
replay-identity = { workspace = true, features = ["test-support"] }
test-unify = { workspace = true }
unify-windows-sys-0-52 = { workspace = true }
