[package]
name = "dashboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
export-types = ["dashboard-base/export-types", "dashboard-air/export-types", "dashboard-economy/export-types", "dashboard-intelligence/export-types", "dashboard-land/export-types", "dashboard-naval/export-types", "dashboard-players/export-types", "dashboard-politics/export-types", "dashboard-production/export-types", "dashboard-research/export-types", "dashboard-wars/export-types", "dashboard-world/export-types"]

[dependencies]
content-reader-key-names.workspace = true
content-reader-layers.workspace = true
content-reader-military.workspace = true
content-reader-parser.workspace = true
content-reader-politics.workspace = true
replay-tools.workspace = true
replay.workspace = true
base64 = "0.22.1"
blake3 = { workspace = true }
content-reader-country-names = { workspace = true }
content-reader-equipment-graphics = { workspace = true }
content-reader-wargoals = { workspace = true }
dashboard-air = { workspace = true }
dashboard-base = { workspace = true }
dashboard-core = { workspace = true }
dashboard-declare = { workspace = true }
dashboard-economy = { workspace = true }
dashboard-follow = { path = "../dashboard-follow" }
dashboard-intelligence = { workspace = true }
dashboard-land = { workspace = true }
dashboard-naval = { workspace = true }
dashboard-players = { workspace = true }
dashboard-politics = { workspace = true }
dashboard-production = { workspace = true }
dashboard-query = { workspace = true }
dashboard-research = { workspace = true }
dashboard-effects.workspace = true
dashboard-text = { workspace = true }
dashboard-wars = { workspace = true }
dashboard-world = { workspace = true }
engine-allocation = { workspace = true }
engine-executable = { workspace = true }
engine-heap = { workspace = true }
job-priority = { workspace = true }
playhead = { path = "../playhead" }
recording-upgrade = { workspace = true }
replay-data = { workspace = true }
replay-frame = { workspace = true }
rfd = { workspace = true }
rmp-serde = { workspace = true }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true }
ts-rs = "11.1"
uuid = { workspace = true, features = ["v4"] }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }
zstd = "0.13"

[[bin]]
name = "export-types"
path = "src/bin/export-types.rs"
required-features = ["export-types"]
test = false

[[bin]]
name = "dashboard-bridge"
path = "src/bin/dashboard-bridge.rs"

[dev-dependencies]
content-reader-layers = { workspace = true, features = ["test-support"] }
replay = { workspace = true, features = ["test-support"] }
content-reader-country-names = { workspace = true, features = ["test-support"] }
content-reader-equipment-graphics = { workspace = true, features = ["test-support"] }
content-reader-wargoals = { workspace = true, features = ["test-support"] }
dashboard = { workspace = true, features = ["export-types"] }
dashboard-air = { workspace = true, features = ["test-support"] }
dashboard-base = { workspace = true, features = ["test-support"] }
dashboard-core = { workspace = true, features = ["test-support"] }
dashboard-land = { workspace = true, features = ["test-support"] }
dashboard-politics = { workspace = true, features = ["test-support"] }
dashboard-text = { workspace = true, features = ["test-support"] }
dashboard-wars = { workspace = true, features = ["test-support"] }
engine-heap = { workspace = true }
playhead = { path = "../playhead", features = ["test-support"] }
replay-data = { workspace = true, features = ["test-support"] }
replay-frame = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
