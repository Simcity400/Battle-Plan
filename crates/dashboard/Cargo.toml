[package]
name = "dashboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
# Frontend contract generation; ordinary hosts need only the runtime registry.
export-types = []

[dependencies]
replay.workspace = true
engine-allocation.workspace = true
engine-executable.workspace = true
engine-native.workspace = true
installed-content-core.workspace = true
installed-content-country-names.workspace = true
installed-content-equipment-graphics.workspace = true
installed-content-gfx.workspace = true
installed-content-image.workspace = true
installed-content-localisation.workspace = true
installed-content-province-area.workspace = true
installed-content-regions.workspace = true
installed-content-settings.workspace = true
replay-data.workspace = true
replay-frame.workspace = true
blake3.workspace = true
dashboard-base.workspace = true
dashboard-air-aces.workspace = true
dashboard-air-superiority.workspace = true
dashboard-construction.workspace = true
dashboard-equipment-losses.workspace = true
dashboard-equipment-stockpile.workspace = true
dashboard-military-air-ledger.workspace = true
dashboard-stability.workspace = true
dashboard-world-tension.workspace = true
dashboard-country-nukes.workspace = true
dashboard-subjects.workspace = true
dashboard-party-history.workspace = true
dashboard-occupation.workspace = true
dashboard-peace-deals.workspace = true
dashboard-game-score.workspace = true
dashboard-wars.workspace = true
dashboard-country-fuel.workspace = true
dashboard-special-projects.workspace = true
dashboard-politics-ledger.workspace = true
dashboard-raids.workspace = true
dashboard-resource-balance.workspace = true
dashboard-unit-leaders.workspace = true
dashboard-core.workspace = true
dashboard-forces.workspace = true
dashboard-intelligence.workspace = true
dashboard-land-battles.workspace = true
dashboard-naval.workspace = true
dashboard-text.workspace = true
store = { path = "../store" }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading"] }
serde = { workspace = true, features = ["derive", "rc"] }
# Saved preparation state reads back every f64 bit for bit, so a restored
# observer compares equal values as equal.
serde_json = { workspace = true, features = ["float_roundtrip"] }
ts-rs = "11.1"
base64 = "0.22.1"
png.workspace = true
uuid = { workspace = true, features = ["v4"] }
rfd.workspace = true
sha2.workspace = true
mimalloc.workspace = true
zstd = "0.13"

[[bin]]
name = "export-types"
path = "src/bin/export-types.rs"
required-features = ["export-types"]
# No tests of its own; `cargo test` would only build and link an empty harness.
test = false

[[bin]]
name = "dashboard-bridge"
path = "src/bin/dashboard-bridge.rs"

[dev-dependencies]
engine-research.workspace = true
engine-stability.workspace = true
replay = { workspace = true, features = ["test-support"] }
installed-content-core = { workspace = true, features = ["test-support"] }
installed-content-country-names = { workspace = true, features = ["test-support"] }
installed-content-equipment-graphics = { workspace = true, features = ["test-support"] }
installed-content-events = { workspace = true, features = ["test-support"] }
installed-content-focus = { workspace = true, features = ["test-support"] }
installed-content-gfx = { workspace = true, features = ["test-support"] }
installed-content-image = { workspace = true, features = ["test-support"] }
installed-content-localisation = { workspace = true, features = ["test-support"] }
installed-content-province-area = { workspace = true, features = ["test-support"] }
installed-content-regions = { workspace = true, features = ["test-support"] }
installed-content-settings = { workspace = true, features = ["test-support"] }
installed-content-states = { workspace = true, features = ["test-support"] }
replay-data = { workspace = true, features = ["test-support"] }
replay-frame = { workspace = true, features = ["test-support"] }
dashboard-air-aces = { workspace = true, features = ["test-support"] }
dashboard-air-superiority = { workspace = true, features = ["test-support"] }
dashboard-equipment-losses = { workspace = true, features = ["test-support"] }
dashboard-military-air-ledger = { workspace = true, features = ["test-support"] }
dashboard-stability = { workspace = true, features = ["test-support"] }
dashboard-world-tension = { workspace = true, features = ["test-support"] }
dashboard-country-nukes = { workspace = true, features = ["test-support"] }
dashboard-subjects = { workspace = true, features = ["test-support"] }
dashboard-party-history = { workspace = true, features = ["test-support"] }
dashboard-occupation = { workspace = true, features = ["test-support"] }
dashboard-peace-deals = { workspace = true, features = ["test-support"] }
dashboard-game-score = { workspace = true, features = ["test-support"] }
dashboard-wars = { workspace = true, features = ["test-support"] }
dashboard-country-fuel = { workspace = true, features = ["test-support"] }
dashboard-special-projects = { workspace = true, features = ["test-support"] }
dashboard-politics-ledger = { workspace = true, features = ["test-support"] }
dashboard-raids = { workspace = true, features = ["test-support"] }
dashboard-resource-balance = { workspace = true, features = ["test-support"] }
dashboard-unit-leaders = { workspace = true, features = ["test-support"] }
dashboard-base = { workspace = true, features = ["test-support"] }
dashboard-core = { workspace = true, features = ["test-support"] }
dashboard-forces = { workspace = true, features = ["test-support"] }
dashboard-intelligence = { workspace = true, features = ["test-support"] }
dashboard-land-battles = { workspace = true, features = ["test-support"] }
dashboard-naval = { workspace = true, features = ["test-support"] }
dashboard-text = { workspace = true, features = ["test-support"] }
# Folder layers, so tests load localisation files as the game content does.
# Prepared files publish without disk flushes, which no test can observe.
store = { path = "../store", features = ["test-support"] }
