[package]
name = "dashboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
replay.workspace = true
installed-content.workspace = true
engine.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
ts-rs = "11.1"
base64 = "0.22.1"
png.workspace = true
uuid = { workspace = true, features = ["v4"] }
rfd.workspace = true
shader-pipeline = { path = "../shader-pipeline" }

[[bin]]
name = "export-types"
path = "src/bin/export-types.rs"

[[bin]]
name = "dashboard-bridge"
path = "src/bin/dashboard-bridge.rs"

[dev-dependencies]
# Folder layers, so tests load localisation files as the game content does.
installed-content = { workspace = true, features = ["test-support"] }
crc32fast = "1"
zstd = "0.13"
