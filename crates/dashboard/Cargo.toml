[package]
name = "dashboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
export-types = ["dashboard-base/export-types", "dashboard-intelligence/export-types", "dashboard-research/export-types"]

[dependencies]
game-model.workspace = true
dashboard-research.workspace = true
dashboard-intelligence.workspace = true
dashboard-base.workspace = true
dashboard-declare.workspace = true
dashboard-follow = { path = "../dashboard-follow" }
playhead = { path = "../playhead" }
dashboard-query.workspace = true
replay-columnar.workspace = true
job-priority.workspace = true
map-snow.workspace = true
content-reader-wargoals.workspace = true
replay.workspace = true
engine-air-history.workspace = true
engine-fuel.workspace = true
engine-allocation.workspace = true
engine-executable.workspace = true
engine-land-inputs.workspace = true
engine-intelligence.workspace = true
engine-native.workspace = true
engine-resources.workspace = true
engine-stability.workspace = true
engine-projects.workspace = true
content-reader-core.workspace = true
recording-upgrade.workspace = true
replay-spool.workspace = true
shader-pipeline = { path = "../shader-pipeline" }
content-reader-country-names.workspace = true
content-reader-division-names.workspace = true
content-reader-equipment-graphics.workspace = true
content-reader-events.workspace = true
content-reader-gfx.workspace = true
content-reader-image.workspace = true
content-reader-localisation.workspace = true
content-reader-province-area.workspace = true
content-reader-raids.workspace = true
content-reader-regions.workspace = true
content-reader-settings.workspace = true
content-reader-weather.workspace = true
replay-data.workspace = true
replay-frame.workspace = true
replay-looks.workspace = true
replay-derive.workspace = true
engine-power-balance.workspace = true
rayon.workspace = true
blake3.workspace = true
dashboard-core.workspace = true
dashboard-text.workspace = true
recorder-platform.workspace = true
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
rmp-serde.workspace = true
ts-rs = "11.1"
base64 = "0.22.1"
png.workspace = true
uuid = { workspace = true, features = ["v4"] }
rfd.workspace = true
sha2.workspace = true
engine-heap.workspace = true
zstd = "0.13"

[[bin]]
name = "export-types"
path = "src/bin/export-types.rs"
required-features = ["export-types"]
test = false

[[bin]]
name = "dashboard-bridge"
path = "src/bin/dashboard-bridge.rs"

[dev-dependencies]
recorder-derive-air.workspace = true
recorder-derive-framework = { workspace = true, features = ["test-support"] }
recorder-derive-land.workspace = true
recorder-derive-world.workspace = true
dashboard = { workspace = true, features = ["export-types"] }
dashboard-base = { workspace = true, features = ["test-support"] }
engine-research.workspace = true
replay = { workspace = true, features = ["test-support"] }
content-reader-core = { workspace = true, features = ["test-support"] }
content-reader-country-names = { workspace = true, features = ["test-support"] }
content-reader-division-names = { workspace = true, features = ["test-support"] }
content-reader-equipment-graphics = { workspace = true, features = ["test-support"] }
content-reader-events = { workspace = true, features = ["test-support"] }
content-reader-focus = { workspace = true, features = ["test-support"] }
content-reader-gfx = { workspace = true, features = ["test-support"] }
content-reader-image = { workspace = true, features = ["test-support"] }
content-reader-localisation = { workspace = true, features = ["test-support"] }
content-reader-province-area = { workspace = true, features = ["test-support"] }
content-reader-regions = { workspace = true, features = ["test-support"] }
content-reader-settings = { workspace = true, features = ["test-support"] }
content-reader-states = { workspace = true, features = ["test-support"] }
replay-data = { workspace = true, features = ["test-support"] }
replay-frame = { workspace = true, features = ["test-support"] }
recorder-derive = { workspace = true, features = ["test-support"] }
dashboard-core = { workspace = true, features = ["test-support"] }
dashboard-text = { workspace = true, features = ["test-support"] }

[lints]
workspace = true

# Generated by tools/check-feature-unification.py --fix (do not edit): the features
# `cargo test --workspace` resolves for crates these tests build, so `cargo test -p`
# builds them identically.
[target.'cfg(all())'.dev-dependencies]
content-reader-weather = { workspace = true, features = ["test-support"] }
engine-native = { workspace = true, features = ["batch-fallback-test-counts", "test-support"] }
playhead = { path = "../playhead", features = ["test-support"] }
replay = { workspace = true, features = ["default", "journal", "recording", "test-support"] }
replay-derive = { workspace = true, features = ["test-support"] }
replay-identity = { workspace = true, features = ["test-support"] }
shader-pipeline = { workspace = true, features = ["test-support"] }
test-unify = { workspace = true }
unify-bitflags-2 = { workspace = true }
unify-either = { workspace = true }
unify-indexmap = { workspace = true }
unify-log = { workspace = true }
unify-num-traits = { workspace = true }
unify-once_cell = { workspace = true }
unify-smallvec = { workspace = true }
unify-wgpu = { workspace = true }
unify-winapi-util = { workspace = true }
unify-windows = { workspace = true }
unify-windows-core = { workspace = true }
uuid = { version = "1.26.0", default-features = false, features = ["default", "rng", "serde", "std", "v4"] }
