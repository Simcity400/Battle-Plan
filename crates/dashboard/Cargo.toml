[package]
name = "dashboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
replay = { path = "../replay" }
installed-content = { path = "../installed-content" }
engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "11.1"
base64 = "0.22.1"
png = "0.18"
uuid = { version = "1", features = ["v4"] }
rfd = "0.17"

[[bin]]
name = "export-types"
path = "src/bin/export-types.rs"

[[bin]]
name = "dashboard-bridge"
path = "src/bin/dashboard-bridge.rs"

[dev-dependencies]
# Folder layers, so tests load localisation files as the game content does.
installed-content = { path = "../installed-content", features = ["test-support"] }
