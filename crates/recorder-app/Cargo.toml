[package]
name = "recorder-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "battleplan-recorder"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json.workspace = true

[dependencies]
content-reader-defines.workspace = true
content-reader-gui.workspace = true
content-reader-layers.workspace = true
replay.workspace = true
replay-files.workspace = true
replay-settings.workspace = true
app-update.workspace = true
content-reader-country-names.workspace = true
replay-data.workspace = true
recorder = { path = "../recorder" }
content-reader-image.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
rfd.workspace = true
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
replay = { workspace = true, features = ["test-support"] }
replay-capture-spool.workspace = true
replay-journal = { workspace = true, features = ["test-support"] }
recorder-derive.workspace = true
replay-identity = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
