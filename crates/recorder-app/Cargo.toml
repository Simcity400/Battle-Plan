[package]
name = "recorder-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "battle-plan-recorder"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
recorder = { path = "../recorder" }
replay.workspace = true
installed-content.workspace = true
installed-content-image.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
rfd.workspace = true
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_Registry", "Win32_System_Threading"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
