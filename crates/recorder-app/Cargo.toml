[package]
name = "recorder-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "battle-plan-recorder"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
replay.workspace = true
app-update.workspace = true
installed-content-core.workspace = true
installed-content-country-names.workspace = true
replay-data.workspace = true
recorder = { path = "../recorder" }
installed-content-image.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
rfd.workspace = true
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

# Generated by tools/check-feature-unification.py --fix (do not edit): the features
# `cargo test --workspace` resolves for crates these tests build, so `cargo test -p`
# builds them identically.
[target.'cfg(all())'.dev-dependencies]
dashboard-core = { workspace = true, features = ["test-support"] }
engine-native = { workspace = true, features = ["batch-fallback-test-counts", "test-support"] }
installed-content-country-names = { workspace = true, features = ["test-support"] }
installed-content-division-names = { workspace = true, features = ["layer-fixtures", "test-support"] }
installed-content-localisation = { workspace = true, features = ["test-support"] }
installed-content-province-area = { workspace = true, features = ["test-support"] }
installed-content-raids = { workspace = true, features = ["test-support"] }
installed-content-regions = { workspace = true, features = ["test-support"] }
installed-content-scripted-localisation = { workspace = true, features = ["test-support"] }
installed-content-settings = { workspace = true, features = ["test-support"] }
installed-content-states = { workspace = true, features = ["test-support"] }
installed-content-weather = { workspace = true, features = ["test-support"] }
recorder-derive = { workspace = true, features = ["test-support"] }
recorder-oracle-support = { workspace = true, features = ["test-support"] }
replay = { workspace = true, features = ["test-support"] }
replay-data = { workspace = true, features = ["test-support"] }
replay-derive = { workspace = true, features = ["test-support"] }
replay-identity = { workspace = true, features = ["test-support"] }
test-unify = { workspace = true }
unify-bitflags-1 = { workspace = true }
unify-either = { workspace = true }
unify-hashbrown = { workspace = true }
unify-log = { workspace = true }
unify-num-traits = { workspace = true }
unify-smallvec = { workspace = true }
unify-windows-sys-0-59 = { workspace = true }
