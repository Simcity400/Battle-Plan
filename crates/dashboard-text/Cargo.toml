[package]
name = "dashboard-text"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
# The catalogue and scope fixtures, for the tests of crates above this one.
test-support = ["dashboard-core/test-support", "installed-content-abilities/test-support", "installed-content-core/test-support", "installed-content-country-names/test-support", "installed-content-division-names/test-support", "installed-content-equipment-graphics/test-support", "installed-content-events/test-support", "installed-content-focus/test-support", "installed-content-gfx/test-support", "installed-content-image/test-support", "installed-content-localisation/test-support", "installed-content-raids/test-support", "installed-content-regions/test-support", "installed-content-scripted-localisation/test-support", "installed-content-settings/test-support", "installed-content-state-categories/test-support", "installed-content-states/test-support", "installed-content-wargoals/test-support"]

[dependencies]
replay.workspace = true
engine-allocation.workspace = true
engine-executable.workspace = true
engine-native.workspace = true
engine-power-balance.workspace = true
engine-projects.workspace = true
engine-research.workspace = true
installed-content-abilities.workspace = true
installed-content-core.workspace = true
installed-content-country-names.workspace = true
installed-content-division-names.workspace = true
installed-content-equipment-graphics.workspace = true
installed-content-events.workspace = true
installed-content-focus.workspace = true
installed-content-gfx.workspace = true
installed-content-image.workspace = true
installed-content-localisation.workspace = true
installed-content-raids.workspace = true
installed-content-regions.workspace = true
installed-content-scripted-localisation.workspace = true
installed-content-settings.workspace = true
installed-content-state-categories.workspace = true
installed-content-states.workspace = true
installed-content-wargoals.workspace = true
replay-data.workspace = true
replay-derive.workspace = true
replay-frame.workspace = true
job-priority.workspace = true
base64 = "0.22.1"
blake3.workspace = true
dashboard-core.workspace = true
installed-content-save.workspace = true
png.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
shader-pipeline = { path = "../shader-pipeline" }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
mimalloc.workspace = true
installed-content-abilities = { workspace = true, features = ["test-support"] }
installed-content-core = { workspace = true, features = ["test-support"] }
installed-content-country-names = { workspace = true, features = ["test-support"] }
installed-content-division-names = { workspace = true, features = ["test-support"] }
installed-content-equipment-graphics = { workspace = true, features = ["test-support"] }
installed-content-events = { workspace = true, features = ["test-support"] }
installed-content-focus = { workspace = true, features = ["test-support"] }
installed-content-gfx = { workspace = true, features = ["test-support"] }
installed-content-image = { workspace = true, features = ["test-support"] }
installed-content-localisation = { workspace = true, features = ["test-support"] }
installed-content-raids = { workspace = true, features = ["test-support"] }
installed-content-regions = { workspace = true, features = ["test-support"] }
installed-content-scripted-localisation = { workspace = true, features = ["test-support"] }
installed-content-settings = { workspace = true, features = ["test-support"] }
installed-content-state-categories = { workspace = true, features = ["test-support"] }
installed-content-states = { workspace = true, features = ["test-support"] }
installed-content-wargoals = { workspace = true, features = ["test-support"] }
# Recording containers the metadata tests corrupt and re-checksum.
crc32fast = "1"
zstd = "0.13"
dashboard-core = { workspace = true, features = ["test-support"] }
# Folder layers, so tests load localisation files as the game content does.

# Generated by tools/check-feature-unification.py --fix (do not edit): the features
# `cargo test --workspace` resolves for crates these tests build, so `cargo test -p`
# builds them identically.
[target.'cfg(all())'.dev-dependencies]
dashboard-text = { workspace = true, features = ["test-support"] }
engine-native = { workspace = true, features = ["batch-fallback-test-counts", "test-support"] }
replay = { workspace = true, features = ["test-support"] }
replay-data = { workspace = true, features = ["test-support"] }
replay-derive = { workspace = true, features = ["test-support"] }
replay-identity = { workspace = true, features = ["test-support"] }
shader-pipeline = { path = "../shader-pipeline", features = ["test-support"] }
test-unify = { workspace = true }
unify-indexmap = { workspace = true }
unify-log = { workspace = true }
unify-once_cell = { workspace = true }
unify-uuid = { workspace = true }
unify-wgpu = { workspace = true }
unify-winapi-util = { workspace = true }
unify-windows = { workspace = true }
unify-windows-core = { workspace = true }
