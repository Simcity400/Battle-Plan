[package]
name = "dashboard-text"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
# Tests that take more than about two seconds; see AGENTS.md.
slow-tests = []
# The catalogue and scope fixtures, for the tests of crates above this one.
test-support = ["dashboard-core/test-support", "installed-content/test-support"]

[dependencies]
base64 = "0.22.1"
dashboard-core.workspace = true
engine.workspace = true
installed-content.workspace = true
installed-content-save.workspace = true
png.workspace = true
replay.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
shader-pipeline = { path = "../shader-pipeline" }

[dev-dependencies]
# Recording containers the metadata tests corrupt and re-checksum.
crc32fast = "1"
zstd = "0.13"
dashboard-core = { workspace = true, features = ["test-support"] }
# Folder layers, so tests load localisation files as the game content does.
installed-content = { workspace = true, features = ["test-support"] }
