[package]
name = "engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
test-support = ["engine-native/test-support"]
alloc-fault-injection = ["engine-mutations/alloc-fault-injection", "engine-focus/alloc-fault-injection", "engine-events/alloc-fault-injection", "engine-visibility/alloc-fault-injection", "engine-research/alloc-fault-injection", "engine-research/alloc-fault-injection", "engine-railways/alloc-fault-injection", "engine-raid-inputs/alloc-fault-injection", "engine-production/alloc-fault-injection", "engine-occupation/alloc-fault-injection", "engine-land-inputs/alloc-fault-injection", "engine-stability/alloc-fault-injection", "engine-scripts/alloc-fault-injection", "engine-resources/alloc-fault-injection", "engine-projects/alloc-fault-injection", "engine-power-balance/alloc-fault-injection", "engine-peace/alloc-fault-injection", "engine-naval-history/alloc-fault-injection", "engine-map-air/alloc-fault-injection", "engine-intelligence/alloc-fault-injection", "engine-fuel/alloc-fault-injection", "engine-fixed-layout/alloc-fault-injection", "engine-equipment/alloc-fault-injection", "engine-dlc/alloc-fault-injection", "engine-deployment/alloc-fault-injection", "engine-decisions/alloc-fault-injection", "engine-characters/alloc-fault-injection", "engine-air-history/alloc-fault-injection", "engine-native/alloc-fault-injection"]
batch-fallback-test-counts = ["engine-native/batch-fallback-test-counts"]

[dependencies]
engine-native-politics.workspace = true
engine-native-air.workspace = true
engine-native-naval.workspace = true
engine-native-intelligence.workspace = true
engine-native-land.workspace = true
engine-mutations.workspace = true
engine-focus.workspace = true
engine-events.workspace = true
engine-visibility.workspace = true
engine-research.workspace = true
engine-railways.workspace = true
engine-raid-inputs.workspace = true
engine-production.workspace = true
engine-occupation.workspace = true
engine-land-inputs.workspace = true
engine-stability.workspace = true
engine-scripts.workspace = true
engine-resources.workspace = true
engine-projects.workspace = true
engine-power-balance.workspace = true
engine-peace.workspace = true
engine-naval-history.workspace = true
engine-map-air.workspace = true
engine-intelligence.workspace = true
engine-fuel.workspace = true
engine-fixed-layout.workspace = true
engine-equipment.workspace = true
engine-dlc.workspace = true
engine-deployment.workspace = true
engine-decisions.workspace = true
engine-characters.workspace = true
engine-air-history.workspace = true
engine-native.workspace = true
engine-executable.workspace = true

[dev-dependencies]
engine-native = { workspace = true, features = ["test-support"] }

[lints]
workspace = true

# Generated by tools/check-feature-unification.py --fix (do not edit): the features
# `cargo test --workspace` resolves for crates these tests build, so `cargo test -p`
# builds them identically.
[target.'cfg(all())'.dev-dependencies]
engine-allocation = { workspace = true, features = ["test-support", "zstd"] }
engine-executable = { workspace = true, features = ["test-support"] }
test-unify = { workspace = true }
