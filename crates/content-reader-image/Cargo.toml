[package]
name = "content-reader-image"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "MIT AND IJG"

[lib]
doctest = false

[dependencies]
sha2.workspace = true
png.workspace = true
image = { version = "0.25.10", default-features = false, features = ["bmp", "ico", "png", "tga"] }

[features]
test-support = []

[lints]
workspace = true

# Generated by tools/check-feature-unification.py --fix (do not edit): the features
# `cargo test --workspace` resolves for crates these tests build, so `cargo test -p`
# builds them identically.
[target.'cfg(all())'.dev-dependencies]
content-reader-image = { workspace = true, features = ["test-support"] }
test-unify = { workspace = true }
