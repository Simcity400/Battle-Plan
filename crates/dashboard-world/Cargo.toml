[package]
name = "dashboard-world"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
export-types = ["dashboard-base/export-types"]
test-support = ["dashboard-base/test-support"]

[dependencies]
content-reader-defines.workspace = true
content-reader-gui.workspace = true
content-reader-key-names.workspace = true
content-reader-layers.workspace = true
content-reader-map.workspace = true
content-reader-politics.workspace = true
replay-lanes.workspace = true
replay-recording.workspace = true
blake3 = { workspace = true }
content-reader-country-names = { workspace = true }
content-reader-gfx = { workspace = true }
content-reader-image = { workspace = true }
content-reader-localisation = { workspace = true }
content-reader-province-area = { workspace = true }
content-reader-regions = { workspace = true }
dashboard-base = { workspace = true }
dashboard-core = { workspace = true }
dashboard-declare = { workspace = true }
dashboard-follow = { path = "../dashboard-follow" }
dashboard-query = { workspace = true }
dashboard-text = { workspace = true }
engine-allocation = { workspace = true }
engine-executable = { workspace = true }
engine-native = { workspace = true }
engine-stability = { workspace = true }
png = { workspace = true }
recording-upgrade = { workspace = true }
replay-columnar = { workspace = true }
replay-data = { workspace = true }
replay-frame = { workspace = true }
replay-looks = { workspace = true }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true }
ts-rs = "11.1"
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
content-reader-gui = { workspace = true, features = ["test-support"] }
content-reader-layers = { workspace = true, features = ["test-support"] }
replay = { workspace = true, features = ["test-support"] }
replay-capture-spool.workspace = true
recorder-derive.workspace = true
content-reader-country-names = { workspace = true, features = ["test-support"] }
content-reader-gfx = { workspace = true, features = ["test-support"] }
content-reader-image = { workspace = true, features = ["test-support"] }
content-reader-localisation = { workspace = true, features = ["test-support"] }
content-reader-province-area = { workspace = true, features = ["test-support"] }
content-reader-regions = { workspace = true, features = ["test-support"] }
dashboard-base = { workspace = true, features = ["test-support"] }
dashboard-core = { workspace = true, features = ["test-support"] }
dashboard-text = { workspace = true, features = ["test-support"] }
dashboard-world = { workspace = true, features = ["export-types"] }
engine-heap = { workspace = true }
replay-data = { workspace = true, features = ["test-support"] }
replay-frame = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
