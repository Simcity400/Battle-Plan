[package]
name = "installed-content"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[dependencies]
installed-content-core.workspace = true
installed-content-abilities.workspace = true
installed-content-country-names.workspace = true
installed-content-division-names.workspace = true
installed-content-equipment-graphics.workspace = true
installed-content-events.workspace = true
installed-content-focus.workspace = true
installed-content-gfx.workspace = true
installed-content-localisation.workspace = true
installed-content-naval-combat-defines.workspace = true
installed-content-naval-path.workspace = true
installed-content-province-area.workspace = true
installed-content-raids.workspace = true
installed-content-regions.workspace = true
installed-content-scripted-localisation.workspace = true
installed-content-settings.workspace = true
installed-content-state-categories.workspace = true
installed-content-states.workspace = true
installed-content-unit-path.workspace = true
installed-content-wargoals.workspace = true
installed-content-weather.workspace = true

[dev-dependencies]
engine-executable.workspace = true
installed-content-division-names = { workspace = true, features = ["layer-fixtures"] }
installed-content-core = { workspace = true, features = ["layer-fixtures"] }

[features]
test-support = [
    "installed-content-core/test-support",
    "installed-content-abilities/test-support",
    "installed-content-country-names/test-support",
    "installed-content-division-names/test-support",
    "installed-content-equipment-graphics/test-support",
    "installed-content-events/test-support",
    "installed-content-focus/test-support",
    "installed-content-gfx/test-support",
    "installed-content-localisation/test-support",
    "installed-content-naval-combat-defines/test-support",
    "installed-content-naval-path/test-support",
    "installed-content-province-area/test-support",
    "installed-content-raids/test-support",
    "installed-content-regions/test-support",
    "installed-content-scripted-localisation/test-support",
    "installed-content-settings/test-support",
    "installed-content-state-categories/test-support",
    "installed-content-states/test-support",
    "installed-content-unit-path/test-support",
    "installed-content-wargoals/test-support",
    "installed-content-weather/test-support",
]
layer-fixtures = ["installed-content-core/layer-fixtures"]

# Generated by tools/check-feature-unification.py --fix (do not edit): the features
# `cargo test --workspace` resolves for crates these tests build, so `cargo test -p`
# builds them identically.
[target.'cfg(all())'.dev-dependencies]
engine-native = { workspace = true, features = ["batch-fallback-test-counts", "test-support"] }
installed-content-abilities = { workspace = true, features = ["test-support"] }
installed-content-country-names = { workspace = true, features = ["test-support"] }
installed-content-division-names = { workspace = true, features = ["layer-fixtures", "test-support"] }
installed-content-equipment-graphics = { workspace = true, features = ["test-support"] }
installed-content-events = { workspace = true, features = ["test-support"] }
installed-content-focus = { workspace = true, features = ["test-support"] }
installed-content-gfx = { workspace = true, features = ["test-support"] }
installed-content-localisation = { workspace = true, features = ["test-support"] }
installed-content-naval-combat-defines = { workspace = true, features = ["test-support"] }
installed-content-naval-path = { workspace = true, features = ["test-support"] }
installed-content-province-area = { workspace = true, features = ["test-support"] }
installed-content-raids = { workspace = true, features = ["test-support"] }
installed-content-regions = { workspace = true, features = ["test-support"] }
installed-content-scripted-localisation = { workspace = true, features = ["test-support"] }
installed-content-settings = { workspace = true, features = ["test-support"] }
installed-content-state-categories = { workspace = true, features = ["test-support"] }
installed-content-states = { workspace = true, features = ["test-support"] }
installed-content-unit-path = { workspace = true, features = ["test-support"] }
installed-content-wargoals = { workspace = true, features = ["test-support"] }
installed-content-weather = { workspace = true, features = ["test-support"] }
replay-data = { workspace = true, features = ["test-support"] }
replay-frame = { workspace = true, features = ["test-support"] }
replay-identity = { workspace = true, features = ["test-support"] }
test-unify = { workspace = true }
unify-bitflags-2 = { workspace = true }
unify-either = { workspace = true }
unify-num-traits = { workspace = true }
unify-smallvec = { workspace = true }
