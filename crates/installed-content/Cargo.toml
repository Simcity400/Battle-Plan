[package]
name = "installed-content"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
engine.workspace = true
# PUC Lua 5.1, the runtime the game links, for common/defines.
mlua = { version = "0.12", default-features = false, features = ["lua51", "vendored", "send"] }
# The PNG plugin of the game's FreeImage decodes through libpng; see image::native.
png.workspace = true
# libpng's iCCP profiles are zlib streams (see image::native::png_colorspace); archive layers
# inflate their records as raw deflate (content::physfs_zip).
miniz_oxide = "0.8"
replay.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true

[features]
# Hand-built fixtures for other crates' unit tests, such as
# `movement::MovementMap::from_parts`; enabled only from dev-dependencies.
test-support = []

[target.'cfg(windows)'.dependencies]
# Native folder opens and the monitors the game's SDL display indices name.
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_UI_HiDpi"] }
