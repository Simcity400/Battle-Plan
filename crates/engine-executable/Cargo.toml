[package]
name = "engine-executable"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[[bin]]
name = "executable-tables-check"
path = "src/bin/executable-tables-check.rs"

[features]
test-support = []

[dependencies]
engine-reference-values.workspace = true
job-priority.workspace = true
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "instr_info"] }
memchr = "2.8"
sha2.workspace = true

[lints]
workspace = true

# Generated by tools/check-feature-unification.py --fix (do not edit): the features
# `cargo test --workspace` resolves for crates these tests build, so `cargo test -p`
# builds them identically.
[target.'cfg(all())'.dev-dependencies]
engine-executable = { workspace = true, features = ["test-support"] }
test-unify = { workspace = true }
