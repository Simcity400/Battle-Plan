[package]
name = "engine-allocation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
alloc-fault-injection = []
test-support = []
memory-labels = []
zstd = ["dep:zstd-sys"]

[dependencies]
zstd-sys = { version = "2.0.15", default-features = false, features = ["experimental"], optional = true }

[lints]
workspace = true

# Generated by tools/check-feature-unification.py --fix (do not edit): the features
# `cargo test --workspace` resolves for crates these tests build, so `cargo test -p`
# builds them identically.
[target.'cfg(all())'.dev-dependencies]
engine-allocation = { workspace = true, features = ["test-support", "zstd"] }
test-unify = { workspace = true }
