version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[dependencies]
content-reader-parser.workspace = true
replay-data.workspace = true
replay-frame.workspace = true
