[package]
name = "replay-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
replay.workspace = true
engine-executable.workspace = true
installed-content-settings.workspace = true
replay-data.workspace = true
tauri = { version = "2", features = [] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
dashboard.workspace = true
mimalloc.workspace = true
rfd.workspace = true
tokio = { version = "1", features = ["sync"] }
# Controllers through Windows.Gaming.Input: Xbox, PlayStation and other gamepads.
gilrs = { version = "0.11.2", default-features = false, features = ["wgi"] }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

# Generated by tools/check-feature-unification.py --fix (do not edit): the features
# `cargo test --workspace` resolves for crates these tests build, so `cargo test -p`
# builds them identically.
[target.'cfg(all())'.dev-dependencies]
dashboard-air-aces = { workspace = true, features = ["test-support"] }
dashboard-air-superiority = { workspace = true, features = ["test-support"] }
dashboard-army = { workspace = true, features = ["test-support"] }
dashboard-country-fuel = { workspace = true, features = ["test-support"] }
dashboard-country-nukes = { workspace = true, features = ["test-support"] }
dashboard-economy = { workspace = true, features = ["test-support"] }
dashboard-equipment-losses = { workspace = true, features = ["test-support"] }
dashboard-forces = { workspace = true, features = ["test-support"] }
dashboard-game-score = { workspace = true, features = ["test-support"] }
dashboard-intelligence = { workspace = true, features = ["test-support"] }
dashboard-military-air-ledger = { workspace = true, features = ["test-support"] }
dashboard-naval = { workspace = true, features = ["test-support"] }
dashboard-occupation = { workspace = true, features = ["test-support"] }
dashboard-party-history = { workspace = true, features = ["test-support"] }
dashboard-peace-deals = { workspace = true, features = ["test-support"] }
dashboard-politics = { workspace = true, features = ["test-support"] }
dashboard-politics-ledger = { workspace = true, features = ["test-support"] }
dashboard-raids = { workspace = true, features = ["test-support"] }
dashboard-resource-balance = { workspace = true, features = ["test-support"] }
dashboard-special-projects = { workspace = true, features = ["test-support"] }
dashboard-stability = { workspace = true, features = ["test-support"] }
dashboard-subjects = { workspace = true, features = ["test-support"] }
dashboard-unit-leaders = { workspace = true, features = ["test-support"] }
dashboard-world-tension = { workspace = true, features = ["test-support"] }
engine-native = { workspace = true, features = ["batch-fallback-test-counts", "test-support"] }
installed-content-weather = { workspace = true, features = ["test-support"] }
replay = { workspace = true, features = ["test-support"] }
replay-data = { workspace = true, features = ["test-support"] }
replay-identity = { workspace = true, features = ["test-support"] }
shader-pipeline = { path = "../shader-pipeline", features = ["test-support"] }
store = { path = "../store", features = ["test-support"] }
tauri = { version = "2.11.5", default-features = false, features = ["common-controls-v6", "compression", "dbus", "default", "dynamic-acl", "tauri-runtime-wry", "tray-icon", "webkit2gtk", "webview2-com", "wry", "x11"] }
test-unify = { workspace = true }
unify-bitflags = { workspace = true }
unify-windows = { workspace = true }
unify-windows-core = { workspace = true }
unify-windows-sys-0-52 = { workspace = true }
viewer-foundation = { path = "../viewer-foundation", features = ["test-support"] }
