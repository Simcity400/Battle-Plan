[package]
name = "replay-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json.workspace = true

[dependencies]
replay-files.workspace = true
replay-settings.workspace = true
viewer-runtime.workspace = true
dashboard-core.workspace = true
dashboard-text.workspace = true
app-update.workspace = true
engine-executable.workspace = true
content-reader-settings.workspace = true
replay-data.workspace = true
tauri = { version = "2", features = [] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
dashboard.workspace = true
dashboard-follow = { path = "../dashboard-follow" }
viewer = { path = "../viewer" }
video-export.workspace = true
png.workspace = true
engine-heap.workspace = true
rfd.workspace = true
tokio = { version = "1", features = ["sync"] }
gilrs = { version = "0.11.2", default-features = false, features = ["wgi"] }
webview2-com = "0.38.2"
windows-core = "=0.61.2"
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
served-ui = ["custom-protocol"]

[dev-dependencies]
content-reader-script.workspace = true
replay = { workspace = true, features = ["test-support"] }
replay-capture-spool.workspace = true
recorder-derive.workspace = true

[lints]
workspace = true

# Generated by tools/check-feature-unification.py --fix (do not edit): the features
# `cargo test --workspace` resolves for crates these tests build, so `cargo test -p`
# builds them identically.
[target.'cfg(all())'.dev-dependencies]
content-reader-gui = { workspace = true, features = ["test-support"] }
content-reader-map = { workspace = true, features = ["test-support"] }
content-reader-mesh = { workspace = true, features = ["layer-fixtures"] }
content-reader-naval-combat-defines = { workspace = true, features = ["test-support"] }
content-reader-naval-path = { workspace = true, features = ["test-support"] }
content-reader-politics = { workspace = true, features = ["test-support"] }
content-reader-sound = { workspace = true, features = ["test-support"] }
content-reader-weather = { workspace = true, features = ["test-support"] }
dashboard = { workspace = true, features = ["export-types"] }
dashboard-air = { workspace = true, features = ["export-types", "test-support"] }
dashboard-land = { workspace = true, features = ["export-types", "test-support"] }
dashboard-politics = { workspace = true, features = ["export-types", "test-support"] }
dashboard-research = { workspace = true, features = ["export-types", "test-support"] }
dashboard-wars = { workspace = true, features = ["export-types", "test-support"] }
engine-native-land = { workspace = true, features = ["test-support"] }
recorder-derive = { workspace = true, features = ["test-support"] }
replay = { workspace = true, features = ["default", "recording", "test-support"] }
replay-capture-spool = { workspace = true, features = ["journal", "test-support"] }
replay-identity = { workspace = true, features = ["test-support"] }
replay-tools = { workspace = true, features = ["default", "journal"] }
tauri = { version = "2.11.5", default-features = false, features = ["common-controls-v6", "compression", "dbus", "default", "dynamic-acl", "tauri-runtime-wry", "tray-icon", "webkit2gtk", "webview2-com", "wry", "x11"] }
test-unify = { workspace = true }
unify-bitflags-1 = { workspace = true }
unify-windows-sys-0-52 = { workspace = true }
viewer-playback = { workspace = true, features = ["test-support"] }
viewer-scene-base = { workspace = true, features = ["test-support"] }
