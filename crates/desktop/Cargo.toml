[package]
name = "replay-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
replay.workspace = true
app-update.workspace = true
engine-executable.workspace = true
content-reader-settings.workspace = true
replay-data.workspace = true
tauri = { version = "2", features = [] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
dashboard.workspace = true
dashboard-follow = { path = "../dashboard-follow" }
shader-pipeline = { path = "../shader-pipeline" }
viewer = { path = "../viewer" }
viewer-foundation = { path = "../viewer-foundation" }
engine-heap.workspace = true
rfd.workspace = true
tokio = { version = "1", features = ["sync"] }
gilrs = { version = "0.11.2", default-features = false, features = ["wgi"] }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
served-ui = ["custom-protocol"]

[dev-dependencies]
content-reader-core = { workspace = true, features = ["test-support"] }

# Generated by tools/check-feature-unification.py --fix (do not edit): the features
# `cargo test --workspace` resolves for crates these tests build, so `cargo test -p`
# builds them identically.
[target.'cfg(all())'.dev-dependencies]
content-reader-naval-combat-defines = { workspace = true, features = ["test-support"] }
content-reader-naval-path = { workspace = true, features = ["test-support"] }
content-reader-weather = { workspace = true, features = ["test-support"] }
dashboard = { workspace = true, features = ["export-types"] }
dashboard-base = { workspace = true, features = ["export-types", "test-support"] }
engine-native = { workspace = true, features = ["batch-fallback-test-counts", "test-support"] }
map-content = { workspace = true, features = ["test-support"] }
recorder-derive = { workspace = true, features = ["test-support"] }
replay = { workspace = true, features = ["default", "journal", "recording", "test-support"] }
replay-identity = { workspace = true, features = ["test-support"] }
tauri = { version = "2.11.5", default-features = false, features = ["common-controls-v6", "compression", "dbus", "default", "dynamic-acl", "tauri-runtime-wry", "tray-icon", "webkit2gtk", "webview2-com", "wry", "x11"] }
test-unify = { workspace = true }
unify-bitflags-1 = { workspace = true }
unify-windows-sys-0-52 = { workspace = true }
viewer-playback = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
