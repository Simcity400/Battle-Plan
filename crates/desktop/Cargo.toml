[package]
name = "replay-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
engine.workspace = true
replay.workspace = true
tauri = { version = "2", features = [] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
dashboard.workspace = true
installed-content.workspace = true
rfd.workspace = true
tokio = { version = "1", features = ["sync"] }
# Controllers through Windows.Gaming.Input: Xbox, PlayStation and other gamepads.
gilrs = { version = "0.11.2", default-features = false, features = ["wgi"] }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
# Tests that take more than about two seconds; see AGENTS.md.
slow-tests = []
