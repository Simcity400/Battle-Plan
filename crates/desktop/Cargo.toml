[package]
name = "replay-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json.workspace = true

[dependencies]
replay-files.workspace = true
replay-settings.workspace = true
viewer-runtime.workspace = true
dashboard-core.workspace = true
dashboard-text.workspace = true
app-update.workspace = true
engine-executable.workspace = true
content-reader-settings.workspace = true
replay-data.workspace = true
tauri = { version = "2", features = [] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
dashboard.workspace = true
dashboard-follow = { path = "../dashboard-follow" }
shader-pipeline = { path = "../shader-pipeline" }
viewer = { path = "../viewer" }
engine-heap.workspace = true
rfd.workspace = true
tokio = { version = "1", features = ["sync"] }
gilrs = { version = "0.11.2", default-features = false, features = ["wgi"] }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
served-ui = ["custom-protocol"]

[dev-dependencies]
content-reader-script.workspace = true
replay = { workspace = true, features = ["test-support"] }
replay-capture-spool.workspace = true
recorder-derive.workspace = true

[lints]
workspace = true
