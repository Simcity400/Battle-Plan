[package]
name = "content-reader-abilities"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[dependencies]
content-reader-key-names.workspace = true
content-reader-layers.workspace = true
content-reader-parser.workspace = true
content-reader-script.workspace = true

[dev-dependencies]
content-reader-layers = { workspace = true, features = ["layer-fixtures", "test-support"] }
content-reader-script = { workspace = true, features = ["layer-fixtures", "test-support"] }

[features]
test-support = ["content-reader-layers/test-support", "content-reader-script/test-support"]

[lints]
workspace = true

# Generated by tools/check-feature-unification.py --fix (do not edit): the features
# `cargo test --workspace` resolves for crates these tests build, so `cargo test -p`
# builds them identically.
[target.'cfg(all())'.dev-dependencies]
content-reader-abilities = { workspace = true, features = ["test-support"] }
content-reader-key-names = { workspace = true, features = ["test-support"] }
engine-allocation = { workspace = true, features = ["test-support", "zstd"] }
replay-identity = { workspace = true, features = ["test-support"] }
test-unify = { workspace = true }
unify-smallvec = { workspace = true }
