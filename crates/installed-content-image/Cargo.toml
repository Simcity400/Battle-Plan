[package]
name = "installed-content-image"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[dependencies]
# The PNG plugin of the game's FreeImage decodes through libpng; see native.
png.workspace = true
# libpng's iCCP profiles are zlib streams (see native::png_colorspace).
miniz_oxide = "0.8"

[dev-dependencies]
sha2.workspace = true

[features]
test-support = []

# Generated by tools/check-feature-unification.py --fix (do not edit): the features
# `cargo test --workspace` resolves for crates these tests build, so `cargo test -p`
# builds them identically.
[target.'cfg(all())'.dev-dependencies]
installed-content-image = { workspace = true, features = ["test-support"] }
test-unify = { workspace = true }
