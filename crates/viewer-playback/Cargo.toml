[package]
name = "viewer-playback"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
test-support = [
    "dep:replay-capture-spool",
    "dep:recorder-derive",
    "content-reader-image/test-support", "content-reader-layers/test-support", "content-reader-script/test-support",
    "content-reader-country-names/test-support",
    "content-reader-gfx/test-support",
    "content-reader-image/test-support",
    "content-reader-localisation/test-support",
    "content-reader-regions/test-support",
    "content-reader-settings/test-support",
    "content-reader-state-categories/test-support",
    "content-reader-states/test-support",
    "dashboard-base/test-support",
    "dashboard-core/test-support",
    "dashboard-text/test-support",
    "engine-executable/test-support",
    "map-content/test-support",
    "playhead/test-support",
    "replay/test-support",
    "replay-data/test-support",
    "replay-frame/test-support",
    "shader-pipeline/test-support",
    "viewer-aircraft/test-support",
    "viewer-borders/test-support",
    "viewer-buildings/test-support",
    "viewer-combat/test-support",
    "viewer-counter-products/test-support",
    "viewer-counters/test-support",
    "viewer-counter-kit/test-support",
    "viewer-counters-land/test-support",
    "viewer-counters-naval/test-support",
    "viewer-engagements/test-support",
    "viewer-foundation/test-support",
    "viewer-gpu/test-support",
    "viewer-layer-core/test-support",
    "viewer-layers-counters/test-support",
    "viewer-layers-forces/test-support",
    "viewer-layers-infrastructure/test-support",
    "viewer-layers-political/test-support",
    "viewer-map-icons/test-support",
    "viewer-map-modes/test-support",
    "viewer-map-text/test-support",
    "viewer-models/test-support",
    "viewer-native-gui/test-support",
    "viewer-raids/test-support",
    "viewer-rail/test-support",
    "viewer-runtime/test-support",
    "viewer-terrain/test-support",
    "viewer-unit-history/test-support",
    "viewer-unit-models/test-support",
    "viewer-unit-reads/test-support",
    "viewer-weather-effects/test-support",
    "viewer-world/test-support",
]

[dependencies]
content-reader-defines.workspace = true
content-reader-gui.workspace = true
content-reader-key-names.workspace = true
content-reader-layers.workspace = true
content-reader-map.workspace = true
content-reader-parser.workspace = true
content-reader-politics.workspace = true
content-reader-script.workspace = true
replay-derive.workspace = true
viewer-counter-kit.workspace = true
viewer-counters-land.workspace = true
viewer-counters-naval.workspace = true
recorder-derive = { workspace = true, optional = true }
content-reader-country-names = { workspace = true }
content-reader-gfx = { workspace = true }
content-reader-image = { workspace = true }
content-reader-localisation = { workspace = true }
content-reader-regions = { workspace = true }
content-reader-settings = { workspace = true }
content-reader-state-categories = { workspace = true }
content-reader-states = { workspace = true }
dashboard-base = { workspace = true }
dashboard-core = { workspace = true }
dashboard-text = { workspace = true }
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts"] }
engine-executable = { workspace = true }
job-priority = { workspace = true }
map-content = { workspace = true }
map-display-data = { workspace = true }
map-products = { workspace = true }
map-snow = { workspace = true }
playhead = { path = "../playhead" }
png = { workspace = true }
pollster = { workspace = true }
replay = { workspace = true }
replay-capture-spool = { workspace = true, optional = true }
replay-recording.workspace = true
replay-columnar = { workspace = true }
replay-data = { workspace = true }
replay-frame = { workspace = true }
serde_json = { workspace = true }
shader-pipeline = { path = "../shader-pipeline" }
viewer-aircraft = { workspace = true }
viewer-audio = { path = "../viewer-audio" }
viewer-borders = { workspace = true }
viewer-buildings = { workspace = true }
viewer-combat = { path = "../viewer-combat" }
viewer-counter-products = { path = "../viewer-counter-products" }
viewer-counters.workspace = true
viewer-engagements = { workspace = true }
viewer-foundation = { workspace = true }
viewer-gpu = { workspace = true }
viewer-layer-core = { workspace = true }
viewer-layers-counters = { workspace = true }
viewer-layers-forces = { workspace = true }
viewer-layers-infrastructure = { workspace = true }
viewer-layers-political = { workspace = true }
viewer-map-icons = { workspace = true }
viewer-map-modes = { workspace = true }
viewer-map-text = { workspace = true }
viewer-models = { workspace = true }
viewer-native-gui = { workspace = true }
viewer-raids = { path = "../viewer-raids" }
viewer-rail = { workspace = true }
viewer-runtime = { workspace = true }
viewer-terrain = { workspace = true }
viewer-unit-history = { workspace = true }
viewer-unit-models = { workspace = true }
viewer-unit-reads = { workspace = true }
viewer-weather-effects = { workspace = true }
viewer-world = { workspace = true }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
replay-capture-spool.workspace = true
recorder-derive.workspace = true
uuid = { workspace = true, features = ["v4"] }
content-reader-sound = { workspace = true, features = ["test-support"] }
engine-heap = { workspace = true }
synthetic-game = { workspace = true }
viewer-playback = { workspace = true, features = ["test-support"] }

[lints]
workspace = true

# Generated by tools/check-feature-unification.py --fix (do not edit): the features
# `cargo test --workspace` resolves for crates these tests build, so `cargo test -p`
# builds them identically.
[target.'cfg(all())'.dev-dependencies]
content-reader-gui = { workspace = true, features = ["test-support"] }
content-reader-map = { workspace = true, features = ["test-support"] }
content-reader-mesh = { workspace = true, features = ["layer-fixtures"] }
content-reader-naval-combat-defines = { workspace = true, features = ["test-support"] }
content-reader-naval-path = { workspace = true, features = ["test-support"] }
content-reader-politics = { workspace = true, features = ["test-support"] }
content-reader-weather = { workspace = true, features = ["test-support"] }
dashboard-base = { workspace = true, features = ["export-types", "test-support"] }
recorder-derive = { workspace = true, features = ["test-support"] }
replay = { workspace = true, features = ["default", "recording", "test-support"] }
replay-capture-spool = { workspace = true, features = ["journal", "test-support"] }
replay-identity = { workspace = true, features = ["test-support"] }
replay-tools = { workspace = true, features = ["default", "journal"] }
test-unify = { workspace = true }
unify-dpi = { workspace = true }
unify-indexmap = { workspace = true }
unify-once_cell = { workspace = true }
unify-tracing = { workspace = true }
unify-winapi-util = { workspace = true }
unify-windows = { workspace = true }
unify-windows-sys-0-52 = { workspace = true }
unify-windows-sys-0-59 = { workspace = true }
uuid = { version = "1.26.0", default-features = false, features = ["default", "rng", "serde", "std", "v4"] }
viewer-scene-base = { workspace = true, features = ["test-support"] }
