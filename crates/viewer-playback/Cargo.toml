[package]
name = "viewer-playback"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
test-support = ["dep:recorder-derive", "playhead/test-support", "replay/test-support", "replay-data/test-support", "replay-frame/test-support", "viewer-world/test-support", "viewer-counters/test-support", "viewer-combat/test-support", "viewer-raids/test-support", "viewer-counter-products/test-support", "shader-pipeline/test-support", "viewer-foundation/test-support"]

[dependencies]
replay-derive.workspace = true
viewer-engagements.workspace = true
viewer-foundation.workspace = true
viewer-gpu.workspace = true
viewer-native-gui.workspace = true
viewer-runtime.workspace = true
viewer-unit-reads.workspace = true
recorder-derive = { workspace = true, optional = true }
viewer-aircraft.workspace = true
viewer-borders.workspace = true
viewer-buildings.workspace = true
viewer-map-icons.workspace = true
viewer-map-modes.workspace = true
viewer-map-text.workspace = true
viewer-models.workspace = true
viewer-rail.workspace = true
viewer-scene-base.workspace = true
viewer-terrain.workspace = true
viewer-unit-history.workspace = true
viewer-unit-models.workspace = true
viewer-weather-effects.workspace = true
viewer-world.workspace = true
map-content.workspace = true
foldhash = "0.2"
dashboard-base.workspace = true
job-priority.workspace = true
map-display-data.workspace = true
map-products.workspace = true
map-snow.workspace = true
replay.workspace = true
replay-columnar.workspace = true
playhead = { path = "../playhead" }
engine-executable.workspace = true
content-reader-core.workspace = true
content-reader-country-names.workspace = true
content-reader-gfx.workspace = true
content-reader-image.workspace = true
content-reader-localisation.workspace = true
content-reader-regions.workspace = true
content-reader-settings.workspace = true
content-reader-state-categories.workspace = true
content-reader-states.workspace = true
replay-data.workspace = true
replay-frame.workspace = true
viewer-counter-products = { path = "../viewer-counter-products" }
viewer-audio = { path = "../viewer-audio" }
viewer-counters = { path = "../viewer-counters" }
viewer-raids = { path = "../viewer-raids" }
viewer-combat = { path = "../viewer-combat" }
shader-pipeline = { path = "../shader-pipeline" }
content-reader-sound.workspace = true
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts"] }
bytemuck = { workspace = true, features = ["derive"] }
pollster.workspace = true
png.workspace = true
serde_json.workspace = true
dashboard-follow = { path = "../dashboard-follow" }
engine-heap.workspace = true
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
dashboard-core.workspace = true
dashboard-text.workspace = true

[dev-dependencies]
dashboard-text = { workspace = true, features = ["test-support"] }
viewer-engagements = { workspace = true, features = ["test-support"] }
viewer-foundation = { workspace = true, features = ["test-support"] }
viewer-gpu = { workspace = true, features = ["test-support"] }
viewer-runtime = { workspace = true, features = ["test-support"] }
viewer-unit-reads = { workspace = true, features = ["test-support"] }
recorder-derive.workspace = true
viewer-map-icons = { workspace = true, features = ["test-support"] }
viewer-buildings = { workspace = true, features = ["test-support"] }
viewer-models = { workspace = true, features = ["test-support"] }
viewer-unit-models = { workspace = true, features = ["test-support"] }
content-reader-core = { workspace = true, features = ["test-support"] }
synthetic-game.workspace = true
uuid = { workspace = true, features = ["v4"] }
viewer-playback = { workspace = true, features = ["test-support"] }
engine-heap.workspace = true

[lints]
workspace = true

# Generated by tools/check-feature-unification.py --fix (do not edit): the features
# `cargo test --workspace` resolves for crates these tests build, so `cargo test -p`
# builds them identically.
[target.'cfg(all())'.dev-dependencies]
content-reader-naval-combat-defines = { workspace = true, features = ["test-support"] }
content-reader-naval-path = { workspace = true, features = ["test-support"] }
content-reader-weather = { workspace = true, features = ["test-support"] }
dashboard-base = { workspace = true, features = ["export-types", "test-support"] }
map-content = { workspace = true, features = ["test-support"] }
recorder-derive = { workspace = true, features = ["test-support"] }
replay = { workspace = true, features = ["default", "journal", "recording", "test-support"] }
replay-identity = { workspace = true, features = ["test-support"] }
test-unify = { workspace = true }
unify-dpi = { workspace = true }
unify-indexmap = { workspace = true }
unify-once_cell = { workspace = true }
unify-tracing = { workspace = true }
unify-winapi-util = { workspace = true }
unify-windows = { workspace = true }
unify-windows-sys-0-52 = { workspace = true }
unify-windows-sys-0-59 = { workspace = true }
uuid = { version = "1.26.0", default-features = false, features = ["default", "rng", "serde", "std", "v4"] }
viewer-map-modes = { workspace = true, features = ["test-support"] }
viewer-rail = { workspace = true, features = ["test-support"] }
viewer-scene-base = { workspace = true, features = ["test-support"] }
viewer-unit-history = { workspace = true, features = ["test-support"] }
