[package]
name = "viewer"
default-run = "viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
replay.workspace = true
engine.workspace = true
installed-content.workspace = true
shader-pipeline = { path = "../shader-pipeline" }
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts"] }
bytemuck = { workspace = true, features = ["derive"] }
pollster.workspace = true
png.workspace = true
rfd.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
dashboard.workspace = true
raw-window-handle = "0.6"
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
sha2.workspace = true
# Hand-built movement maps for the unit tests.
installed-content = { workspace = true, features = ["test-support"] }
