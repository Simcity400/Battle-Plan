[package]
name = "viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
replay = { path = "../replay" }
engine = { path = "../engine" }
installed-content = { path = "../installed-content" }
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
png = "0.18"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
desktop-protocol = { path = "../desktop-protocol" }
raw-window-handle = "0.6"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
