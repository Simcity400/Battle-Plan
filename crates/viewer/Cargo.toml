[package]
name = "viewer"
default-run = "viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
replay = { path = "../replay" }
engine = { path = "../engine" }
installed-content = { path = "../installed-content" }
shader-pipeline = { path = "../shader-pipeline" }
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
png = "0.18"
base64 = "0.22.1"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
dashboard = { path = "../dashboard" }
raw-window-handle = "0.6"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
sha2 = "0.10"
# Hand-built movement maps for the unit tests.
installed-content = { path = "../installed-content", features = ["test-support"] }
