[package]
name = "viewer"
default-run = "viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
viewer-playback.workspace = true
map-content.workspace = true
foldhash = "0.2"
dashboard-base.workspace = true
job-priority.workspace = true
engine-allocation.workspace = true
map-display-data.workspace = true
map-products.workspace = true
map-snow.workspace = true
replay.workspace = true
replay-columnar.workspace = true
playhead = { path = "../playhead" }
engine-executable.workspace = true
installed-content-abilities.workspace = true
installed-content-core.workspace = true
installed-content-country-names.workspace = true
installed-content-division-names.workspace = true
installed-content-focus.workspace = true
installed-content-gfx.workspace = true
installed-content-image.workspace = true
installed-content-localisation.workspace = true
installed-content-raids.workspace = true
installed-content-regions.workspace = true
installed-content-scripted-localisation.workspace = true
installed-content-settings.workspace = true
installed-content-state-categories.workspace = true
installed-content-states.workspace = true
installed-content-weather.workspace = true
replay-data.workspace = true
replay-frame.workspace = true
viewer-counter-products = { path = "../viewer-counter-products" }
viewer-world = { path = "../viewer-world" }
viewer-audio = { path = "../viewer-audio" }
viewer-counters = { path = "../viewer-counters" }
viewer-raids = { path = "../viewer-raids" }
viewer-combat = { path = "../viewer-combat" }
viewer-foundation = { path = "../viewer-foundation" }
shader-pipeline = { path = "../shader-pipeline" }
installed-content-sound.workspace = true
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts"] }
bytemuck = { workspace = true, features = ["derive"] }
pollster.workspace = true
png.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
dashboard.workspace = true
dashboard-follow = { path = "../dashboard-follow" }
engine-heap.workspace = true
raw-window-handle = "0.6"
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
viewer-playback = { workspace = true, features = ["test-support"] }
engine-native.workspace = true
playhead = { path = "../playhead", features = ["test-support"] }
installed-content-abilities = { workspace = true, features = ["test-support"] }
installed-content-core = { workspace = true, features = ["test-support"] }
installed-content-division-names = { workspace = true, features = ["test-support"] }
installed-content-focus = { workspace = true, features = ["test-support"] }
installed-content-gfx = { workspace = true, features = ["test-support"] }
installed-content-image = { workspace = true, features = ["test-support"] }
installed-content-localisation = { workspace = true, features = ["test-support"] }
installed-content-raids = { workspace = true, features = ["test-support"] }
installed-content-regions = { workspace = true, features = ["test-support"] }
installed-content-scripted-localisation = { workspace = true, features = ["test-support"] }
installed-content-settings = { workspace = true, features = ["test-support"] }
installed-content-state-categories = { workspace = true, features = ["test-support"] }
installed-content-states = { workspace = true, features = ["test-support"] }
installed-content-weather = { workspace = true, features = ["test-support"] }
# Synthetic Scene sprite fixtures import the shader owner directly.
shader-pipeline = { path = "../shader-pipeline", features = ["test-support"] }
viewer-counter-products = { path = "../viewer-counter-products", features = ["test-support"] }
viewer-world = { path = "../viewer-world", features = ["test-support"] }
viewer-counters = { path = "../viewer-counters", features = ["test-support"] }
viewer-raids = { path = "../viewer-raids", features = ["test-support"] }
viewer-combat = { path = "../viewer-combat", features = ["test-support"] }
viewer-foundation = { path = "../viewer-foundation", features = ["test-support"] }
uuid = { workspace = true, features = ["v4"] }
# Hand-built movement maps for the unit tests.

# Generated by tools/check-feature-unification.py --fix (do not edit): the features
# `cargo test --workspace` resolves for crates these tests build, so `cargo test -p`
# builds them identically.
[target.'cfg(all())'.dev-dependencies]
dashboard = { workspace = true, features = ["export-types"] }
dashboard-base = { workspace = true, features = ["export-types", "test-support"] }
engine-native = { workspace = true, features = ["batch-fallback-test-counts", "test-support"] }
installed-content-naval-combat-defines = { workspace = true, features = ["test-support"] }
installed-content-naval-path = { workspace = true, features = ["test-support"] }
map-content = { workspace = true, features = ["test-support"] }
recorder-derive = { workspace = true, features = ["test-support"] }
replay = { workspace = true, features = ["default", "journal", "recording", "test-support"] }
replay-identity = { workspace = true, features = ["test-support"] }
test-unify = { workspace = true }
unify-bitflags-2 = { workspace = true }
unify-dpi = { workspace = true }
unify-indexmap = { workspace = true }
unify-once_cell = { workspace = true }
unify-tracing = { workspace = true }
unify-windows = { workspace = true }
unify-windows-sys-0-52 = { workspace = true }
unify-windows-sys-0-59 = { workspace = true }
uuid = { version = "1.26.0", default-features = false, features = ["default", "rng", "serde", "std", "v4"] }
