[package]
name = "engine-governance-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false
test = false
bench = false

[features]
test-support = ["dep:engine-executable", "dep:engine-native", "dep:engine-native-parts", "dep:engine-research", "dep:engine-focus", "engine-native-memory/batch-fallback-test-counts"]

[dependencies]
engine-native-parts = { workspace = true, optional = true }
engine-native-memory = { workspace = true, optional = true }
engine-sites.workspace = true
engine-executable = { workspace = true, optional = true }
engine-native = { workspace = true, optional = true }
engine-research = { workspace = true, optional = true }
engine-focus = { workspace = true, optional = true }

[lints]
workspace = true

# Generated by tools/check-feature-unification.py --fix (do not edit): the features
# `cargo test --workspace` resolves for crates these tests build, so `cargo test -p`
# builds them identically.
[target.'cfg(all())'.dev-dependencies]
engine-allocation = { workspace = true, features = ["test-support", "zstd"] }
engine-executable = { workspace = true, features = ["test-support"] }
engine-governance-tests = { workspace = true, features = ["engine-native-memory", "test-support"] }
engine-native-politics = { workspace = true, features = ["test-support"] }
test-unify = { workspace = true }
