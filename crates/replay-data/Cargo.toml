[package]
name = "replay-data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
capture = ["replay-rows/capture"]
test-support = [
    "capture",
    "replay-rows-intelligence/test-support",
    "replay-rows-politics/test-support",
    "replay-rows-projects/test-support",
    "replay-tables-economy/test-support",
    "replay-tables-world/test-support",
    "replay-tables-events/test-support",
    "replay-tables-air/test-support",
    "replay-tables-naval/test-support",
    "replay-tables-weather/test-support",
    "replay-tables-land/test-support",
    "replay-tables-presentation/test-support",
    "replay-tables-wars/test-support",
    "replay-tables-derived/test-support",
]

[dependencies]
replay-tables-economy.workspace = true
replay-tables-world.workspace = true
replay-tables-events.workspace = true
replay-tables-air.workspace = true
replay-tables-naval.workspace = true
replay-tables-weather.workspace = true
replay-tables-land.workspace = true
replay-tables-presentation.workspace = true
replay-tables-wars.workspace = true
replay-tables-derived.workspace = true
replay-rows-economy.workspace = true
game-model.workspace = true
replay-rows-projects.workspace = true
replay-rows-intelligence.workspace = true
replay-rows-politics.workspace = true
replay-rows.workspace = true
replay-rows-world.workspace = true
replay-rows-events.workspace = true
replay-rows-air.workspace = true
replay-rows-naval.workspace = true
replay-rows-weather.workspace = true
replay-rows-land.workspace = true
replay-rows-presentation.workspace = true
replay-rows-wars.workspace = true
replay-rows-derived.workspace = true
replay-spool.workspace = true
serde = { workspace = true, features = ["derive"] }
crc32fast = "1"
engine-allocation.workspace = true
engine-reference-values.workspace = true
weather-period.workspace = true
replay-identity.workspace = true

[dev-dependencies]
engine-native.workspace = true
engine-occupation.workspace = true

replay-identity = { workspace = true, features = ["test-support"] }
zstd = "0.13"
serde_json.workspace = true

[lints]
workspace = true

# Generated by tools/check-feature-unification.py --fix (do not edit): the features
# `cargo test --workspace` resolves for crates these tests build, so `cargo test -p`
# builds them identically.
[target.'cfg(all())'.dev-dependencies]
engine-allocation = { workspace = true, features = ["test-support", "zstd"] }
engine-executable = { workspace = true, features = ["test-support"] }
engine-native-politics = { workspace = true, features = ["test-support"] }
replay-data = { workspace = true, features = ["capture", "test-support"] }
test-unify = { workspace = true }
