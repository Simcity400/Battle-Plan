[package]
name = "replay-data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
capture = ["replay-rows/capture"]
# Shared synthetic row fixtures and decode observations for replay integration tests.
test-support = [
    "capture",
    "replay-rows-intelligence/test-support",
    "replay-rows-politics/test-support",
    "replay-rows-projects/test-support",
    "replay-tables-a/test-support",
    "replay-tables-b/test-support",
    "replay-tables-c/test-support",
    "replay-tables-d/test-support",
    "replay-tables-e/test-support",
    "replay-tables-economy/test-support",
]

[dependencies]
replay-tables-economy.workspace = true
replay-rows-economy.workspace = true
game-model.workspace = true
replay-rows-projects.workspace = true
replay-rows-intelligence.workspace = true
replay-rows-politics.workspace = true
replay-rows.workspace = true
replay-rows-derived.workspace = true
replay-tables-a.workspace = true
replay-tables-b.workspace = true
replay-tables-c.workspace = true
replay-tables-d.workspace = true
replay-tables-e.workspace = true
replay-spool.workspace = true
serde = { workspace = true, features = ["derive"] }
crc32fast = "1"
engine-allocation.workspace = true
engine-reference-values.workspace = true
weather-period.workspace = true
replay-identity.workspace = true

[dev-dependencies]
engine-native.workspace = true
engine-occupation.workspace = true

# The identity fixture its wire-form tests encode.
replay-identity = { workspace = true, features = ["test-support"] }
# Compression-size assertions for synthetic row encodings.
zstd = "0.13"
# The reduction parity tests compare states in their serialized form.
serde_json.workspace = true

# Generated by tools/check-feature-unification.py --fix (do not edit): the features
# `cargo test --workspace` resolves for crates these tests build, so `cargo test -p`
# builds them identically.
[target.'cfg(all())'.dev-dependencies]
engine-allocation = { workspace = true, features = ["test-support", "zstd"] }
engine-native = { workspace = true, features = ["batch-fallback-test-counts", "test-support"] }
replay-data = { workspace = true, features = ["capture", "test-support"] }
test-unify = { workspace = true }
