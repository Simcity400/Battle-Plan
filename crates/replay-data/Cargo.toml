[package]
name = "replay-data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
slow-tests = []
# Shared synthetic row fixtures and decode observations for replay integration tests.
test-support = []

[dependencies]
weather-period.workspace = true
engine.workspace = true
replay-identity.workspace = true

[dev-dependencies]
# The identity fixture its wire-form tests encode.
replay-identity = { workspace = true, features = ["test-support"] }
# Compression-size assertions for synthetic row encodings.
zstd = "0.13"
