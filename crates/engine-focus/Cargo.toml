[package]
name = "engine-focus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
alloc-fault-injection = ["engine-native/alloc-fault-injection"]

[dependencies]
engine-sites.workspace = true
engine-native.workspace = true
engine-research.workspace = true

[dev-dependencies]
engine-native = { workspace = true, features = ["test-support"] }
engine-governance-tests = { workspace = true, features = ["test-support"] }

# Generated by tools/check-feature-unification.py --fix (do not edit): the features
# `cargo test --workspace` resolves for crates these tests build, so `cargo test -p`
# builds them identically.
[target.'cfg(all())'.dev-dependencies]
test-unify = { workspace = true }
