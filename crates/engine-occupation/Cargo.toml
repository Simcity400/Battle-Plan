[package]
name = "engine-occupation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
alloc-fault-injection = ["engine-native-memory/alloc-fault-injection", "engine-native/alloc-fault-injection"]

[dependencies]
engine-allocation.workspace = true
engine-native-parts.workspace = true
engine-native-memory.workspace = true
engine-native-politics.workspace = true
game-model.workspace = true
engine-sites.workspace = true
engine-deployment.workspace = true
engine-native.workspace = true
replay-spool.workspace = true

[dev-dependencies]
engine-native-politics = { workspace = true, features = ["test-support"] }
engine-native-parts = { workspace = true, features = ["test-support"] }
engine-native-memory = { workspace = true, features = ["test-support"] }
engine-native = { workspace = true, features = ["test-support"] }

[lints]
workspace = true

# Generated by tools/check-feature-unification.py --fix (do not edit): the features
# `cargo test --workspace` resolves for crates these tests build, so `cargo test -p`
# builds them identically.
[target.'cfg(all())'.dev-dependencies]
engine-allocation = { workspace = true, features = ["test-support", "zstd"] }
engine-executable = { workspace = true, features = ["test-support"] }
test-unify = { workspace = true }
