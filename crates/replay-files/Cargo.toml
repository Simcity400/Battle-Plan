[package]
name = "replay-files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
test-support = []

[target.'cfg(windows)'.dependencies]
engine-allocation = { workspace = true, features = ["zstd"] }
replay.workspace = true
replay-columnar.workspace = true
replay-data.workspace = true
replay-settings.workspace = true
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading"] }

[target.'cfg(windows)'.dev-dependencies]
recorder-derive.workspace = true
replay = { workspace = true, features = ["test-support"] }
replay-capture-spool.workspace = true
replay-journal = { workspace = true, features = ["test-support"] }
replay-recording.workspace = true

[lints]
workspace = true

# Generated by tools/check-feature-unification.py --fix (do not edit): the features
# `cargo test --workspace` resolves for crates these tests build, so `cargo test -p`
# builds them identically.
[target.'cfg(all())'.dev-dependencies]
content-reader-country-names = { workspace = true, features = ["test-support"] }
content-reader-key-names = { workspace = true, features = ["test-support"] }
content-reader-localisation = { workspace = true, features = ["test-support"] }
content-reader-map = { workspace = true, features = ["test-support"] }
content-reader-province-area = { workspace = true, features = ["test-support"] }
content-reader-regions = { workspace = true, features = ["test-support"] }
engine-executable = { workspace = true, features = ["test-support"] }
engine-native = { workspace = true, features = ["batch-fallback-test-counts", "test-support"] }
recorder-derive = { workspace = true, features = ["test-support"] }
replay = { workspace = true, features = ["default", "recording", "test-support"] }
replay-capture-spool = { workspace = true, features = ["journal", "test-support"] }
replay-derive = { workspace = true, features = ["test-support"] }
replay-identity = { workspace = true, features = ["test-support"] }
test-unify = { workspace = true }
