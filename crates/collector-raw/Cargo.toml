[package]
name = "collector-raw"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
test-support = ["collector-memory/test-support"]

[dependencies]
engine.workspace = true
collector-memory.workspace = true
collector-primitives.workspace = true
collector-status.workspace = true
collector-snapshots.workspace = true
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
engine = { workspace = true, features = ["batch-fallback-test-counts"] }
collector-memory = { workspace = true, features = ["test-support"] }
collector-test-support.workspace = true
