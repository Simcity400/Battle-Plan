[package]
name = "engine-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
# Opt-in native movement-speed samples; never enabled by ordinary captures.
movement_witness = []
alloc-fault-injection = ["engine-allocation/alloc-fault-injection"]
batch-fallback-test-counts = []
test-support = ["batch-fallback-test-counts", "engine-allocation/test-support"]

[dependencies]
engine-allocation.workspace = true
engine-executable.workspace = true

[dev-dependencies]
# The denying global allocator its tests install.
engine-allocation = { workspace = true, features = ["test-support"] }

[build-dependencies]
# The guarded native-copy helper is linked once, with the workspace cc feature set.
cc = { version = "1", features = ["parallel"] }

# Generated by tools/check-feature-unification.py --fix (do not edit): the features
# `cargo test --workspace` resolves for crates these tests build, so `cargo test -p`
# builds them identically.
[target.'cfg(all())'.dev-dependencies]
engine-native = { workspace = true, features = ["batch-fallback-test-counts", "test-support"] }
test-unify = { workspace = true }
