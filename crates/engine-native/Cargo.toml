[package]
name = "engine-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
acquisition_profile = ["engine-native-memory/acquisition_profile"]
order_membership_oracle = ["acquisition_profile"]
alloc-fault-injection = ["engine-native-memory/alloc-fault-injection"]
batch-fallback-test-counts = ["engine-native-memory/batch-fallback-test-counts"]
layout-fixtures = []
test-support = ["batch-fallback-test-counts", "engine-native-memory/test-support", "layout-fixtures"]

[dependencies]
engine-native-memory.workspace = true
game-model.workspace = true
engine-sites.workspace = true
engine-allocation.workspace = true
engine-executable.workspace = true
replay-spool.workspace = true

[dev-dependencies]
engine-native-memory = { workspace = true, features = ["test-support"] }
engine-allocation = { workspace = true, features = ["test-support"] }

[lints]
workspace = true

# Generated by tools/check-feature-unification.py --fix (do not edit): the features
# `cargo test --workspace` resolves for crates these tests build, so `cargo test -p`
# builds them identically.
[target.'cfg(all())'.dev-dependencies]
engine-allocation = { workspace = true, features = ["test-support", "zstd"] }
engine-executable = { workspace = true, features = ["test-support"] }
engine-native = { workspace = true, features = ["batch-fallback-test-counts", "test-support"] }
test-unify = { workspace = true }
