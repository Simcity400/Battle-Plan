[package]
name = "collector-memory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
alloc-fault-injection = ["engine/alloc-fault-injection"]
test-support = ["dep:collector-test-support"]

[dependencies]
engine.workspace = true
replay.workspace = true
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }
collector-test-support = { workspace = true, optional = true }

[dev-dependencies]
collector-test-support.workspace = true
