[package]
name = "installed-content-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[dependencies]
job-priority.workspace = true
engine-allocation.workspace = true
engine-executable.workspace = true
installed-content-image.workspace = true
# PUC Lua 5.1, the runtime the game links, for common/defines.
mlua = { version = "0.12", default-features = false, features = ["lua51", "vendored", "send"] }
# Archive layers inflate their records as raw deflate (content::physfs_zip).
miniz_oxide = "0.8"
replay-identity.workspace = true
replay-spool.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
# Recorded game facts are zstd chunks (content::facts).
zstd = "0.13"

[dev-dependencies]
mimalloc.workspace = true
installed-content-image = { workspace = true, features = ["test-support"] }

[features]
# Hand-built fixtures for other crates' unit tests, such as
# `movement::MovementMap::from_parts`; enabled only from dev-dependencies.
test-support = ["installed-content-image/test-support", "layer-fixtures"]
# Layer fixtures without enabling additional catalogue test constructors.
layer-fixtures = []

[target.'cfg(windows)'.dependencies]
# Native folder opens and the monitors the game's SDL display indices name.
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_UI_HiDpi"] }

[target.'cfg(windows)'.dev-dependencies]
# Synthetic timestamp-preserving mutation regressions inspect file change records.
windows-sys = { workspace = true, features = ["Win32_System_IO", "Win32_System_Ioctl"] }

# Generated by tools/check-feature-unification.py --fix (do not edit): the features
# `cargo test --workspace` resolves for crates these tests build, so `cargo test -p`
# builds them identically.
[target.'cfg(all())'.dev-dependencies]
engine-allocation = { workspace = true, features = ["test-support"] }
installed-content-core = { workspace = true, features = ["layer-fixtures", "test-support"] }
replay-identity = { workspace = true, features = ["test-support"] }
test-unify = { workspace = true }
