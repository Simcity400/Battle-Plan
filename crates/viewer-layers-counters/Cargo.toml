[package]
name = "viewer-layers-counters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
test-support = [
    "content-reader-script/test-support",
    "dashboard-text/test-support",
    "engine-executable/test-support",
    "playhead/test-support",
    "replay-data/test-support",
    "replay-derive/test-support",
    "viewer-counters/test-support",
    "viewer-counter-kit/test-support",
    "viewer-counters-land/test-support",
    "viewer-counters-naval/test-support",
    "viewer-engagements/test-support",
    "viewer-foundation/test-support",
    "viewer-gpu/test-support",
    "viewer-layer-core/test-support",
    "viewer-map-modes/test-support",
    "viewer-runtime/test-support",
    "viewer-unit-reads/test-support",
]

[dependencies]
content-reader-map.workspace = true
content-reader-script.workspace = true
viewer-counter-kit.workspace = true
viewer-counters-land.workspace = true
viewer-counters-naval.workspace = true
dashboard-text = { workspace = true }
engine-executable = { workspace = true }
playhead = { path = "../playhead" }
replay-columnar = { workspace = true }
replay-data = { workspace = true }
replay-derive = { workspace = true }
serde_json = { workspace = true }
viewer-counters.workspace = true
viewer-engagements = { workspace = true }
viewer-foundation = { workspace = true }
viewer-gpu = { workspace = true }
viewer-layer-core = { workspace = true }
viewer-map-modes = { workspace = true }
viewer-runtime = { workspace = true }
viewer-unit-reads = { workspace = true }

[dev-dependencies]
engine-heap = { workspace = true }
replay-recording.workspace = true
synthetic-game = { workspace = true }
viewer-layers-counters = { workspace = true, features = ["test-support"] }

[lints]
workspace = true

# Generated by tools/check-feature-unification.py --fix (do not edit): the features
# `cargo test --workspace` resolves for crates these tests build, so `cargo test -p`
# builds them identically.
[target.'cfg(all())'.dev-dependencies]
content-reader-gui = { workspace = true, features = ["test-support"] }
content-reader-map = { workspace = true, features = ["test-support"] }
content-reader-mesh = { workspace = true, features = ["layer-fixtures"] }
content-reader-naval-path = { workspace = true, features = ["test-support"] }
content-reader-politics = { workspace = true, features = ["test-support"] }
content-reader-province-area = { workspace = true, features = ["test-support"] }
content-reader-sound = { workspace = true, features = ["test-support"] }
content-reader-weather = { workspace = true, features = ["test-support"] }
dashboard-effects = { workspace = true, features = ["test-support"] }
engine-native-land = { workspace = true, features = ["test-support"] }
map-content = { workspace = true, features = ["test-support"] }
recorder-derive = { workspace = true, features = ["test-support"] }
replay = { workspace = true, features = ["default", "recording", "test-support"] }
replay-capture-spool = { workspace = true, features = ["journal", "test-support"] }
replay-identity = { workspace = true, features = ["test-support"] }
replay-tools = { workspace = true, features = ["default", "journal"] }
test-unify = { workspace = true }
unify-bitflags-2 = { workspace = true }
unify-dpi = { workspace = true }
unify-indexmap = { workspace = true }
unify-once_cell = { workspace = true }
unify-tracing = { workspace = true }
unify-uuid = { workspace = true }
unify-winapi-util = { workspace = true }
unify-windows = { workspace = true }
unify-windows-sys-0-52 = { workspace = true }
unify-windows-sys-0-59 = { workspace = true }
viewer-map-icons = { workspace = true, features = ["test-support"] }
viewer-scene-base = { workspace = true, features = ["test-support"] }
viewer-terrain = { workspace = true, features = ["test-support"] }
viewer-unit-history = { workspace = true, features = ["test-support"] }
