[package]
name = "collector-lifetime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
test-support = []

[dependencies]
engine-mutations.workspace = true
engine-native.workspace = true
serde = { workspace = true, features = ["derive"] }
collector-status.workspace = true
collector-hooks.workspace = true
collector-timing.workspace = true

[dev-dependencies]
collector-hooks = { workspace = true, features = ["test-support"] }
collector-test-support.workspace = true
windows-sys = { workspace = true, features = ["Win32_System_Diagnostics_Debug"] }
