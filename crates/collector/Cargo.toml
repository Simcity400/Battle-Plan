[package]
name = "collector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
# Change-certified families reuse unchanged data and compare a rotating hourly slice of it
# (src/sampled_verify.rs); each `*_verify` feature compares every carried entry, for diagnosis.
# A new family keeps its `*_verify` feature in this list until its hooks' live burn-in passes
# (owner rule: verify stays on during burn-in); weather, visibility and raid_intel are in theirs.
default = ["politics_capture", "portrait_changes", "advisor_changes", "relation_changes", "opinion_changes", "history_changes", "character_changes", "flag_changes", "building_changes", "advisor_pool_changes", "party_leader_changes", "variable_changes", "party_changes", "wing_changes", "roster_changes", "political_status_changes", "mission_changes", "rail_changes", "territory_changes", "navy_ledger_changes", "air_base_changes", "army_stat_changes", "country_input_changes", "raid_changes", "appointment_changes", "naval_tree_changes", "area_changes", "air_record_changes", "world_input_changes", "retreat_ban_changes", "local_subunit_changes", "template_changes", "ship_model_changes", "technology_changes", "focus_changes", "projects_changes", "character_record_changes", "appearance_changes", "counter_changes", "war_changes", "province_unit_changes", "air_base_carry_changes", "unit_leader_changes", "census_changes", "unit_leader_trait_changes", "province_changes", "weather_changes", "weather_verify", "visibility_changes", "visibility_verify", "raid_intel_changes", "raid_intel_verify"]
politics_capture = []
advisor_changes = []
# Bounded per-section wall/cycle measurements for diagnosing slow captures.
advisor_profile = ["advisor_changes"]
# Bounded per-hour slow-callback phase and thread-cycle diagnostics.
callback_profile = []
# Diagnostic oracle, off by default: also record the native values playback derives a breakdown
# from inputs (the power-balance description trees) for the hour's sampled slice, for
# `recorder derived` to compare with the derivation.
breakdown_witness = []
# Diagnostic checked-allocation injection; absent from normal builds.
alloc-fault-injection = ["engine/alloc-fault-injection"]
# Parent-run synthetic exception oracle; its native DLL is built separately.
tap-foreign-probe = []
# Diagnostic: read every carried advisor afresh and compare.
advisor_verify = ["advisor_changes"]
portrait_changes = []
# Re-read AirCountryRelations only for countries whose vectors a native writer touched.
relation_changes = []
# Re-read air histories only where a native writer touched them.
history_changes = []
# Diagnostic: compare every carried history each hour instead of the hourly slice.
history_verify = ["history_changes"]
# Diagnostic: copy and compare every carried country's relation vectors each hour.
relation_verify = ["relation_changes"]
# Relation opinion writer hooks: observed relations refreshes read only the statuses a writer changed.
opinion_changes = []
# Diagnostic: compare every replayed owner of each opinion refresh with a full read.
opinion_verify = ["opinion_changes"]
# Diagnostic: read every carried portrait afresh and compare.
portrait_verify = ["portrait_changes"]
# Carry a character's CharacterRoleTraits country-leader and advisor rows, and its advisor roles'
# modifier caches and tooltip keys, until a native writer touches it; the role sites share the
# advisor family's patches.
character_changes = ["advisor_changes"]
# Diagnostic: read every carried character afresh, publish its rows and poison on a difference.
character_verify = ["character_changes"]
# Carry a ScriptFlags scope's rows until a native writer touches its flag manager.
flag_changes = []
# Also read every carried flag manager afresh, publish its rows and poison on a difference.
flag_verify = ["flag_changes"]
# Carry a state's or province's building rows until a native writer touches its building status.
building_changes = []
# Also read every carried building status afresh, publish its rows and poison on a difference.
building_verify = ["building_changes"]
# Carry a country's AvailableAdvisors rows until a native writer touches its pool or a listed
# advisor's character, and the AdvisorTokens table until a writer touches it; character
# certificates come from `character_changes`.
advisor_pool_changes = ["character_changes"]
# Also read every carried pool and token table afresh, publish the rows and poison on a difference.
advisor_pool_verify = ["advisor_pool_changes"]
# Publish the latest complete HiredAdvisors walk over an hour no appointed-list, pool, character or
# roster writer ran (the advisor-pool family observes the appointed lists); once a day such an hour
# walks and compares.
appointment_changes = ["advisor_pool_changes", "roster_changes"]
# Walk HiredAdvisors every hour and compare each hour a quiet hour would carry with the held walk.
# On by default during the burn-in of the appointment hooks.
appointment_verify = ["appointment_changes"]
# Publish the latest complete CountryCharacters and CountryRetiredCharacters walk over an hour no
# pool (the advisor-pool family observes every record writer), character or roster writer ran;
# once a day such an hour walks and compares.
character_record_changes = ["advisor_pool_changes", "roster_changes"]
# Walk the records every hour and compare each hour a quiet hour would carry with the held walk.
# On by default during the burn-in of the record hooks.
character_record_verify = ["character_record_changes"]
# Carry a country's PartyLeaders rows until a native writer touches one of its parties or a listed
# leader's character; character certificates come from `character_changes`.
party_leader_changes = ["character_changes"]
# Also read every carried country afresh, publish its rows and poison on a difference.
party_leader_verify = ["party_leader_changes"]
# Carry a ScriptVariables store's entries and keys until a native writer touches it; its seed is
# read every hour.
variable_changes = []
# Also read every carried variable store afresh, publish its rows and poison on a difference.
variable_verify = ["variable_changes"]
# Carry a country's PoliticalParties rows (popularity and the ruling flag are read every hour)
# until a native writer touches one of its parties or its party list changes, and its ActiveIdeas
# rows until its idea list changes.
party_changes = []
# Also read every carried country afresh, publish its rows and poison on a difference.
party_verify = ["party_changes"]
# Carry an air wing's WingEquipment rows until a native writer touches its equipment pool.
wing_changes = []
# Also read every carried wing afresh, publish its rows and poison on a difference.
wing_verify = ["wing_changes"]
# Observe the character roster arrays and scientist roles: Characters and the role census, and
# ScriptFlags' scope walk, carry a quiet roster hour; CharacterRoleTraits carries its scientist
# rows over a quiet scientist hour. Needs the advisor and advisor-pool families' forwarders.
roster_changes = []
# Read every hour afresh and compare with what a quiet roster or scientist hour would carry.
roster_verify = ["roster_changes"]
# Observe capitals, elections, ruling parties, party and idea arrays and popularity: the Politics
# walk carries Politics, PoliticalParties, ActiveIdeas and PartyLeaders over a quiet hour. Needs
# the politics capture family's forwarder.
political_status_changes = []
# Read every hour afresh and compare with what a quiet politics hour would carry.
political_status_verify = ["political_status_changes"]
# Carry a country's AirRegionalMissions registrations until a native writer registers or
# unregisters one of its missions; its headers and the wing census are read every hour.
mission_changes = []
# Also read every carried country afresh, publish its rows and poison on a difference.
mission_verify = ["mission_changes"]
# Publish a batch of 64 rail slots (RailCooldowns rows with their building and selection inputs,
# indexed levels and RailEdges rows) from its last complete read until a native writer marks one
# of its provinces; the daily countdown marks every province on the cooldown list, which is read
# every hour.
rail_changes = []
# Also read every batch afresh, compare each carryable info, publish the fresh outputs and poison
# on a difference. On by default during the burn-in of the batch carry.
rail_verify = ["rail_changes"]
# Carry a state's States row and a province's Provinces row until a native writer marks its state
# or province (manpower, StateFlags and BorderConflicts are read every hour).
territory_changes = []
# Also read every carried state and province afresh, publish its row and poison on a difference.
territory_verify = ["territory_changes"]
# NavalMissionLedgers reads no region ledger header of a navy whose registered-mission set is empty
# (every ledger writer writes the set in the same call); the sets are read every hour.
navy_ledger_changes = []
# Also read every skippable navy's ledgers, publish them and stop skipping on a nonempty ledger.
navy_ledger_verify = ["navy_ledger_changes"]
# AirBaseRegistrations reads a base's country-container vector only at the slot words of the
# containers its dense list names (both lists are written in the same call); a read base's
# containers, pools, wings, capacity and fuel are read every hour.
air_base_changes = []
# Also scan every fast-path base's whole slot vector outside the recorded log, compare, and stop the
# fast path on a difference. On by default during its burn-in.
air_base_verify = ["air_base_changes"]
# A state air base's AirBaseRegistrations subtree is carried from its latest fresh read while no
# hooked writer of its containers, pools or wings (engine::air_base_mutations) touched its handle;
# its container countries' links are resolved every hour.
# The capacity setter and base destructor are the raid and ship model families' patches.
air_base_carry_changes = ["raid_changes", "ship_model_changes"]
# Also read every carryable base afresh, compare it with its held subtree and stop carrying on a
# difference.
air_base_carry_verify = ["air_base_carry_changes"]
# Carry a division's DivisionStatus.attack_stats (its stat block's attack operands) until
# The active-stat writer rewrites the stat block (the army and stat block are read every hour).
army_stat_changes = []
# Also read every carried division's stat block afresh, publish it and poison on a difference.
army_stat_verify = ["army_stat_changes"]
# Serve a ship's own ShipModels inputs (fixed fields, pool entries, heap fallback sprite,
# experience and medal-store modifiers) from its held read until a hooked writer touches the ship,
# its medal store or its carrier base (task forces, locations, countries, weather and variants are
# read every hour).
ship_model_changes = []
# Also read every carried ship afresh, publish it and poison on a difference. On by default during
# its burn-in.
ship_model_verify = ["ship_model_changes"]
# CountryStabilityInputs/Lines and the research tables read, beside their daily slice, only the
# countries a native writer of their rows marked since the previous hour (the politics, political
# status, party leader, character role, roster, relation, territory, raid, opinion and advisor pool
# families forward the writers they patch); a country no writer marked keeps the rows of its last
# read until its slice.
country_input_changes = []
# Also read every country every hour, compare each unmarked one with its last read and poison on a
# difference. On by default during its burn-in.
country_input_verify = ["country_input_changes"]
# AirRegionCombat reads a regional air-combat holder only where the air-combat record updater
# wrote it (its records from the previous capture's hour on) and carries the others.
air_record_changes = []
# Also read every carried holder whole, publish it and poison on a difference. On by default during
# its burn-in.
air_record_verify = ["air_record_changes"]
# ResearchTechnologies (and its TechnologyDefinitions) reads, beside its daily slice, the countries a
# writer of a technology's level, classifier, researched membership or applied bonuses marked; the
# country input family's hooks mark them. Without it every country is read every hour.
technology_changes = ["country_input_changes"]
# Also read every country's roster every hour, compare each unmarked one with its last read and
# poison on a difference. Off by default: its burn-in passed.
technology_verify = ["technology_changes"]
# Focus and CompletedFocuses read every country owning a state after the daily tick and, in between, the countries
# a national focus writer marked; the country input family's hooks mark them. Without it every
# country is read every hour.
focus_changes = ["country_input_changes"]
# Also read every country's focus every hour, compare each unmarked one with its last read and
# poison on a difference. Off by default: its burn-in passed.
focus_verify = ["focus_changes"]
# Projects and ProjectHistory read every country owning a state after the daily tick and, in between, the
# countries a special project writer marked; the country input family's hooks mark them. Without it
# every country is read every hour.
projects_changes = ["country_input_changes"]
# Also read every country's project pool every hour, compare each unmarked one with its last read
# and poison on a difference. Off by default: its burn-in passed.
projects_verify = ["projects_changes"]
# WeatherProvinces reads, in an ordinary hour, only the province records the native hourly pass
# visited (the weather pass's window from the cursor +0x58, provinces_per_update wide) and
# carries the rest; the weather writers outside that window (reseed, reset, console, load) are
# counted by the country input family's hooks, and any of them, a jump of the cursor or a gap reads
# every record. Without it every record is read every hour.
weather_changes = ["country_input_changes"]
# Also read every carried province record every hour and compare it, disabling the window read on a
# difference. On by default during its burn-in.
weather_verify = ["weather_changes"]
# CountryAppearance reads, beside its daily slice, the countries a writer of their appearance fields
# marked (the cosmetic tag, colour copy, graphical culture, localized name and subject writers, and
# the forwarded country and diplomacy resets, ruling party, party leader and character role
# writers); the country input family's hooks mark them. Without it every country is read every hour.
appearance_changes = ["country_input_changes"]
# Also read every country's appearance every hour, compare each unmarked one with its last read and
# poison on a difference. On by default during its burn-in.
appearance_verify = ["appearance_changes"]
# CountryCounterInputs reads, beside its daily slice, the countries a writer of their counter inputs
# marked (the modifier rebuild, the war body, division rosters, unit leaders, neighbours, MIO
# policies, and the forwarded resets, wartime allies, relation slots, state owners and controllers,
# cores and character pools); the country input family's hooks mark them. Without it every country
# is read every hour.
counter_changes = ["country_input_changes"]
# Also read every country's counter inputs every hour, compare each unmarked one with its last read
# and poison on a difference. On by default during its burn-in.
counter_verify = ["counter_changes"]
# CountryVisibility carries an unmarked country's raw accumulator entry under the country input
# family's modifier-rebuild and forwarded country-reset marks, beside its daily sampled slice.
# The live definition and eligibility metadata still apply every hour. Without it every country is read.
visibility_changes = ["country_input_changes"]
# Read and compare every unmarked country's held raw entry. On by default during burn-in.
visibility_verify = ["visibility_changes"]
# Diagnostic, off by default: record the native attack operands of another slice of divisions each
# hour (DivisionStatus.attack, the stat block's entries plus the live terrains' adjusters) for the
# recorder's derivation check.
attack_witness = []
# Read a raid state input owner (state or country) within the hour a native writer marks it, beside
# its daily slice; every unobserved hour reads every owner. Needs the building family's forwarder.
raid_changes = []
# Read every raid state input owner every hour and compare each unmarked one with its previous read.
# On by default during the hooks' burn-in.
raid_verify = ["raid_changes"]
# Carry a country's and a commander's naval hover tree (NavalModifierTrees) until a native writer
# rebuilds it; every other reached source tree is read each hour a live naval combat reaches it.
naval_tree_changes = []
# Also read every carryable tree afresh, publish it and poison on a difference. On by default
# during the family's burn-in.
naval_tree_verify = ["naval_tree_changes"]
# Diagnostic oracle, off by default: also read every reached naval hover source tree afresh and
# record it per occurrence in NavalModifierTreeSamples, for `recorder derived`.
naval_tree_oracle = []
# RaidIntelInputs answers a country's CRYPTO_STRENGTH and INTELLIGENCE_AGENCY_DEFENSE raw values
# from its held read, skipping the accumulator entries copy, while its accumulator header and its
# naval tree country certificate (modifier recalculation, country appearance reset) are the held
# read's. Without it every country's accumulator is copied every hour.
raid_intel_changes = ["naval_tree_changes"]
# Also read every carryable country every hour, compare it with its held answers and poison the
# naval tree certificates on a difference. On by default during its burn-in.
raid_intel_verify = ["raid_intel_changes"]
# Read ProvinceNames, NavalRegionAccess, the world tension tables and DynamicModifiers every hour,
# publishing a table (a country, for DynamicModifiers) none of its native writers touched from its
# held read.
world_input_changes = []
# Also read every quiet hour afresh, compare it with the held read and poison on a difference. On
# by default during the family's burn-in.
world_input_verify = ["world_input_changes"]
# Carry a province's ProvinceUnitOrder lists until the hooked append or erase marks it.
province_unit_changes = []
# Also read every carryable province afresh, compare it with the held lists and poison on a
# difference. On by default during the family's burn-in.
province_unit_verify = ["province_unit_changes"]
# Carry a commander's retreat bans (DivisionRetreatBans) until a writer of its modifier blocks
# runs; the naval tree family's commander patches forward those writers.
retreat_ban_changes = ["naval_tree_changes"]
# Also read every reached commander afresh, publish it and poison on a difference. On by default
# during the family's burn-in.
retreat_ban_verify = ["retreat_ban_changes"]
# Label each province's controller and owner areas and record each controller area's
# representative and contacts, reading again only the areas of provinces a territory writer marked
# (or that changed area), the areas they left and their neighbours' areas.
area_changes = []
# Also read every area every hour, compare it with what the carry would publish and poison on a
# difference. On by default during the family's burn-in.
area_verify = ["area_changes"]
# Carry a province's Provinces row until a territory writer marks the province or its held state
# (or the building family forwards a write at it); provinces in a border conflict and the
# fort_bunker operand of fortified provinces are read every hour.
province_changes = []
# Also read every province every hour, compare each carryable one with its held row and poison on
# a difference. On by default during the family's burn-in.
province_verify = ["province_changes"]
# Carry a country's CountryLocalSubunits rows until a native writer touches its local sub-unit
# clones or their requirements.
local_subunit_changes = []
# Also read every carryable country afresh, publish its rows and poison on a difference. On by
# default during the family's burn-in.
local_subunit_verify = ["local_subunit_changes"]
# Carry a division template's fallback name key, the one DivisionTemplates field the hourly icon
# walk does not read for every template, until a native writer touches the template.
template_changes = []
# Also read every carryable key afresh, publish it and poison on a difference.
template_verify = ["template_changes"]
# Carry WarRelations between hours, reading only each war's casualty counters, while no forwarded
# writer of the war set or its fixed fields ran.
war_changes = []
# Also walk every quiet hour and poison on a difference. On by default during the family's
# burn-in.
war_verify = ["war_changes"]
# Carry UnitLeaders rows on quiet roster hours, reading only the leaders a hooked writer touched
# (and the slice). The naval tree family forwards the leader constructors and destructor.
unit_leader_changes = ["roster_changes", "naval_tree_changes"]
# Also read every carryable leader each quiet hour and poison on a difference. On by default during
# the family's burn-in.
unit_leader_verify = ["unit_leader_changes"]
# Keep the roster job's role census without gathering it while no hooked or forwarded writer of a
# gathered field ran, gathering only the slice. The advisor and roster families forward their sites.
census_changes = ["advisor_changes", "roster_changes"]
# Also gather and compare every row each hour. On by default during the family's burn-in.
census_verify = ["census_changes"]
# Carry each unit leader's UnitLeaderTraits rows while no writer of its trait vector ran, reading only
# the leaders the naval tree family's forwarded modifier recalculation tail or lifetime sites touched.
unit_leader_trait_changes = ["naval_tree_changes"]
# Also read every carryable leader each hour and poison on a difference. On by default during the
# family's burn-in.
unit_leader_trait_verify = ["unit_leader_trait_changes"]

[dependencies]
engine.workspace = true
replay.workspace = true
retour = "0.3"
crossbeam-queue = "0.3"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Performance", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Kernel", "Win32_System_Memory", "Win32_System_SystemInformation"] }

[[example]]
name = "tap_foreign_unwind"
required-features = ["tap-foreign-probe"]

[dev-dependencies]
engine = { workspace = true, features = ["batch-fallback-test-counts"] }

[build-dependencies]
cc = "1"
