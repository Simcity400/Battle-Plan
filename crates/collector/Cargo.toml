[package]
name = "collector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
default = ["portrait_changes", "advisor_changes"]
advisor_changes = []
# Bounded per-section wall/cycle measurements for diagnosing slow captures.
advisor_profile = ["advisor_changes"]
# Bounded per-hour slow-callback phase and thread-cycle diagnostics.
callback_profile = []
# Diagnostic acquisition checks every proposed advisor cache hit.
advisor_verify = ["advisor_changes"]
portrait_changes = []
# Diagnostic capture reads all entries and checks every proposed cache hit.
portrait_verify = ["portrait_changes"]

[dependencies]
engine = { path = "../engine" }
replay = { path = "../replay" }
retour = "0.3"
crossbeam-queue = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Performance", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Kernel", "Win32_System_Memory", "Win32_System_SystemInformation"] }
