executor_join_help = ["collector-workers/executor_join_help"]
focus_changes = ["country_input_changes", "collector-observers/focus_changes"]
naval_tree_changes = ["collector-observers/naval_tree_changes"]
naval_tree_oracle = ["collector-observers/naval_tree_oracle"]
opinion_changes = ["collector-observers/opinion_changes"]
order_membership_changes = ["collector-observers/order_membership_changes"]
order_membership_oracle = ["acquisition_profile", "engine-native/order_membership_oracle", "collector-observers/order_membership_oracle"]
phase_cpu = ["collector-workers/phase_cpu"]
