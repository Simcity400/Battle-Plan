province_combat_changes = ["collector-observers/province_combat_changes"]
province_unit_changes = ["collector-divisions/province_unit_changes"]
raid_changes = ["collector-observers/raid_changes"]
rail_changes = ["collector-observers/rail_changes"]
retreat_ban_changes = ["naval_tree_changes", "collector-observers/retreat_ban_changes"]
roster_changes = ["collector-observers/roster_changes"]
ship_model_changes = ["collector-ship-models/ship_model_changes"]
tap-foreign-probe = ["collector-observers/tap-foreign-probe", "collector-land-events/tap-foreign-probe"]
technology_changes = ["country_input_changes", "collector-observers/technology_changes"]
territory_changes = ["collector-observers/territory_changes"]
test-support = ["collector-air/test-support", "collector-divisions/test-support", "collector-extended-support/test-support", "collector-land-events/test-support", "collector-memory/test-support", "collector-naval-management/test-support", "collector-observers/test-support", "collector-primitives/test-support", "collector-raw/test-support", "collector-ship-models/test-support", "collector-workers/test-support", "dep:collector-test-support"]
