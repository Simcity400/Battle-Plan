unit_leader_trait_changes = ["naval_tree_changes", "collector-observers/unit_leader_trait_changes"]
visibility_changes = ["country_input_changes", "collector-observers/visibility_changes"]
war_changes = ["collector-observers/war_changes"]
weather_changes = ["country_input_changes", "collector-observers/weather_changes"]
wing_changes = ["collector-observers/wing_changes", "collector-air/wing_changes"]
worker_sampler = ["collector-workers/worker_sampler"]
world_input_changes = ["collector-observers/world_input_changes"]

[dependencies]
engine-native-parts.workspace = true
engine-native-memory.workspace = true
engine-native-politics.workspace = true
engine-native-air.workspace = true
collector-air.workspace = true
collector-divisions.workspace = true
collector-extended-support.workspace = true
collector-land-events.workspace = true
