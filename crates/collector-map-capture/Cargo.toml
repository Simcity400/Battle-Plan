[package]
name = "collector-map-capture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
default = ["order_membership_changes", "opinion_changes", "character_changes", "advisor_pool_changes", "wing_changes", "roster_changes", "political_status_changes", "rail_changes", "territory_changes", "air_base_changes", "country_input_changes", "raid_changes", "naval_tree_changes", "area_changes", "world_input_changes", "retreat_ban_changes", "ship_model_changes", "technology_changes", "focus_changes", "projects_changes", "appearance_changes", "counter_changes", "war_changes", "province_unit_changes", "province_combat_changes", "air_base_carry_changes", "unit_leader_changes", "census_changes", "unit_leader_trait_changes", "province_changes", "weather_changes", "visibility_changes"]
acquisition_profile = ["engine-native/acquisition_profile", "collector-memory/acquisition_profile", "collector-divisions/acquisition_profile"]
advisor_pool_changes = ["character_changes", "collector-observers/advisor_pool_changes"]
air_base_carry_changes = ["raid_changes", "ship_model_changes", "collector-observers/air_base_carry_changes"]
air_base_changes = ["collector-air/air_base_changes"]
alloc-fault-injection = ["engine-allocation/alloc-fault-injection", "engine-land-inputs/alloc-fault-injection", "engine-native-memory/alloc-fault-injection", "collector-memory/alloc-fault-injection"]
appearance_changes = ["country_input_changes", "collector-observers/appearance_changes"]
area_changes = ["collector-observers/area_changes"]
callback_profile = ["collector-workers/callback_profile"]
census_changes = ["roster_changes", "collector-observers/census_changes"]
character_changes = ["collector-observers/character_changes"]
counter_changes = ["country_input_changes", "collector-observers/counter_changes"]
