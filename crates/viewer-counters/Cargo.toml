[package]
name = "viewer-counters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
test-support = ["viewer-foundation/test-support"]

[dependencies]
engine-executable.workspace = true
engine-native.workspace = true
installed-content-abilities.workspace = true
installed-content-core.workspace = true
installed-content-country-names.workspace = true
installed-content-gfx.workspace = true
installed-content-image.workspace = true
installed-content-localisation.workspace = true
installed-content-naval-path.workspace = true
installed-content-regions.workspace = true
installed-content-settings.workspace = true
installed-content-states.workspace = true
replay-data.workspace = true
replay-derive.workspace = true
replay-frame.workspace = true
serde_json.workspace = true
viewer-foundation = { path = "../viewer-foundation" }
dashboard-core.workspace = true
dashboard-text.workspace = true
[dev-dependencies]
mimalloc.workspace = true
installed-content-abilities = { workspace = true, features = ["test-support"] }
installed-content-core = { workspace = true, features = ["test-support"] }
installed-content-country-names = { workspace = true, features = ["test-support"] }
installed-content-gfx = { workspace = true, features = ["test-support"] }
installed-content-image = { workspace = true, features = ["test-support"] }
installed-content-localisation = { workspace = true, features = ["test-support"] }
installed-content-naval-path = { workspace = true, features = ["test-support"] }
installed-content-regions = { workspace = true, features = ["test-support"] }
installed-content-settings = { workspace = true, features = ["test-support"] }
installed-content-states = { workspace = true, features = ["test-support"] }
viewer-foundation = { path = "../viewer-foundation", features = ["test-support"] }

# Generated by tools/check-feature-unification.py --fix (do not edit): the features
# `cargo test --workspace` resolves for crates these tests build, so `cargo test -p`
# builds them identically.
[target.'cfg(all())'.dev-dependencies]
dashboard-text = { workspace = true, features = ["test-support"] }
engine-native = { workspace = true, features = ["batch-fallback-test-counts", "test-support"] }
replay = { workspace = true, features = ["test-support"] }
replay-data = { workspace = true, features = ["test-support"] }
replay-identity = { workspace = true, features = ["test-support"] }
shader-pipeline = { path = "../shader-pipeline", features = ["test-support"] }
test-unify = { workspace = true }
unify-dpi = { workspace = true }
unify-indexmap = { workspace = true }
unify-once_cell = { workspace = true }
unify-uuid = { workspace = true }
unify-windows = { workspace = true }
unify-windows-core = { workspace = true }
unify-windows-sys-0-52 = { workspace = true }
unify-windows-sys-0-59 = { workspace = true }
viewer-counters = { path = ".", features = ["test-support"] }
