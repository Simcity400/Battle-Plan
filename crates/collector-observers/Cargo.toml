[package]
name = "collector-observers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
test-support = ["collector-certificates/test-support", "collector-extended-support/test-support"]
default = ["order_membership_changes", "advisor_changes", "opinion_changes", "character_changes", "advisor_pool_changes", "wing_changes", "roster_changes", "political_status_changes", "rail_changes", "territory_changes", "country_input_changes", "raid_changes", "naval_tree_changes", "area_changes", "world_input_changes", "retreat_ban_changes", "ship_model_changes", "technology_changes", "focus_changes", "projects_changes", "appearance_changes", "counter_changes", "war_changes", "air_base_carry_changes", "unit_leader_changes", "census_changes", "unit_leader_trait_changes", "province_changes", "province_combat_changes", "weather_changes", "visibility_changes"]
advisor_changes = []
advisor_pool_changes = ["character_changes"]
air_base_carry_changes = ["raid_changes", "ship_model_changes"]
appearance_changes = ["country_input_changes"]
area_changes = []
census_changes = ["advisor_changes", "roster_changes"]
character_changes = ["advisor_changes"]
counter_changes = ["country_input_changes"]
country_input_changes = []
focus_changes = ["country_input_changes"]
naval_tree_changes = []
naval_tree_oracle = []
opinion_changes = []
order_membership_changes = []
order_membership_oracle = []
political_status_changes = []
projects_changes = ["country_input_changes"]
province_changes = []
province_combat_changes = []
raid_changes = []
rail_changes = []
retreat_ban_changes = ["naval_tree_changes"]
roster_changes = []
ship_model_changes = []
tap-foreign-probe = []
technology_changes = ["country_input_changes"]
territory_changes = []
unit_leader_changes = ["roster_changes", "naval_tree_changes"]
unit_leader_trait_changes = ["naval_tree_changes"]
visibility_changes = ["country_input_changes"]
war_changes = []
weather_changes = ["country_input_changes"]
wing_changes = []
world_input_changes = []

[dependencies]
engine-native-parts.workspace = true
engine-native-memory.workspace = true
engine-native-politics.workspace = true
engine-native-air.workspace = true
engine-sites.workspace = true
engine-air-history.workspace = true
engine-allocation.workspace = true
engine-decisions.workspace = true
engine-events.workspace = true
engine-mutations.workspace = true
engine-native.workspace = true
engine-naval-history.workspace = true
engine-occupation.workspace = true
engine-production.workspace = true
engine-projects.workspace = true
engine-raid-inputs.workspace = true
engine-railways.workspace = true
engine-resources.workspace = true
engine-scripts.workspace = true
replay-data.workspace = true
serde = { workspace = true, features = ["derive"] }
collector-certificates.workspace = true
collector-extended-support.workspace = true
collector-hooks.workspace = true
collector-lifetime.workspace = true
collector-memory.workspace = true
collector-primitives.workspace = true
collector-status.workspace = true
collector-timing.workspace = true
crossbeam-queue = "0.3"
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Threading"] }

[dev-dependencies]
engine-native-politics = { workspace = true, features = ["test-support"] }
engine-native-parts = { workspace = true, features = ["test-support"] }
engine-native-memory = { workspace = true, features = ["test-support"] }
engine-native-air = { workspace = true, features = ["test-support"] }
engine-research.workspace = true
engine-native = { workspace = true, features = ["batch-fallback-test-counts", "test-support"] }
collector-test-support.workspace = true
serde_json.workspace = true
collector-extended-support = { workspace = true, features = ["test-support"] }
collector-memory = { workspace = true, features = ["test-support"] }
collector-primitives = { workspace = true, features = ["test-support"] }
collector-certificates = { workspace = true, features = ["test-support"] }
collector-hooks = { workspace = true, features = ["test-support"] }
collector-timing = { workspace = true, features = ["test-support"] }
collector-lifetime = { workspace = true, features = ["test-support"] }

[build-dependencies]
cc = "1"

[lints]
workspace = true

# Generated by tools/check-feature-unification.py --fix (do not edit): the features
# `cargo test --workspace` resolves for crates these tests build, so `cargo test -p`
# builds them identically.
[target.'cfg(all())'.dev-dependencies]
collector-observers = { workspace = true, features = ["advisor_changes", "advisor_pool_changes", "air_base_carry_changes", "appearance_changes", "area_changes", "census_changes", "character_changes", "counter_changes", "country_input_changes", "default", "focus_changes", "naval_tree_changes", "opinion_changes", "order_membership_changes", "political_status_changes", "projects_changes", "province_changes", "province_combat_changes", "raid_changes", "rail_changes", "retreat_ban_changes", "roster_changes", "ship_model_changes", "technology_changes", "territory_changes", "test-support", "unit_leader_changes", "unit_leader_trait_changes", "visibility_changes", "war_changes", "weather_changes", "wing_changes", "world_input_changes"] }
engine-allocation = { workspace = true, features = ["test-support", "zstd"] }
engine-executable = { workspace = true, features = ["test-support"] }
engine-native-land = { workspace = true, features = ["test-support"] }
replay-data = { workspace = true, features = ["capture", "test-support"] }
replay-identity = { workspace = true, features = ["test-support"] }
test-unify = { workspace = true }
unify-windows-sys-0-52 = { workspace = true }
