[package]
name = "content-reader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[dependencies]
content-reader-defines.workspace = true
content-reader-gui.workspace = true
content-reader-image.workspace = true
content-reader-key-names.workspace = true
content-reader-layers.workspace = true
content-reader-map.workspace = true
content-reader-mesh.workspace = true
content-reader-military.workspace = true
content-reader-parser.workspace = true
content-reader-politics.workspace = true
content-reader-script.workspace = true
content-reader-abilities.workspace = true
content-reader-country-names.workspace = true
content-reader-division-names.workspace = true
content-reader-equipment-graphics.workspace = true
content-reader-events.workspace = true
content-reader-focus.workspace = true
content-reader-gfx.workspace = true
content-reader-localisation.workspace = true
content-reader-naval-combat-defines.workspace = true
content-reader-naval-path.workspace = true
content-reader-province-area.workspace = true
content-reader-raids.workspace = true
content-reader-regions.workspace = true
content-reader-scripted-localisation.workspace = true
content-reader-settings.workspace = true
content-reader-state-categories.workspace = true
content-reader-states.workspace = true
content-reader-unit-path.workspace = true
content-reader-wargoals.workspace = true
content-reader-weather.workspace = true

[dev-dependencies]
content-reader-image = { workspace = true, features = ["test-support"] }
content-reader-layers = { workspace = true, features = ["layer-fixtures", "test-support"] }
content-reader-script = { workspace = true, features = ["layer-fixtures", "test-support"] }
content-reader-division-names = { workspace = true, features = ["layer-fixtures"] }

[features]
test-support = [
    "content-reader-image/test-support", "content-reader-layers/test-support", "content-reader-script/test-support",
    "content-reader-gui/test-support",
    "content-reader-key-names/test-support",
    "content-reader-map/test-support",
    "content-reader-mesh/test-support",
    "content-reader-politics/test-support",
    "content-reader-abilities/test-support",
    "content-reader-country-names/test-support",
    "content-reader-division-names/test-support",
    "content-reader-equipment-graphics/test-support",
    "content-reader-events/test-support",
    "content-reader-focus/test-support",
    "content-reader-gfx/test-support",
    "content-reader-localisation/test-support",
    "content-reader-naval-combat-defines/test-support",
    "content-reader-naval-path/test-support",
    "content-reader-province-area/test-support",
    "content-reader-raids/test-support",
    "content-reader-regions/test-support",
    "content-reader-scripted-localisation/test-support",
    "content-reader-settings/test-support",
    "content-reader-state-categories/test-support",
    "content-reader-states/test-support",
    "content-reader-unit-path/test-support",
    "content-reader-wargoals/test-support",
    "content-reader-weather/test-support",
]
layer-fixtures = ["content-reader-layers/layer-fixtures", "content-reader-mesh/layer-fixtures", "content-reader-script/layer-fixtures"]

[lints]
workspace = true

# Generated by tools/check-feature-unification.py --fix (do not edit): the features
# `cargo test --workspace` resolves for crates these tests build, so `cargo test -p`
# builds them identically.
[target.'cfg(all())'.dev-dependencies]
content-reader-abilities = { workspace = true, features = ["test-support"] }
content-reader-country-names = { workspace = true, features = ["test-support"] }
content-reader-division-names = { workspace = true, features = ["layer-fixtures", "test-support"] }
content-reader-equipment-graphics = { workspace = true, features = ["test-support"] }
content-reader-events = { workspace = true, features = ["test-support"] }
content-reader-focus = { workspace = true, features = ["test-support"] }
content-reader-gfx = { workspace = true, features = ["test-support"] }
content-reader-gui = { workspace = true, features = ["test-support"] }
content-reader-key-names = { workspace = true, features = ["test-support"] }
content-reader-localisation = { workspace = true, features = ["test-support"] }
content-reader-map = { workspace = true, features = ["test-support"] }
content-reader-mesh = { workspace = true, features = ["layer-fixtures"] }
content-reader-naval-combat-defines = { workspace = true, features = ["test-support"] }
content-reader-naval-path = { workspace = true, features = ["test-support"] }
content-reader-politics = { workspace = true, features = ["test-support"] }
content-reader-province-area = { workspace = true, features = ["test-support"] }
content-reader-raids = { workspace = true, features = ["test-support"] }
content-reader-regions = { workspace = true, features = ["test-support"] }
