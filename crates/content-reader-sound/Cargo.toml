[package]
name = "content-reader-sound"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
content-reader-core.workspace = true
symphonia = { version = "0.6.1", default-features = false, features = ["ogg", "vorbis", "wav", "adpcm"] }

[dev-dependencies]
engine-executable.workspace = true
content-reader-core = { workspace = true, features = ["layer-fixtures"] }

[features]
test-support = ["content-reader-core/test-support"]

# Generated by tools/check-feature-unification.py --fix (do not edit): the features
# `cargo test --workspace` resolves for crates these tests build, so `cargo test -p`
# builds them identically.
[target.'cfg(all())'.dev-dependencies]
content-reader-core = { workspace = true, features = ["layer-fixtures", "test-support"] }
engine-allocation = { workspace = true, features = ["test-support", "zstd"] }
replay-identity = { workspace = true, features = ["test-support"] }
test-unify = { workspace = true }
unify-bitflags-2 = { workspace = true }
unify-bytemuck = { workspace = true }
unify-either = { workspace = true }
unify-log = { workspace = true }
unify-num-traits = { workspace = true }
unify-smallvec = { workspace = true }

[lints]
workspace = true
