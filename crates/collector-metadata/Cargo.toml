[package]
name = "collector-metadata"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
test-support = []

[dependencies]
engine-allocation.workspace = true
engine-dlc.workspace = true
engine-executable.workspace = true
engine-fixed-layout.workspace = true
engine-native.workspace = true
engine-research.workspace = true
replay-data.workspace = true
replay-derive.workspace = true
replay-frame = { workspace = true, features = ["capture"] }
serde = { workspace = true, features = ["derive"] }
collector-status.workspace = true
windows-sys = { workspace = true, features = ["Win32_System_Performance"] }

[dev-dependencies]
synthetic-game.workspace = true
collector-test-support.workspace = true
serde_json.workspace = true

[lints]
workspace = true

# Generated by tools/check-feature-unification.py --fix (do not edit): the features
# `cargo test --workspace` resolves for crates these tests build, so `cargo test -p`
# builds them identically.
[target.'cfg(all())'.dev-dependencies]
collector-metadata = { workspace = true, features = ["test-support"] }
engine-native = { workspace = true, features = ["batch-fallback-test-counts", "layout-fixtures", "test-support"] }
replay-derive = { workspace = true, features = ["test-support"] }
replay-frame = { workspace = true, features = ["capture", "test-support"] }
replay-identity = { workspace = true, features = ["test-support"] }
test-unify = { workspace = true }
