[package]
name = "dashboard-base"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
export-types = []
test-support = ["dep:replay-capture-spool", "dep:recorder-derive", "replay/test-support", "replay-frame/test-support", "dashboard-core/test-support", "dashboard-text/test-support", "dashboard-effects/test-support", "content-reader-abilities/test-support", "content-reader-image/test-support", "content-reader-layers/test-support", "content-reader-script/test-support", "content-reader-country-names/test-support", "content-reader-equipment-graphics/test-support", "content-reader-focus/test-support", "content-reader-gfx/test-support", "content-reader-image/test-support", "content-reader-localisation/test-support", "content-reader-province-area/test-support", "content-reader-regions/test-support", "content-reader-settings/test-support", "content-reader-states/test-support"]

[dependencies]
content-reader-defines.workspace = true
content-reader-gui.workspace = true
content-reader-key-names.workspace = true
content-reader-layers.workspace = true
content-reader-map.workspace = true
content-reader-military.workspace = true
content-reader-parser.workspace = true
content-reader-politics.workspace = true
content-reader-script.workspace = true
replay-capture-spool = { workspace = true, optional = true }
replay.workspace = true
replay-lanes.workspace = true
replay-recording.workspace = true
recorder-derive = { workspace = true, optional = true }
replay-columnar.workspace = true
dashboard-follow = { path = "../dashboard-follow" }
playhead = { path = "../playhead" }
dashboard-declare.workspace = true
dashboard-query.workspace = true
product-codec.workspace = true
engine-projects.workspace = true
engine-allocation = { workspace = true, features = ["zstd"] }
engine-dlc.workspace = true
engine-events.workspace = true
engine-executable.workspace = true
engine-production.workspace = true
engine-research.workspace = true
content-reader-abilities.workspace = true
content-reader-country-names.workspace = true
content-reader-equipment-graphics.workspace = true
content-reader-focus.workspace = true
content-reader-gfx.workspace = true
content-reader-image.workspace = true
content-reader-localisation.workspace = true
content-reader-province-area.workspace = true
content-reader-regions.workspace = true
content-reader-settings.workspace = true
content-reader-states.workspace = true
replay-data.workspace = true
replay-derive.workspace = true
replay-frame.workspace = true
job-priority.workspace = true
blake3.workspace = true
dashboard-core.workspace = true
dashboard-effects.workspace = true
dashboard-text.workspace = true
replay-spool.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true, features = ["float_roundtrip", "raw_value"] }
rmp-serde.workspace = true
rmp = "0.8"
ts-rs = "11.1"
uuid = { workspace = true, features = ["v4"] }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading"] }
zstd = "0.13"

[dev-dependencies]
engine-native.workspace = true
engine-native-parts = { workspace = true, features = ["test-support"] }
content-reader-gui = { workspace = true, features = ["test-support"] }
content-reader-layers = { workspace = true, features = ["test-support"] }
content-reader-script = { workspace = true, features = ["test-support"] }
replay-capture-spool.workspace = true
replay-tools.workspace = true
replay = { workspace = true, features = ["test-support"] }
recorder-derive.workspace = true
engine-heap.workspace = true
content-reader-abilities = { workspace = true, features = ["test-support"] }
content-reader-country-names = { workspace = true, features = ["test-support"] }
content-reader-equipment-graphics = { workspace = true, features = ["test-support"] }
content-reader-focus = { workspace = true, features = ["test-support"] }
content-reader-gfx = { workspace = true, features = ["test-support"] }
content-reader-image = { workspace = true, features = ["test-support"] }
content-reader-localisation = { workspace = true, features = ["test-support"] }
content-reader-province-area = { workspace = true, features = ["test-support"] }
content-reader-regions = { workspace = true, features = ["test-support"] }
content-reader-settings = { workspace = true, features = ["test-support"] }
content-reader-states = { workspace = true, features = ["test-support"] }
replay-data = { workspace = true, features = ["test-support"] }
replay-frame = { workspace = true, features = ["test-support"] }
dashboard-core = { workspace = true, features = ["test-support"] }
dashboard-effects = { workspace = true, features = ["test-support"] }
dashboard-text = { workspace = true, features = ["test-support"] }
png.workspace = true

syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = "1"

[lints]
workspace = true

# Generated by tools/check-feature-unification.py --fix (do not edit): the features
# `cargo test --workspace` resolves for crates these tests build, so `cargo test -p`
# builds them identically.
[target.'cfg(all())'.dev-dependencies]
content-reader-map = { workspace = true, features = ["test-support"] }
content-reader-mesh = { workspace = true, features = ["layer-fixtures"] }
content-reader-politics = { workspace = true, features = ["test-support"] }
dashboard-base = { workspace = true, features = ["export-types", "test-support"] }
engine-native-land = { workspace = true, features = ["test-support"] }
playhead = { path = "../playhead", features = ["test-support"] }
recorder-derive = { workspace = true, features = ["test-support"] }
replay = { workspace = true, features = ["default", "recording", "test-support"] }
replay-capture-spool = { workspace = true, features = ["journal", "test-support"] }
replay-derive = { workspace = true, features = ["test-support"] }
replay-identity = { workspace = true, features = ["test-support"] }
replay-tools = { workspace = true, features = ["default", "journal"] }
shader-pipeline = { workspace = true, features = ["test-support"] }
test-unify = { workspace = true }
unify-bitflags-2 = { workspace = true }
unify-indexmap = { workspace = true }
unify-log = { workspace = true }
unify-num-traits = { workspace = true }
unify-once_cell = { workspace = true }
unify-smallvec = { workspace = true }
unify-wgpu = { workspace = true }
unify-winapi-util = { workspace = true }
unify-windows = { workspace = true }
unify-windows-core = { workspace = true }
uuid = { version = "1.26.0", default-features = false, features = ["default", "rng", "serde", "std", "v4"] }
