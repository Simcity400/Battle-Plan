[package]
name = "collector-projects"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
test-support = ["collector-extended-support/test-support", "collector-observers/test-support"]
default = ["naval_tree_changes", "raid_intel_changes", "raid_intel_verify"]
naval_tree_changes = []
raid_intel_changes = ["naval_tree_changes"]
raid_intel_verify = ["raid_intel_changes"]

[dependencies]
engine-scripts.workspace = true
engine-allocation.workspace = true
engine-characters.workspace = true
engine-events.workspace = true
engine-native.workspace = true
engine-peace.workspace = true
engine-projects.workspace = true
engine-raid-inputs.workspace = true
engine-visibility.workspace = true
replay-data.workspace = true
replay-frame.workspace = true
serde = { workspace = true, features = ["derive"] }
collector-certificates.workspace = true
collector-extended-support.workspace = true
collector-memory.workspace = true
collector-observers.workspace = true
collector-primitives.workspace = true
collector-projection.workspace = true
collector-raw.workspace = true
collector-status.workspace = true

[dev-dependencies]
engine-native = { workspace = true, features = ["batch-fallback-test-counts"] }
collector-test-support.workspace = true
serde_json.workspace = true
collector-extended-support = { workspace = true, features = ["test-support"] }
collector-certificates = { workspace = true, features = ["test-support"] }
collector-memory = { workspace = true, features = ["test-support"] }
collector-observers = { workspace = true, features = ["default", "test-support"] }
collector-primitives = { workspace = true, features = ["test-support"] }
collector-raw = { workspace = true, features = ["test-support"] }
