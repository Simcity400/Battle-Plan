[package]
name = "dashboard-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
# The recording builders in `test_fixtures` and the scanned-block log, for the
# tests of crates above this one.
test-support = ["installed-content-core/test-support"]

[dependencies]
replay.workspace = true
engine-allocation.workspace = true
engine-executable.workspace = true
replay-data.workspace = true
replay-frame.workspace = true
job-priority.workspace = true
installed-content-core.workspace = true
installed-content-settings.workspace = true
replay-spool.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
ts-rs = "11.1"
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
engine-heap.workspace = true
# The equipment fixture reader the recording builders use.
installed-content-core = { workspace = true, features = ["test-support"] }

# Generated by tools/check-feature-unification.py --fix (do not edit): the features
# `cargo test --workspace` resolves for crates these tests build, so `cargo test -p`
# builds them identically.
[target.'cfg(all())'.dev-dependencies]
dashboard-core = { workspace = true, features = ["test-support"] }
engine-native = { workspace = true, features = ["batch-fallback-test-counts", "test-support"] }
installed-content-settings = { workspace = true, features = ["test-support"] }
replay = { workspace = true, features = ["test-support"] }
replay-data = { workspace = true, features = ["test-support"] }
replay-identity = { workspace = true, features = ["test-support"] }
test-unify = { workspace = true }
unify-winapi-util = { workspace = true }
uuid = { version = "1.26.0", default-features = false, features = ["default", "rng", "serde", "std", "v4"] }
