[package]
name = "dashboard-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
test-support = ["dep:replay-capture-spool", "dep:recorder-derive", "content-reader-key-names/test-support", "content-reader-layers/test-support", "replay/test-support"]

[dependencies]
content-reader-key-names.workspace = true
content-reader-layers.workspace = true
content-reader-parser.workspace = true
replay-capture-spool = { workspace = true, optional = true }
replay.workspace = true
replay-settings.workspace = true
recorder-derive = { workspace = true, optional = true }
engine-allocation.workspace = true
engine-executable.workspace = true
replay-data.workspace = true
replay-frame.workspace = true
job-priority.workspace = true
content-reader-settings.workspace = true
replay-spool.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
ts-rs = "11.1"
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
content-reader-key-names = { workspace = true, features = ["test-support"] }
content-reader-layers = { workspace = true, features = ["test-support"] }
replay-capture-spool.workspace = true
replay = { workspace = true, features = ["test-support"] }
recorder-derive.workspace = true
engine-heap.workspace = true

[lints]
workspace = true

# Generated by tools/check-feature-unification.py --fix (do not edit): the features
# `cargo test --workspace` resolves for crates these tests build, so `cargo test -p`
# builds them identically.
[target.'cfg(all())'.dev-dependencies]
content-reader-country-names = { workspace = true, features = ["test-support"] }
content-reader-gui = { workspace = true, features = ["test-support"] }
content-reader-localisation = { workspace = true, features = ["test-support"] }
content-reader-map = { workspace = true, features = ["test-support"] }
content-reader-province-area = { workspace = true, features = ["test-support"] }
content-reader-regions = { workspace = true, features = ["test-support"] }
content-reader-settings = { workspace = true, features = ["test-support"] }
dashboard-core = { workspace = true, features = ["test-support"] }
engine-native = { workspace = true, features = ["batch-fallback-test-counts", "test-support"] }
recorder-derive = { workspace = true, features = ["test-support"] }
replay = { workspace = true, features = ["default", "recording", "test-support"] }
replay-capture-spool = { workspace = true, features = ["journal", "test-support"] }
replay-derive = { workspace = true, features = ["test-support"] }
replay-identity = { workspace = true, features = ["test-support"] }
test-unify = { workspace = true }
unify-winapi-util = { workspace = true }
uuid = { version = "1.26.0", default-features = false, features = ["default", "rng", "serde", "std", "v4"] }
