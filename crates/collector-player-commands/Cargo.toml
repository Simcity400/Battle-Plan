[package]
name = "collector-player-commands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
default = []
acquisition_profile = ["engine-native/acquisition_profile", "collector-memory/acquisition_profile"]
alloc-fault-injection = ["engine-allocation/alloc-fault-injection", "engine-native/alloc-fault-injection", "collector-memory/alloc-fault-injection"]
order_membership_oracle = ["acquisition_profile", "engine-native/order_membership_oracle"]
tap-foreign-probe = ["collector-hooks/tap-foreign-probe"]
test-support = ["collector-hooks/test-support", "collector-lifetime/test-support", "collector-memory/test-support", "collector-primitives/test-support", "collector-timing/test-support", "dep:collector-test-support"]

[dependencies]
collector-hooks.workspace = true
collector-lifetime.workspace = true
collector-memory.workspace = true
collector-primitives.workspace = true
collector-status.workspace = true
collector-timing.workspace = true
collector-workers.workspace = true
engine-allocation.workspace = true
engine-executable.workspace = true
engine-native.workspace = true
engine-sites.workspace = true
replay.workspace = true
replay-data.workspace = true
replay-frame = { workspace = true, features = ["capture"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
collector-test-support = { workspace = true, optional = true }

[dev-dependencies]
replay = { workspace = true, features = ["test-support"] }
collector-test-support.workspace = true
collector-hooks = { workspace = true, features = ["test-support"] }
collector-lifetime = { workspace = true, features = ["test-support"] }
collector-memory = { workspace = true, features = ["test-support"] }
collector-primitives = { workspace = true, features = ["test-support"] }
collector-timing = { workspace = true, features = ["test-support"] }
engine-native = { workspace = true, features = ["batch-fallback-test-counts"] }

[lints]
workspace = true

# Generated by tools/check-feature-unification.py --fix (do not edit): the features
# `cargo test --workspace` resolves for crates these tests build, so `cargo test -p`
# builds them identically.
[target.'cfg(all())'.dev-dependencies]
collector-extended-support = { workspace = true, features = ["test-support"] }
collector-player-commands = { workspace = true, features = ["default", "test-support"] }
collector-workers = { workspace = true, features = ["default", "test-support"] }
content-reader-country-names = { workspace = true, features = ["test-support"] }
content-reader-localisation = { workspace = true, features = ["test-support"] }
content-reader-province-area = { workspace = true, features = ["test-support"] }
content-reader-regions = { workspace = true, features = ["test-support"] }
engine-executable = { workspace = true, features = ["test-support"] }
recorder-derive = { workspace = true, features = ["test-support"] }
replay = { workspace = true, features = ["default", "journal", "recording", "test-support"] }
replay-derive = { workspace = true, features = ["test-support"] }
replay-identity = { workspace = true, features = ["test-support"] }
test-unify = { workspace = true }
unify-bitflags-2 = { workspace = true }
unify-bytemuck = { workspace = true }
unify-either = { workspace = true }
unify-num-traits = { workspace = true }
unify-smallvec = { workspace = true }
unify-windows-sys-0-52 = { workspace = true }
