[package]
name = "viewer-scene-base"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
test-support = ["dep:pollster", "shader-pipeline/test-support", "content-reader-image/test-support", "content-reader-layers/test-support", "content-reader-script/test-support", "engine-executable/test-support", "replay-data/test-support", "replay-frame/test-support", "viewer-gpu/test-support", "viewer-runtime/test-support"]

[dependencies]
content-reader-defines.workspace = true
content-reader-gui.workspace = true
content-reader-layers.workspace = true
content-reader-map.workspace = true
content-reader-mesh.workspace = true
content-reader-parser.workspace = true
content-reader-script.workspace = true
viewer-gpu.workspace = true
viewer-runtime.workspace = true
pollster = { workspace = true, optional = true }
bytemuck = { workspace = true, features = ["derive"] }
content-reader-image.workspace = true
content-reader-regions.workspace = true
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts"] }
engine-executable.workspace = true
job-priority.workspace = true
map-display-data.workspace = true
map-snow.workspace = true
replay-data.workspace = true
replay-frame.workspace = true
shader-pipeline.workspace = true

[dev-dependencies]
content-reader-image = { workspace = true, features = ["test-support"] }
content-reader-layers = { workspace = true, features = ["test-support"] }
content-reader-script = { workspace = true, features = ["test-support"] }
viewer-foundation = { workspace = true, features = ["test-support"] }
viewer-gpu = { workspace = true, features = ["test-support"] }
viewer-native-gui = { workspace = true, features = ["test-support"] }
engine-heap.workspace = true
pollster.workspace = true
replay-data = { workspace = true, features = ["test-support"] }
replay-frame = { workspace = true, features = ["test-support"] }
shader-pipeline = { workspace = true, features = ["test-support"] }

[lints]
workspace = true

# Generated by tools/check-feature-unification.py --fix (do not edit): the features
# `cargo test --workspace` resolves for crates these tests build, so `cargo test -p`
# builds them identically.
[target.'cfg(all())'.dev-dependencies]
content-reader-gui = { workspace = true, features = ["test-support"] }
content-reader-map = { workspace = true, features = ["test-support"] }
content-reader-mesh = { workspace = true, features = ["layer-fixtures"] }
content-reader-politics = { workspace = true, features = ["test-support"] }
content-reader-province-area = { workspace = true, features = ["test-support"] }
engine-native-land = { workspace = true, features = ["test-support"] }
recorder-derive = { workspace = true, features = ["test-support"] }
replay = { workspace = true, features = ["default", "recording", "test-support"] }
replay-capture-spool = { workspace = true, features = ["journal", "test-support"] }
replay-identity = { workspace = true, features = ["test-support"] }
test-unify = { workspace = true }
unify-bitflags-2 = { workspace = true }
unify-dpi = { workspace = true }
unify-indexmap = { workspace = true }
unify-num-traits = { workspace = true }
unify-once_cell = { workspace = true }
unify-tracing = { workspace = true }
unify-uuid = { workspace = true }
unify-winapi-util = { workspace = true }
unify-windows = { workspace = true }
unify-windows-core = { workspace = true }
unify-windows-sys-0-52 = { workspace = true }
unify-windows-sys-0-59 = { workspace = true }
viewer-scene-base = { workspace = true, features = ["test-support"] }
viewer-unit-reads = { workspace = true, features = ["test-support"] }
