[package]
name = "viewer-native-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
test-support = ["content-reader-core/test-support", "content-reader-localisation/test-support"]

[dependencies]
bytemuck = { workspace = true, features = ["derive"] }
content-reader-core.workspace = true
content-reader-gfx.workspace = true
content-reader-image.workspace = true
content-reader-localisation.workspace = true
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts"] }
job-priority.workspace = true
replay-derive.workspace = true
replay-frame.workspace = true
shader-pipeline.workspace = true
viewer-foundation.workspace = true
viewer-gpu.workspace = true
viewer-runtime.workspace = true
viewer-unit-reads.workspace = true

[dev-dependencies]
content-reader-core = { workspace = true, features = ["test-support"] }
content-reader-gfx = { workspace = true, features = ["test-support"] }
content-reader-image = { workspace = true, features = ["test-support"] }
content-reader-localisation = { workspace = true, features = ["test-support"] }
content-reader-settings = { workspace = true, features = ["test-support"] }
engine-heap.workspace = true
pollster.workspace = true
shader-pipeline = { workspace = true, features = ["test-support"] }
synthetic-game.workspace = true
viewer-foundation = { workspace = true, features = ["test-support"] }
viewer-gpu = { workspace = true, features = ["test-support"] }
viewer-runtime = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
