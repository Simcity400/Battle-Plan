[package]
name = "collector-air"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
default = ["air_base_changes", "wing_changes"]
air_base_changes = []
test-support = ["collector-primitives/test-support", "dep:collector-test-support", "engine-native/layout-fixtures"]
wing_changes = ["collector-observers/wing_changes"]

[dependencies]
engine-deployment.workspace = true
collector-test-support = { workspace = true, optional = true }
collector-air-histories.workspace = true
collector-air-sorties.workspace = true
collector-certificates.workspace = true
collector-extended-support.workspace = true
collector-hook-failures.workspace = true
collector-memory.workspace = true
collector-missions.workspace = true
collector-observers.workspace = true
collector-primitives.workspace = true
collector-projection.workspace = true
collector-raw.workspace = true
collector-ship-models.workspace = true
collector-workers.workspace = true
engine-air-history.workspace = true
engine-allocation.workspace = true
engine-events.workspace = true
engine-map-air.workspace = true
engine-mutations.workspace = true
engine-native.workspace = true
engine-raid-inputs.workspace = true
engine-sites.workspace = true
engine-visibility.workspace = true
replay-data.workspace = true
replay-frame = { workspace = true, features = ["capture"] }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Kernel", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Performance", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_SystemServices"] }

[dev-dependencies]
engine-native-naval = { workspace = true, features = ["test-support"] }
engine-native-intelligence = { workspace = true, features = ["test-support"] }
collector-missions = { workspace = true, features = ["test-support"] }
collector-air-histories = { workspace = true, features = ["test-support"] }
collector-air-sorties = { workspace = true, features = ["test-support"] }
collector-certificates = { workspace = true, features = ["test-support"] }
collector-extended-support = { workspace = true, features = ["test-support"] }
collector-memory = { workspace = true, features = ["test-support"] }
collector-observers = { workspace = true, features = ["test-support"] }
collector-primitives = { workspace = true, features = ["test-support"] }
collector-raw = { workspace = true, features = ["test-support"] }
collector-ship-models = { workspace = true, features = ["test-support"] }
collector-test-support.workspace = true
engine-native = { workspace = true, features = ["batch-fallback-test-counts"] }

[lints]
workspace = true

# Generated by tools/check-feature-unification.py --fix (do not edit): the features
# `cargo test --workspace` resolves for crates these tests build, so `cargo test -p`
# builds them identically.
[target.'cfg(all())'.dev-dependencies]
collector-air = { workspace = true, features = ["air_base_changes", "default", "test-support", "wing_changes"] }
collector-air-histories = { workspace = true, features = ["default", "history_changes", "test-support"] }
collector-hook-failures = { workspace = true, features = ["default", "test-support"] }
collector-lifetime = { workspace = true, features = ["test-support"] }
collector-missions = { workspace = true, features = ["default", "mission_changes", "navy_ledger_changes", "test-support"] }
collector-model-inputs = { workspace = true, features = ["default", "local_subunit_changes", "test-support"] }
collector-observers = { workspace = true, features = ["advisor_changes", "advisor_pool_changes", "air_base_carry_changes", "appearance_changes", "area_changes", "census_changes", "character_changes", "counter_changes", "country_input_changes", "default", "focus_changes", "naval_tree_changes", "opinion_changes", "order_membership_changes", "political_status_changes", "projects_changes", "province_changes", "province_combat_changes", "raid_changes", "rail_changes", "retreat_ban_changes", "roster_changes", "ship_model_changes", "technology_changes", "territory_changes", "test-support", "unit_leader_changes", "unit_leader_trait_changes", "visibility_changes", "war_changes", "weather_changes", "wing_changes", "world_input_changes"] }
collector-ship-models = { workspace = true, features = ["default", "ship_model_changes", "test-support"] }
collector-workers = { workspace = true, features = ["default", "test-support"] }
engine-executable = { workspace = true, features = ["test-support"] }
replay-frame = { workspace = true, features = ["capture", "test-support"] }
replay-identity = { workspace = true, features = ["test-support"] }
test-unify = { workspace = true }
unify-windows-sys-0-52 = { workspace = true }
