[package]
name = "replay-tables-weather"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
test = false
doctest = false

[features]
test-support = ["replay-rows-weather/test-support"]

[dependencies]
replay-rows.workspace = true
replay-rows-weather.workspace = true

[lints]
workspace = true

# Generated by tools/check-feature-unification.py --fix (do not edit): the features
# `cargo test --workspace` resolves for crates these tests build, so `cargo test -p`
# builds them identically.
[target.'cfg(all())'.dev-dependencies]
engine-allocation = { workspace = true, features = ["test-support", "zstd"] }
replay-tables-weather = { workspace = true, features = ["test-support"] }
test-unify = { workspace = true }
