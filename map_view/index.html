<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battle Plan - Map Viewer</title>
<style>
  :root {
    --bg: #11151c; --panel: #1b212b; --panel2: #232b38;
    --ink: #d7dde6; --muted: #8b96a6; --accent: #6fa8dc; --line: #2c3543;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 13px/1.45 -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
  #wrap { display: grid; grid-template-columns: 1fr 300px; grid-template-rows: auto 1fr;
    height: 100vh; }
  header { grid-column: 1 / 3; display: flex; align-items: center; gap: 18px;
    padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; letter-spacing: .3px; }
  header h1 small { color: var(--muted); font-weight: 400; }
  .modes { display: flex; gap: 14px; }
  .modes label { cursor: pointer; user-select: none; }
  #status { margin-left: auto; color: var(--muted); font-size: 12px; max-width: 46%;
    text-align: right; }
  #stage { position: relative; overflow: auto; background:
    repeating-conic-gradient(#0c0f14 0% 25%, #0e1218 0% 50%) 50% / 24px 24px; }
  #map { display: block; image-rendering: pixelated; width: 100%; height: auto;
    cursor: crosshair; }
  aside { background: var(--panel); border-left: 1px solid var(--line);
    padding: 12px 14px; overflow: auto; }
  aside section { margin-bottom: 18px; }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .6px;
    color: var(--muted); margin: 0 0 8px; }
  #legend-list { list-style: none; margin: 0; padding: 0; }
  #legend-list li { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
  .swatch { width: 14px; height: 14px; border-radius: 3px; flex: none;
    border: 1px solid rgba(255,255,255,.18); }
  #legend-more { color: var(--muted); font-size: 11px; margin-top: 4px; }
  #info { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
  #info dt { color: var(--muted); }
  #info dd { margin: 0; }
  .scrub-row { display: flex; align-items: center; gap: 8px; }
  #scrubber { flex: 1; }
  #scrub-label { color: var(--muted); font-size: 11px; }
  #validation { white-space: pre-wrap; font-family: ui-monospace, Consolas, monospace;
    font-size: 11px; color: var(--muted); background: var(--panel2);
    border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
  #tooltip { position: fixed; pointer-events: none; display: none; z-index: 10;
    background: rgba(10,13,18,.95); border: 1px solid var(--line); border-radius: 5px;
    padding: 4px 8px; font-size: 12px; max-width: 320px; }
  .hint { color: var(--muted); font-size: 11px; }
  kbd { background: var(--panel2); border: 1px solid var(--line); border-radius: 3px;
    padding: 0 4px; font-family: ui-monospace, monospace; }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <h1>Battle Plan <small>&mdash; Map Viewer</small></h1>
    <div class="modes">
      <label><input type="radio" name="mode" value="owner" checked> Owner</label>
      <label><input type="radio" name="mode" value="control"> Control</label>
    </div>
    <div id="status">Loading...</div>
  </header>

  <div id="stage">
    <canvas id="map" width="16" height="9"></canvas>
  </div>

  <aside>
    <section>
      <h2 id="legend-title">Top owners</h2>
      <ul id="legend-list"></ul>
      <div id="legend-more"></div>
      <div class="hint">Control view stripes contested states (controller&nbsp;&ne;&nbsp;owner) with a darkened owner color.</div>
    </section>

    <section>
      <h2>Province info</h2>
      <div id="info">Hover or click a province.</div>
    </section>

    <section>
      <h2>Timeline</h2>
      <div class="scrub-row">
        <input type="range" id="scrubber" min="0" max="0" value="0" disabled>
      </div>
      <div id="scrub-label"></div>
    </section>

    <section>
      <h2>Validation</h2>
      <div id="validation">(running...)</div>
    </section>
  </aside>
</div>
<div id="tooltip"></div>
<script src="app.js"></script>
</body>
</html>
