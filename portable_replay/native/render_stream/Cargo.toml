[package]
name = "portable_render_stream"
version = "0.1.0"
edition = "2021"
description = "Portable, fail-closed non-UI render-submit carrier for .battleplan"

[dependencies]
# The engine hour-counter sanity window, shared with the extractor producer
# and the replay consumer so this crate cannot hold a third spelling of it.
portable_admission = { path = "../admission" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
portable_content_manifest = { path = "../content_manifest" }

# Fail-closed doctrine: untrusted-input parsing must panic on integer overflow
# in release builds rather than silently wrap. When this crate is built as a
# path dependency of the replay_interface workspace, Cargo prints "profiles
# for the non root package will be ignored" — that warning is expected and
# benign (the workspace root carries the same setting).
[profile.release]
overflow-checks = true
