[package]
name = "portable_compact_stream"
version = "0.1.0"
edition = "2021"
description = "Neutral raw/zstd file-boundary codec for portable Battle Plan streams"

[dependencies]
zstd = "0.13.3"

# Fail-closed doctrine: untrusted-input parsing must panic on integer overflow
# in release builds rather than silently wrap. When this crate is built as a
# path dependency of the replay_interface workspace, Cargo prints "profiles
# for the non root package will be ignored" — that warning is expected and
# benign (the workspace root carries the same setting).
[profile.release]
overflow-checks = true

[dev-dependencies]
# Waits out the Windows sharing violation a real-time scanner causes on a
# freshly written file. Test-only: nothing this package ships calls it.
portable_test_fs_retry = { path = "../../../portable_replay/native/test_fs_retry" }
