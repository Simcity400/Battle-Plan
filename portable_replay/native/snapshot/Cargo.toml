[package]
name = "portable_replay_format"
version = "0.1.0"
edition = "2021"
description = "Neutral portable .battleplan container, snapshot store, verifier, and packer"

[dependencies]
compact_stream = { package = "portable_compact_stream", path = "../compact_stream" }
portable_content_manifest = { path = "../content_manifest" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
flate2 = "1"
crc32fast = "1"
zstd = "0.13.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
