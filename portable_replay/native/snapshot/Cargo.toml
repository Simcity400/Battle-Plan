[package]
name = "portable_replay_format"
version = "0.1.0"
edition = "2021"
description = "Neutral portable .battleplan container, snapshot store, verifier, and packer"
# src/bin/ holds the command-line drivers for this crate. They are stored here,
# next to the implementation they drive, so the replay side's
# pathname-capability audit can scan every file-access site in them without
# reading across the replay/acquisition boundary (see
# `production_sources_have_no_descendant_pathname_read` in replay_core's
# source.rs). They are NOT built from this manifest: the acquisition-side
# `snapshot` facade package declares all three by path and is the sole owner of
# the released `pack_replay.exe` / `m0_demo.exe` / `container_codec_bench.exe`.
# Both manifests share one target directory, so two packages emitting the same
# binary names would race to overwrite an attested production artifact.
autobins = false

[features]
default = []
# Lane CE size-lever measurement instrument (`src/ce_anatomy.rs`). It decomposes
# an existing sealed checkpoint cache into the byte classes its v2 grammar
# emits and prices candidate encodings by rewriting the cache and compressing
# the result with the production container profile. Measurement only: it never
# writes a cache and no production path enables it.
ce-cache-anatomy = []

[dependencies]
compact_stream = { package = "portable_compact_stream", path = "../compact_stream" }
portable_content_manifest = { path = "../content_manifest" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
crc32fast = "1"
zstd = "0.13.3"
unicode-normalization = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# Fail-closed doctrine: untrusted-input parsing must panic on integer overflow
# in release builds rather than silently wrap. When this crate is built as a
# path dependency of the replay_interface workspace, Cargo prints "profiles
# for the non root package will be ignored" — that warning is expected and
# benign (the workspace root carries the same setting).
[profile.release]
overflow-checks = true
