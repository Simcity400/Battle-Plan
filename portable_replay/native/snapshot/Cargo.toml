[package]
name = "portable_replay_format"
version = "0.1.0"
edition = "2021"
description = "Neutral portable .battleplan container, snapshot store, verifier, and packer"
# The packer command-line driver is stored next to the implementation it drives,
# so the replay side's pathname-capability audit can scan its file-access sites
# without reading across the replay/acquisition boundary (see
# `production_sources_have_no_descendant_pathname_read` in replay_core's
# source.rs). It is NOT built from this manifest: the acquisition-side
# `snapshot` facade package declares it by path and owns `pack_replay.exe`.
autobins = false

[features]
default = []
# Lane LL revive pricing instrument (`src/bin/ll_revive_pricing.rs`). Drives THE
# production cache encoder over the real hours of an already-sealed recording,
# then makes the production reader reconstruct every one of them, so the size a
# format change buys is measured on the encoder that ships rather than on a
# model of it. Measurement only: no production path enables it.
ll-revive-pricing = []
# Lane MY copy-on-write census. Counts, during a real delta walk, how many
# container element handles `apply_patch` actually copies because an earlier
# hour still reaches the node -- the cost Codex's round-6 finding 6 warned
# about, measured on a recording instead of on a synthetic array. Measurement
# only: with the feature off every call compiles away and the hot path is
# untouched, and no production path enables it.
my-cow-census = []

[dependencies]
compact_stream = { package = "portable_compact_stream", path = "../compact_stream" }
portable_content_manifest = { path = "../content_manifest" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
crc32fast = "1"
zstd = "0.13.3"
unicode-normalization = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# Fail-closed doctrine: untrusted-input parsing must panic on integer overflow
# in release builds rather than silently wrap. When this crate is built as a
# path dependency of the replay_interface workspace, Cargo prints "profiles
# for the non root package will be ignored" — that warning is expected and
# benign (the workspace root carries the same setting).
[profile.release]
overflow-checks = true

[dev-dependencies]
# Waits out the Windows sharing violation a real-time scanner causes on a
# freshly written file. Test-only: nothing this package ships calls it.
portable_test_fs_retry = { path = "../../../portable_replay/native/test_fs_retry" }

