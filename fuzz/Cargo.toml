[package]
name = "battle-plan-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.96"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
crc32fast = "1"
zstd = "0.13"
replay = { path = "../crates/replay" }
replay-data = { path = "../crates/replay-data" }
replay-frame = { path = "../crates/replay-frame" }
dashboard = { path = "../crates/dashboard" }

[workspace]
members = ["."]

[profile.dev]
debug = 0

[profile.dev.package.zstd-sys]
opt-level = 3

[[bin]]
name = "open_recording"
path = "fuzz_targets/open_recording.rs"
test = false
doc = false
bench = false

[[bin]]
name = "partial_trailer"
path = "fuzz_targets/partial_trailer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "read_blocks"
path = "fuzz_targets/read_blocks.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dashboard_metadata"
path = "fuzz_targets/dashboard_metadata.rs"
test = false
doc = false
bench = false

[[bin]]
name = "seed-corpus"
path = "seed_corpus.rs"
test = false
doc = false
bench = false
