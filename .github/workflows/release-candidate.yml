name: Release candidate

on:
  workflow_dispatch:
    inputs:
      channel:
        description: The candidate's channel
        type: choice
        default: nightly
        options:
          - nightly
          - stable
          - preview
      commit:
        description: The commit to build; by default the branch's head
        type: string
        default: ""
      version:
        description: Stable only, for a larger step than the next patch
        type: string
        default: ""
  workflow_call:
    inputs:
      channel:
        description: The candidate's channel
        type: string
        required: true
      commit:
        type: string
        required: true
      version:
        description: Stable only, the version the release resolved
        type: string
        default: ""
    secrets:
      LEAK_GATE_TERMS:
        required: true

concurrency:
  group: candidate-${{ inputs.channel || 'nightly' }}-${{ inputs.commit || github.sha }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 240
    env:
      CHANNEL: ${{ inputs.channel || 'nightly' }}
      PROFILE: ${{ inputs.channel == 'stable' && 'release-lto' || 'release' }}
      CARGO_TERM_COLOR: always
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install the Rust toolchain
        run: rustup toolchain install

      - name: Reuse downloaded crates
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          shared-key: candidate
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Name the version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$VERSION" && "$CHANNEL" != stable ]]; then
            echo "::error::Only a stable candidate takes a version; the others take their commit's."
            exit 1
          fi
          python tools/release.py version --channel "$CHANNEL" --sha HEAD ${VERSION:+--version "$VERSION"} --github-output

      - name: Install UI dependencies
        run: npm ci

      - name: Build the installer
        shell: powershell
        env:
          FEED: ${{ (inputs.channel || 'nightly') != 'preview' && format('https://github.com/{0}/releases', github.repository) || '' }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:FEED) { $env:BATTLEPLAN_RELEASES = $env:FEED }
          $env:BATTLEPLAN_VERSION = $env:VERSION
          $userHome = $env:USERPROFILE
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $userHome '.cargo' }
          $rustupHome = if ($env:RUSTUP_HOME) { $env:RUSTUP_HOME } else { Join-Path $userHome '.rustup' }
          $maps = @(
            "$userHome=/home", "$cargoHome=/cargo", "$rustupHome=/rustup",
            "$env:GITHUB_WORKSPACE=/battleplan", "$(Join-Path $env:GITHUB_WORKSPACE '.cargo-target')=/target")
          $flags = @($maps | ForEach-Object { "--remap-path-prefix=$_" }) + '-Clink-arg=/PDBALTPATH:%_PDB%'
          $env:CARGO_ENCODED_RUSTFLAGS = $flags -join [char]0x1F
          npm run build:desktop -- -- --profile $env:PROFILE
          if ($LASTEXITCODE -ne 0) { throw "The installer build failed (exit $LASTEXITCODE)." }

      - name: Collect the candidate
        id: collect
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          shopt -s nullglob
          built=(".cargo-target/$PROFILE/bundle/nsis/"*"_${VERSION}_x64-setup.exe")
          if [[ ${#built[@]} -ne 1 ]]; then
            echo "::error::Expected one installer for $VERSION, found ${#built[@]}."
            exit 1
          fi
          rm -rf dist && mkdir dist
          cp "${built[0]}" "dist/battleplan-${VERSION}-x64-setup.exe"
          python tools/release.py candidate --installer "dist/battleplan-${VERSION}-x64-setup.exe" --channel "$CHANNEL" \
            --version "$VERSION" --commit "$(git rev-parse HEAD)" --output dist/candidate.json
          name="candidate-${CHANNEL}-$(git rev-parse HEAD)"
          if [[ "$CHANNEL" == stable ]]; then name="${name}-${VERSION}"; fi
          echo "artifact=$name" >> "$GITHUB_OUTPUT"

      - name: Check for leaks
        env:
          LEAK_GATE_TERMS: ${{ secrets.LEAK_GATE_TERMS }}
        run: python tools/leak-gate.py dist ui/dist

      - name: Smoke the installed layout
        run: python tools/release_smoke.py --installer dist/battleplan-*-x64-setup.exe --out "$RUNNER_TEMP/release-smoke" --layout-only

      - name: Keep the candidate
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.collect.outputs.artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: ${{ env.CHANNEL == 'nightly' && 30 || 7 }}
