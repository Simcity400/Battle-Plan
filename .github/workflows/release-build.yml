name: Release build

# Builds the one per-user installer that carries Battle Plan and Battle Plan Recorder at one version,
# signs it for Tauri's updater (and with Authenticode once Azure Artifact Signing is configured),
# proves the signature verifies against the public key both apps carry, and uploads the installer,
# its signature and checksums as the `installer` artifact. release.yml publishes it.
#
# Preview builds carry no update feed (battle-plan_RELEASES is unset), so they never update and are
# never offered as an update.
#
# It runs on the maintainer's machine, on the self-hosted runner that tools/release-runner.ps1 sets
# up: at below-normal CPU and I/O priority, after any game run, inside a slot of the shared prep
# lock, in the runner's own build folder (its .env names CARGO_TARGET_DIR), pruned after each build.
#
# Nothing from that machine ships: Rust paths are remapped to neutral roots, binaries name their
# debug database by file name only, no .pdb or source map ships, and tools/leak-gate.py must pass
# the installer, opened down to every file it installs, and the frontend the apps embed.

on:
  workflow_call:
    inputs:
      channel:
        description: stable, nightly or preview
        type: string
        required: true
      version:
        type: string
        required: true
      ref:
        description: The commit to build
        type: string
        required: true
      releases:
        description: https://github.com/<owner>/<repo>/releases, where the release and its feed are published; empty for preview
        type: string
        default: ""
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: true
      AZURE_TENANT_ID:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_CLIENT_SECRET:
        required: false
      AZURE_SIGNING_ENDPOINT:
        required: false
      AZURE_SIGNING_ACCOUNT:
        required: false
      AZURE_SIGNING_PROFILE:
        required: false
      LEAK_GATE_TERMS:
        required: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 installer
    runs-on: [self-hosted, windows, release]
    # Waiting for a game run or a lock slot counts too.
    timeout-minutes: 720
    env:
      CARGO_TERM_COLOR: always
      VERSION: ${{ inputs.version }}
      # Only a stable release pays for fat LTO (Cargo.toml's release-lto): hours of link time.
      BUILD_PROFILE: ${{ inputs.channel == 'stable' && 'release-lto' || 'release' }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
      AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
    defaults:
      run:
        shell: bash
    steps:
      # The home folder never shows in this public log, whatever prints it.
      - name: Mask the machine's home folder
        shell: powershell
        run: |
          Write-Output "::add-mask::$env:USERPROFILE"
          Write-Output "::add-mask::$($env:USERPROFILE -replace '\\', '/')"

      - name: Check the channel and the runner
        run: |
          case "${{ inputs.channel }}" in
            stable|nightly) [[ -n "${{ inputs.releases }}" ]] || { echo "::error::A ${{ inputs.channel }} build needs the release repository its feed is on."; exit 1; } ;;
            preview) [[ -z "${{ inputs.releases }}" ]] || { echo "::error::Preview builds must carry no update feed."; exit 1; } ;;
            *) echo "::error::Unknown channel ${{ inputs.channel }}."; exit 1 ;;
          esac
          for name in CARGO_TARGET_DIR BATTLE_PLAN_PREP_LOCK BATTLE_PLAN_GAME_LOCK BATTLE_PLAN_TARGET_CAP_GB BATTLE_PLAN_RELEASE_SMOKE_RECORDING BATTLE_PLAN_GAME_DIR; do
            [[ -n "${!name:-}" ]] || { echo "::error::The runner's .env must set $name (tools/release-runner.ps1 writes it)."; exit 1; }
          done

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install the Rust toolchain
        run: rustup toolchain install

      - name: Stamp the version into both apps
        run: |
          python tools/release.py stamp "$VERSION"
          cargo update --workspace

      - name: Install UI dependencies
        run: npm ci

      # Builds made without it are development builds whose updates are off.
      - name: Name the update feed
        if: inputs.channel != 'preview'
        run: echo "battle-plan_RELEASES=${{ inputs.releases }}" >> "$GITHUB_ENV"

      # Signing waits for an owner decision; with all six secrets set every build signs.
      - name: Prepare Authenticode signing
        id: authenticode
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $names = 'AZURE_TENANT_ID', 'AZURE_CLIENT_ID', 'AZURE_CLIENT_SECRET', 'AZURE_SIGNING_ENDPOINT', 'AZURE_SIGNING_ACCOUNT', 'AZURE_SIGNING_PROFILE'
          $set = @($names | Where-Object { [Environment]::GetEnvironmentVariable($_) })
          if ($set.Count -eq 0) {
            Write-Output "::notice::No Authenticode certificate is configured; Windows SmartScreen warns on first run."
            exit 0
          }
          if ($set.Count -ne $names.Count) {
            throw "Authenticode signing needs every one of $($names -join ', '); only $($set -join ', ') are set."
          }
          $package = Join-Path $env:RUNNER_TEMP 'artifact-signing.zip'
          Invoke-WebRequest -UseBasicParsing -OutFile $package -Uri 'https://api.nuget.org/v3-flatcontainer/microsoft.artifactsigning.client/1.0.151/microsoft.artifactsigning.client.1.0.151.nupkg'
          $digest = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne '35375a4bc4e1102da729fc3d8d9925f774c3baae6b8b7ff6398d948ca9ab0d8a') { throw "The Artifact Signing client's SHA256 is $digest, not the pinned one." }
          $client = Join-Path $env:RUNNER_TEMP 'artifact-signing'
          Expand-Archive -LiteralPath $package -DestinationPath $client -Force
          $dlib = Join-Path $client 'bin\x64\Azure.CodeSigning.Dlib.dll'
          if (-not (Test-Path -LiteralPath $dlib)) { throw 'The Artifact Signing client has no bin\x64\Azure.CodeSigning.Dlib.dll.' }
          $metadata = Join-Path $env:RUNNER_TEMP 'artifact-signing.json'
          [IO.File]::WriteAllText($metadata, (@{ Endpoint = $env:AZURE_SIGNING_ENDPOINT; CodeSigningAccountName = $env:AZURE_SIGNING_ACCOUNT; CertificateProfileName = $env:AZURE_SIGNING_PROFILE } | ConvertTo-Json))
          [IO.File]::AppendAllText($env:GITHUB_ENV, "BATTLE_PLAN_SIGN_DLIB=$dlib`nHOI4_SIGN_METADATA=$metadata`n")
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "flag=--authenticode`n")

      # Cargo's trim-paths is not stable yet: every machine path rustc could embed maps to a neutral
      # root, the most specific last because the last match wins. Set only in this step's process,
      # so the log's environment listings never show them.
      - name: Build the installer
        shell: powershell
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AUTHENTICODE: ${{ steps.authenticode.outputs.flag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $userHome = $env:USERPROFILE
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $userHome '.cargo' }
          $rustupHome = if ($env:RUSTUP_HOME) { $env:RUSTUP_HOME } else { Join-Path $userHome '.rustup' }
          $runnerRoot = Split-Path (Split-Path $env:RUNNER_WORKSPACE -Parent) -Parent
          $maps = @(
            "$userHome=/home", "$runnerRoot=/runner", "$cargoHome=/cargo", "$rustupHome=/rustup",
            "$env:CARGO_TARGET_DIR=/target", "$env:GITHUB_WORKSPACE=/battle-plan")
          $flags = @($maps | ForEach-Object { "--remap-path-prefix=$_" }) + '-Clink-arg=/PDBALTPATH:%_PDB%'
          # One argument per flag, separated by 0x1F, so no path is split at a space.
          $env:CARGO_ENCODED_RUSTFLAGS = $flags -join [char]0x1F
          $build = @('tools/with-machine-locks.sh', "release-${{ inputs.channel }}", 'npm', 'run', 'build:desktop', '--', '--updater-artifacts')
          if ($env:AUTHENTICODE) { $build += $env:AUTHENTICODE }
          $build += @('--', '--profile', $env:BUILD_PROFILE)
          & bash @build
          if ($LASTEXITCODE -ne 0) { throw "The installer build failed (exit $LASTEXITCODE)." }

      # GitHub renames spaces in asset names, so the installer is named without them.
      - name: Collect the installer
        run: |
          shopt -s nullglob
          bundle="$(cygpath -u "$CARGO_TARGET_DIR")/$BUILD_PROFILE/bundle/nsis"
          built=("$bundle"/*"_${VERSION}_x64-setup.exe")
          if [[ ${#built[@]} -ne 1 ]]; then
            echo "::error::Expected one installer for $VERSION in $bundle, found ${#built[@]}."
            ls -la "$bundle" || true
            exit 1
          fi
          rm -rf dist && mkdir dist
          name="battle-plan-${VERSION}-x64-setup.exe"
          cp "${built[0]}" "dist/$name"
          cp "${built[0]}.sig" "dist/$name.sig"
          (cd dist && sha256sum "$name" > SHA256SUMS && cat SHA256SUMS)

      - name: Check for leaks
        env:
          LEAK_GATE_TERMS: ${{ secrets.LEAK_GATE_TERMS }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: python tools/leak-gate.py dist ui/dist

      - name: Verify the updater signature
        run: |
          python -m venv "$RUNNER_TEMP/verify"
          "$RUNNER_TEMP/verify/Scripts/python" -m pip install --disable-pip-version-check --quiet cryptography==50.0.2
          "$RUNNER_TEMP/verify/Scripts/python" tools/release.py verify --installer "dist/battle-plan-${VERSION}-x64-setup.exe" --signature "dist/battle-plan-${VERSION}-x64-setup.exe.sig" --version "$VERSION"

      # The installer's layout holds exactly the shipped files, and the app in it opens a recording
      # and draws its map; nothing is installed on the machine and no user data is read or written.
      - name: Smoke the installed layout
        run: bash tools/with-machine-locks.sh "release-smoke-${{ inputs.channel }}" python tools/release_smoke.py --installer "dist/battle-plan-${VERSION}-x64-setup.exe" --out "$RUNNER_TEMP/release-smoke"

      - name: Verify the Authenticode signature
        if: steps.authenticode.outputs.flag != ''
        shell: powershell
        run: |
          $signature = Get-AuthenticodeSignature -LiteralPath "dist/battle-plan-$env:VERSION-x64-setup.exe"
          if ($signature.Status -ne 'Valid') { throw "The installer's Authenticode signature is $($signature.Status): $($signature.StatusMessage)" }
          Write-Output "Signed by $($signature.SignerCertificate.Subject)"

      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: installer
          path: dist/*
          if-no-files-found: error
          retention-days: ${{ inputs.channel == 'preview' && 7 || 30 }}

      # The build folder keeps what the next build reuses, within its cap.
      - name: Prune the build folder
        if: always()
        run: |
          rm -rf dist
          python tools/release.py prune --target "$CARGO_TARGET_DIR" --cap-gb "$BATTLE_PLAN_TARGET_CAP_GB"
