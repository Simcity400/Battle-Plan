name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
      base: ${{ steps.plan.outputs.base }}
      tier: ${{ steps.tier.outputs.tier }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - id: tier
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            echo "tier=check" >> "$GITHUB_OUTPUT"; echo "base=$PR_BASE" >> "$GITHUB_OUTPUT"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            echo "tier=main" >> "$GITHUB_OUTPUT"; echo "base=$BEFORE" >> "$GITHUB_OUTPUT"
          else
            echo "tier=main" >> "$GITHUB_OUTPUT"; echo "base=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"
          fi
      - id: plan
        shell: bash
        env:
          TIER: ${{ steps.tier.outputs.tier }}
          BASE: ${{ steps.tier.outputs.base }}
        run: python tools/ci.py changes --tier "$TIER" --base "$BASE" --github-output "$GITHUB_OUTPUT"

  run:
    needs: changes
    if: needs.changes.outputs.any == 'true'
    name: ${{ matrix.group }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    env:
      HOI4_CI_STORE: ${{ github.workspace }}/../ci-store
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - if: matrix.needs_python
        run: 'python -m pip install --only-binary=:all: -r tools/comment-lint-requirements.txt pyyaml'
      - if: matrix.needs_node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - if: matrix.needs_node
        run: npm ci --no-audit --no-fund
      - if: matrix.needs_rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> .cargo-target'
          cache-on-failure: true
      - if: matrix.needs_rust
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - shell: bash
        env:
          TIER: ${{ needs.changes.outputs.tier }}
          BASE: ${{ needs.changes.outputs.base }}
          GROUP: ${{ matrix.group }}
        run: python tools/ci.py job --tier "$TIER" --group "$GROUP" --base "$BASE"

  check:
    needs: [changes, run]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          RUN: ${{ needs.run.result }}
          ANY: ${{ needs.changes.outputs.any }}
        run: |
          echo "changes: $CHANGES; jobs: $RUN; any gated in: $ANY"
          [ "$CHANGES" = success ] || { echo "The changes job did not succeed"; exit 1; }
          if [ "$ANY" = true ]; then
            [ "$RUN" = success ] || { echo "A gated job did not pass"; exit 1; }
          else
            [ "$RUN" = skipped ] || { echo "Jobs ran although no gate was needed"; exit 1; }
          fi
