name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 14 * * *"

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'schedule' && 'nightly' || github.run_attempt == 1 && 'main' || format('main-retry-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
      base: ${{ steps.plan.outputs.base }}
      tier: ${{ steps.tier.outputs.tier }}
      exact: ${{ steps.tier.outputs.exact }}
      everything: ${{ steps.tier.outputs.everything }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - id: tier
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            base=$PR_BASE
            if git rev-parse --verify --quiet HEAD^2 >/dev/null; then base=$(git rev-parse HEAD^1); fi
            { echo "tier=check"; echo "base=$base"; echo "exact="; echo "everything="; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          green=
          head=$(git rev-parse HEAD)
          any=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=100" \
            --jq "[.workflow_runs[] | select((.event == \"push\" or .event == \"schedule\") and .head_sha != \"$head\")] | length") \
            || { echo "::error::Main's CI runs could not be listed, so its last green commit is unknown"; exit 1; }
          [ "$any" -gt 0 ] || echo "main has no green run yet"
          for sha in $([ "$any" -gt 0 ] && git rev-list --first-parent HEAD^ 2>/dev/null); do
            found=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$sha&status=success&per_page=100" \
              --jq '[.workflow_runs[] | select(.head_branch == "main" and (.event == "push" or .event == "schedule"))] | length') \
              || { echo "::error::Main's CI runs could not be listed, so its last green commit is unknown"; exit 1; }
            if [ "$found" -gt 0 ]; then green=$sha; break; fi
          done
          everything=
          if [ "$EVENT" = schedule ] || [ -z "$green" ]; then everything=--everything; fi
          echo "last green main commit: ${green:-none}"
          { echo "tier=main"; echo "base=${green:-$(git hash-object -t tree /dev/null)}"; echo "exact=--exact-base"; echo "everything=$everything"; } >> "$GITHUB_OUTPUT"
      - id: plan
        shell: bash
        env:
          TIER: ${{ steps.tier.outputs.tier }}
          BASE: ${{ steps.tier.outputs.base }}
          EXACT: ${{ steps.tier.outputs.exact }}
          EVERYTHING: ${{ steps.tier.outputs.everything }}
        run: python tools/ci.py changes --tier "$TIER" --base "$BASE" $EXACT $EVERYTHING --github-output "$GITHUB_OUTPUT"

  run:
    needs: changes
    if: needs.changes.outputs.any == 'true'
    name: ${{ matrix.name }}
    runs-on: ${{ fromJSON('{"linux":"ubuntu-24.04","windows":"windows-latest","rust":"windows-latest"}')[matrix.group] }}
    timeout-minutes: ${{ fromJSON('{"linux":30,"windows":60,"rust":90}')[matrix.group] }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: ${{ matrix.needs_rust && 'blob:none' || '' }}
          persist-credentials: false
      - if: needs.changes.outputs.exact != ''
        shell: bash
        env:
          BASE: ${{ needs.changes.outputs.base }}
        run: git cat-file -e "$BASE" 2>/dev/null || git fetch --no-tags origin "$BASE"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - if: matrix.needs_python
        run: 'python -m pip install --only-binary=:all: -r tools/python-requirements.txt'
      - if: matrix.needs_node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - if: matrix.needs_node
        run: npm ci --no-audit --no-fund
      - if: matrix.needs_rust || matrix.needs_toolchain
        run: rustup toolchain install
      - if: matrix.needs_rust
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            .cargo-target
          key: rust-${{ matrix.cache }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}-${{ github.sha }}
          restore-keys: |
            rust-${{ matrix.cache }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}-
            rust-${{ matrix.cache }}-
      - if: matrix.needs_rust
        run: python tools/ci.py times --target .cargo-target
      - if: matrix.needs_rust
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-nextest
      - shell: bash
        env:
          TIER: ${{ needs.changes.outputs.tier }}
          BASE: ${{ needs.changes.outputs.base }}
          EXACT: ${{ needs.changes.outputs.exact }}
          EVERYTHING: ${{ needs.changes.outputs.everything }}
          GROUP: ${{ matrix.group }}
          JOBS: ${{ matrix.jobs }}
          SHARD: ${{ matrix.shard }}
          RUST_MIN_STACK: '33554432'
        run: python tools/ci.py job --tier "$TIER" --group "$GROUP" --jobs "$JOBS" --base "$BASE" $EXACT $EVERYTHING ${SHARD:+--shard "$SHARD"}
      - if: failure() && matrix.needs_rust
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ strategy.job-index }}
          path: target/nextest/hosted/junit.xml
          if-no-files-found: ignore

  check:
    needs: [changes, run]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          RUN: ${{ needs.run.result }}
          ANY: ${{ needs.changes.outputs.any }}
        run: |
          echo "changes: $CHANGES; jobs: $RUN; any gated in: $ANY"
          [ "$CHANGES" = success ] || { echo "The changes job did not succeed"; exit 1; }
          case "$ANY" in
            true) [ "$RUN" = success ] || { echo "A gated job did not pass"; exit 1; } ;;
            false) [ "$RUN" = skipped ] || { echo "Jobs ran although no gate was needed"; exit 1; } ;;
            *) echo "The changes job gave no gate decision"; exit 1 ;;
          esac
