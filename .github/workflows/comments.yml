name: Comments

on: pull_request

permissions:
  contents: read

jobs:
  comments:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: 'python -m pip install --only-binary=:all: -r tools/comment-lint-requirements.txt'
      - run: python tools/check-comments.py --against HEAD^1
