name: Measuring shell
run-name: Measuring shell ${{ inputs.ref || github.sha }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or ref to build; defaults to the dispatched ref
        type: string
        default: ""

concurrency:
  group: measuring-shell-${{ inputs.ref || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'

jobs:
  build:
    name: Windows x64 measuring shell
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout build driver
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .shell-driver
          sparse-checkout: tools
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Resolve build metadata
        id: meta
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          sha=$(git rev-parse HEAD)
          artifact=$(python -c "import sys; sys.path.insert(0, '.shell-driver/tools/e2e'); import suite; print(suite.shell_artifact_name('$sha'))")
          save=false
          if [ "$WORKFLOW_REF" != "refs/heads/main" ]; then
            save=true
          else
            git fetch --no-tags origin main 2>/dev/null || true
            if git merge-base --is-ancestor "$sha" FETCH_HEAD 2>/dev/null; then
              save=true
            fi
          fi
          {
            echo "sha=$sha"
            echo "artifact=$artifact"
            echo "allow_save=$save"
          } >> "$GITHUB_OUTPUT"

      - name: Install the Rust toolchain
        run: rustup toolchain install

      - name: Restore Rust cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            .cargo-target
          key: rust-measuring-shell-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}-${{ steps.meta.outputs.sha }}
          restore-keys: |
            rust-measuring-shell-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}-
            rust-measuring-shell-
            rust-group-rust-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}-

      - name: Prepare restored target timestamps
        run: python -c "import pathlib, sys; sys.path.insert(0, '.shell-driver/tools'); import ci; ci.ROOT = pathlib.Path('.').resolve(); sys.exit(ci.set_times('.cargo-target'))"

      - name: Build measuring shell
        run: python .shell-driver/tools/e2e/suite.py build-hosted-shell --source-root . --out dist --target .cargo-target

      - name: Upload measuring shell
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Save Rust cache
        if: steps.cache.outputs.cache-hit != 'true' && steps.meta.outputs.allow_save == 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            .cargo-target
          key: rust-measuring-shell-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}-${{ steps.meta.outputs.sha }}
