name: Release
run-name: Release ${{ inputs.channel || 'nightly' }}${{ inputs.draft && ' (dry run)' || '' }}

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        default: nightly
        options:
          - nightly
          - stable
          - preview
      sha:
        description: The commit to release; nightly defaults to main's newest green commit, stable to the nightly feed's commit
        type: string
        default: ""
      version:
        description: Stable only, for a larger step than the next patch
        type: string
        default: ""
      draft:
        description: Dry run; publish to a new draft release and leave the channel's feed alone
        type: boolean
        default: false
      prepare:
        description: Stable only; build the candidate now, so the release later only promotes it
        type: boolean
        default: false

concurrency:
  group: ${{ (inputs.channel == 'stable' || inputs.channel == 'preview') && !inputs.draft && format('release-{0}', inputs.channel) || format('release-run-{0}', github.run_id) }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      due: ${{ steps.resolve.outputs.due }}
      commit: ${{ steps.resolve.outputs.commit }}
      version: ${{ steps.resolve.outputs.version }}
      artifact: ${{ steps.resolve.outputs.artifact }}
      candidate_run: ${{ steps.resolve.outputs.candidate_run }}
      build: ${{ steps.resolve.outputs.build }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - id: resolve
        name: Decide whether a release is due
        env:
          GH_TOKEN: ${{ github.token }}
          PAUSE_NIGHTLY: ${{ vars.PAUSE_NIGHTLY }}
          CHANNEL: ${{ inputs.channel || 'nightly' }}
          SHA: ${{ inputs.sha }}
          VERSION: ${{ inputs.version }}
          FLAGS: >-
            ${{ github.event_name == 'schedule' && '--scheduled' || '' }}
            ${{ inputs.draft && '--draft' || '' }}
            ${{ inputs.prepare && '--prepare' || '' }}
        run: python tools/release.py resolve --channel "$CHANNEL" --sha "$SHA" --version "$VERSION" $FLAGS --github-output

  build:
    name: Build
    needs: resolve
    if: needs.resolve.outputs.due == 'true' && needs.resolve.outputs.build == 'true'
    uses: ./.github/workflows/release-candidate.yml
    with:
      channel: ${{ inputs.channel || 'nightly' }}
      commit: ${{ needs.resolve.outputs.commit }}
      version: ${{ inputs.channel == 'stable' && needs.resolve.outputs.version || '' }}
    secrets:
      LEAK_GATE_TERMS: ${{ secrets.LEAK_GATE_TERMS }}

  publish:
    name: Publish
    needs: [resolve, build]
    if: ${{ !cancelled() && needs.resolve.outputs.publish == 'true' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: windows-latest
    timeout-minutes: 30
    environment: ${{ inputs.channel == 'stable' && 'release-stable' || 'release' }}
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install the signers
        run: |
          python -m pip install --disable-pip-version-check --quiet cryptography==50.0.2
          npm ci

      - name: Take the candidate
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.resolve.outputs.artifact }}
          path: candidate
          run-id: ${{ needs.resolve.outputs.candidate_run || github.run_id }}
          github-token: ${{ github.token }}

      - name: Sign, check and publish
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel || 'nightly' }}
          COMMIT: ${{ needs.resolve.outputs.commit }}
          VERSION: ${{ inputs.channel == 'stable' && needs.resolve.outputs.version || '' }}
          DRAFT: ${{ inputs.draft && '--draft' || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          LEAK_GATE_TERMS: ${{ secrets.LEAK_GATE_TERMS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python tools/release.py publish --channel "$CHANNEL" --candidate candidate --commit "$COMMIT" --version "$VERSION" $DRAFT

  finalize:
    name: Set main's workspace version
    needs: [resolve, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && inputs.channel == 'stable' && !inputs.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-stable
    permissions:
      contents: read
    steps:
      - name: Check the deploy key
        env:
          HAS_KEY: ${{ secrets.RELEASE_DEPLOY_KEY != '' }}
        run: |
          if [[ "$HAS_KEY" != true ]]; then
            echo "::error::The release is published, but main's workspace version was not set: the RELEASE_DEPLOY_KEY secret of release-stable is missing. Set it and re-run this job."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Push the version to main
        run: python tools/release.py finalize --version "${{ needs.resolve.outputs.version }}"
