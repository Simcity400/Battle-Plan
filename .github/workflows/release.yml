name: Release

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        default: nightly
        options:
          - nightly
          - stable
          - preview
      sha:
        description: The commit to release; nightly defaults to main's head, stable to the nightly feed's commit
        type: string
        default: ""
      version:
        description: Stable only, for a larger step than the next patch
        type: string
        default: ""
      draft:
        description: Dry run; publish to a new draft release and leave the channel's feed alone
        type: boolean
        default: false

concurrency:
  group: release-${{ inputs.channel || 'nightly' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      due: ${{ steps.resolve.outputs.due }}
      commit: ${{ steps.resolve.outputs.commit }}
      version: ${{ steps.resolve.outputs.version }}
      candidate_run: ${{ steps.resolve.outputs.candidate_run }}
      build: ${{ steps.resolve.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - id: resolve
        name: Decide whether a release is due
        env:
          GH_TOKEN: ${{ github.token }}
          PAUSE_NIGHTLY: ${{ vars.PAUSE_NIGHTLY }}
          CHANNEL: ${{ inputs.channel || 'nightly' }}
          SHA: ${{ inputs.sha }}
          VERSION: ${{ inputs.version }}
          SCHEDULED: ${{ github.event_name == 'schedule' && '--scheduled' || '' }}
        run: python tools/release.py resolve --channel "$CHANNEL" --sha "$SHA" --version "$VERSION" $SCHEDULED --github-output

  build:
    name: Build
    needs: resolve
    if: needs.resolve.outputs.due == 'true' && needs.resolve.outputs.build == 'true'
    uses: ./.github/workflows/release-candidate.yml
    with:
      channel: ${{ inputs.channel }}
      commit: ${{ needs.resolve.outputs.commit }}
      version: ${{ needs.resolve.outputs.version }}
    secrets:
      LEAK_GATE_TERMS: ${{ secrets.LEAK_GATE_TERMS }}

  publish:
    name: Publish
    needs: [resolve, build]
    if: always() && needs.resolve.outputs.due == 'true' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: windows-latest
    timeout-minutes: 30
    environment: ${{ inputs.channel == 'stable' && 'release-stable' || 'release' }}
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install the signers
        run: |
          python -m pip install --disable-pip-version-check --quiet cryptography==50.0.2
          npm ci

      - name: Take the candidate
        uses: actions/download-artifact@v8
        with:
          name: candidate-${{ inputs.channel || 'nightly' }}
          path: candidate
          run-id: ${{ needs.resolve.outputs.candidate_run || github.run_id }}
          github-token: ${{ github.token }}

      - name: Sign, check and publish
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel || 'nightly' }}
          DRAFT: ${{ inputs.draft && '--draft' || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          LEAK_GATE_TERMS: ${{ secrets.LEAK_GATE_TERMS }}
        run: python tools/release.py publish --channel "$CHANNEL" --candidate candidate $DRAFT

  finalize:
    name: Set main's workspace version
    needs: [resolve, publish]
    if: needs.publish.result == 'success' && inputs.channel == 'stable' && !inputs.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Commit the version through a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/release.py finalize --version "${{ needs.resolve.outputs.version }}"
