[build]
target-dir = ".cargo-target"

# Incremental compilation stays on (Cargo's default for dev and test), so rebuilds after small
# edits are fast.
[profile.dev]
debug = 0

[profile.test]
debug = 0

# Tests leave replay unoptimised: test binaries of the crates above it wait for its library, which
# builds in about 22 s unoptimised and 206 s at opt-level 2, and its 2,000-hour fault acceptance test
# still finishes in under a minute. Dev builds keep replay optimised for interactive loading.
[profile.dev.package.replay]
opt-level = 2

# The engine and collector scale tests run up to 5,000 countries in the default suite.
# Engine takes about 70 s unoptimised and 6 s optimised; dev optimises it too, so dev and
# test share it. Collector uses opt-level 1: its test binary builds in about 200 s instead of
# 330 s and its tests finish in under a minute; unoptimised, one test overflows its stack.
[profile.dev.package.engine]
opt-level = 2

[profile.test.package.engine]
opt-level = 2

[profile.test.package.collector]
opt-level = 1

# Dashboard cold loads parse the verified content catalogue and compact replay
# projections. Keep those CPU paths representative during interactive UI work.
[profile.dev.package.installed-content]
opt-level = 2

[profile.dev.package.dashboard]
opt-level = 2

# Replay loading decompresses large blocks. Keep the native codec optimized in
# development too; compiling its C implementation at -O0 dominates load time.
[profile.dev.package.zstd-sys]
opt-level = 3

[profile.test.package.zstd-sys]
opt-level = 3
