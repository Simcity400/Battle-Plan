[build]
target-dir = ".cargo-target"

# Incremental compilation stays on (Cargo's default for dev and test), so rebuilds after small
# edits are fast.
[profile.dev]
debug = 0

[profile.test]
debug = 0

# Replay stays optimised in dev for interactive loading. Unoptimised, replay's library builds in
# about 25 s instead of 100-170 s (110 s at opt-level 1).
[profile.dev.package.replay]
opt-level = 2

# replay-data holds the row codecs replay used to compile, at the same level.
[profile.dev.package.replay-data]
opt-level = 2

[profile.dev.package.replay-identity]
opt-level = 2

# Native readers stay optimised in dev for interactive runs.
[profile.dev.package.engine]
opt-level = 2

[profile.dev.package.engine-air-history]
opt-level = 2

[profile.dev.package.engine-characters]
opt-level = 2

[profile.dev.package.engine-decisions]
opt-level = 2

[profile.dev.package.engine-deployment]
opt-level = 2

[profile.dev.package.engine-dlc]
opt-level = 2

[profile.dev.package.engine-equipment]
opt-level = 2

[profile.dev.package.engine-events]
opt-level = 2

[profile.dev.package.engine-executable]
opt-level = 2

[profile.dev.package.engine-fixed-layout]
opt-level = 2

[profile.dev.package.engine-focus]
opt-level = 2

[profile.dev.package.engine-fuel]
opt-level = 2

