[build]
target-dir = ".cargo-target"
rustc-wrapper = "sccache"

[env]
SCCACHE_DIR = { value = "C:\\sccache_cache", force = true }

# Cargo applies `incremental` only to workspace crates, so sccache still caches
# every dependency. Enable it here, not through the environment or a user
# config: `CARGO_INCREMENTAL=0` (or `build.incremental = false`) silently turns
# it off again, and sccache exits with an error when `CARGO_INCREMENTAL` or
# `CARGO_BUILD_INCREMENTAL` is `1`.
[profile.dev]
debug = 0
incremental = true

[profile.test]
debug = 0
incremental = true

# The replay crate's 2,000-hour fault acceptance test takes about 121 s unoptimised and
# about 16 s optimised; optimising replay keeps the full test suite short.
[profile.dev.package.replay]
opt-level = 2

[profile.test.package.replay]
opt-level = 2

# The collector and engine scale tests run up to 5,000 countries in the default suite:
# unoptimised they take about 150 s and 70 s, optimised about 15 s and 6 s. Engine is
# optimised in dev as well, like replay, so dev and test share engine and replay.
[profile.dev.package.engine]
opt-level = 2

[profile.test.package.engine]
opt-level = 2

[profile.test.package.collector]
opt-level = 2

# Dashboard cold loads parse the verified content catalogue and compact replay
# projections. Keep those CPU paths representative during interactive UI work.
[profile.dev.package.installed-content]
opt-level = 2

[profile.dev.package.dashboard]
opt-level = 2

# Replay loading decompresses large blocks. Keep the native codec optimized in
# development too; compiling its C implementation at -O0 dominates load time.
[profile.dev.package.zstd-sys]
opt-level = 3

[profile.test.package.zstd-sys]
opt-level = 3

[target.x86_64-pc-windows-msvc]
linker = "lld-link"
