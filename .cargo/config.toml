# Replay loading decompresses large blocks. Keep the native codec optimized in
# development too; compiling its C implementation at -O0 dominates load time.
[profile.dev.package.zstd-sys]
opt-level = 3

[profile.test.package.zstd-sys]
opt-level = 3

# Tests build every workspace crate unoptimised. `[profile.test]` inherits each
# `[profile.dev.package.*]` override, so the crates dev optimises are reset here: an edit then costs
# an incremental unoptimised compile instead of re-optimising the crate and its dependents, and test
# builds no longer share artifacts with interactive dev builds. Tests that take more than about two
# seconds unoptimised run behind their crate's `slow-tests` feature. Third-party crates keep their
# dev settings (zstd-sys stays at opt-level 3).
[profile.test.package.replay]
opt-level = 0

[profile.test.package.replay-data]
opt-level = 0

[profile.test.package.replay-identity]
opt-level = 0

[profile.test.package.engine]
