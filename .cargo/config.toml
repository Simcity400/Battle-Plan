[build]
target-dir = ".cargo-target"
rustc-wrapper = "sccache"

[env]
SCCACHE_DIR = { value = "C:\\sccache_cache", force = true }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

# The replay crate's 2,000-hour fault acceptance test takes about 121 s unoptimised and
# about 16 s optimised; optimising replay keeps the full test suite short.
[profile.dev.package.replay]
opt-level = 2

[profile.test.package.replay]
opt-level = 2

# Dashboard cold loads parse the verified content catalogue and compact replay
# projections. Keep those CPU paths representative during interactive UI work.
[profile.dev.package.installed-content]
opt-level = 2

[profile.dev.package.analytics]
opt-level = 2

# Replay loading decompresses large blocks. Keep the native codec optimized in
# development too; compiling its C implementation at -O0 dominates load time.
[profile.dev.package.zstd-sys]
opt-level = 3

[profile.test.package.zstd-sys]
opt-level = 3

[target.x86_64-pc-windows-msvc]
linker = "lld-link"
