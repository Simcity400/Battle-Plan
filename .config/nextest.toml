[store]
dir = "target/nextest"

[profile.default]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 60 }

[[profile.default.overrides]]
filter = '''
test(/5000|5_000|five_thousand/)
| (package(replay) & test(/^acceptance::/))
| (package(collector-naval-history) & test(/oob_entry_tests|oob_root_fields/))
'''
priority = 60

[[profile.default.overrides]]
filter = 'package(/^dashboard(?:-(?:air|economy|effects|intelligence|land|naval|players|politics|production|research|wars|world))?$/)'
priority = 50

[profile.hosted]
slow-timeout = { period = "60s", terminate-after = 10 }
status-level = "slow"
final-status-level = "none"
failure-output = "never"
success-output = "never"

[profile.hosted.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true
