[profile.default]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 60 }

[[profile.default.overrides]]
filter = '''
test(/5000|5_000|five_thousand/)
| (package(replay) & test(/^acceptance::/))
| (package(collector) & test(/oob_entry_tests|oob_root_fields|role_capture_cost/))
'''
priority = 60

[[profile.default.overrides]]
filter = 'package(dashboard)'
priority = 50

[profile.daily.junit]
path = "junit.xml"
