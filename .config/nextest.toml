# Exclusion audit (lane QG, 2026-08-24). Everything filtered out here is one
# of: (a) HOI4-install-backed tests, `#[cfg_attr(not(gate_hoi4_install),
# ignore)]` -- they parse/decode the real shipped game corpus and are skipped
# by the harness itself without an install; (b) captured-session-backed tests,
# which replay artifacts from a specific live capture session; (c) the soak
# binaries, run only via [profile.soak]; (d) the game_ui evidence binaries in
# [profile.default], whole-binary harnesses that require the install and run
# under [profile.evidence]. No test is excluded for being slow: slow
# deterministic tests are fixed at the root instead.
[profile.default]
default-filter = '''
not (
  binary(replay_app_soak)
  | binary(/^(game_ui_evidence|game_ui_binding_evidence)$/)
  | test(/(?x)(^|::)(
      admitted_ui_resolver_rejects_an_installed_but_unrecorded_path
      | captured_pixel_shader_prefilter_covers_full_family_classifiers
      | corpus_.*_when_session_available
      | frame_owned_xui23_carrier_reaches_the_actual_production_renderer
      | positive_event_popup_reaches_the_shipping_compositor_with_shipped_assets
      | gate_a_all_vanilla_mesh_and_anim_files_parse
      | gate_all_vanilla_.*
      | gate_b_diverse_mesh_semantic_checks
      | gate_building_cb1_atlas_uvanim_dead_for_standard
      | gate_captured_.*
      | gate_files_lut_matches_captured_color_cube_byte_exact
      | gate_full_map_river_extraction_vanilla
      | gate_map_effects_reflection_matches_captured
      | gate_per_frame_recompose_is_byte_identical_at_captured_camera
      | gate_river_world_comparison_against_captured_sessions
      | gate_tree_scatter_chunk_law_vs_live_trees_measure
      | gate_vanilla_.*
      | gate_wave1_cap4_.*
      | gated_vanilla_.*
      | hoi_18mbs_loads_from_real_install_when_present
      | installed_.*
      | lod_selection_gate_env_when_session_available
      | low_gfx_and_full_pixel_shaders_identify_by_effect
      | overlay_font_uses_real_hoi18mbs_when_resolver_exists
      | product_resolver_adapter_uses_effective_namespace_without_frozen_counts
      | real_bundle_verdict_is_low_gfx_created_but_unused
      | resolver_decode_byte_equals_captured_payload_from_assets
      | session_20260702b_draw0_ps_cb0_matches_terrain_scene_cb0_evidence
      | shipped_border_textures_match_documented_profiles
      | terrain_id_map_.*_when_available
      | terrain_id_map_orphan_palette_set_is_narrow
      | terrain_texture_table_matches_vanilla_atlas_order_when_available
      | topbar_rects_follow_engine_layout_law
      | vanilla_admission_matches_all_frozen_o05_semantics
      | vanilla_resolver_decodes_render_assets_and_builds_known_land_counter
      | capfix2_prefilter_admits_real_captured_pdxmap_pixel_shader
      | draw_time_cull_matches_the_captured_drawn_set
      | engine_underwater_terrain_diffuse_is_the_shipped_seabed_dds
      | frame(?:162662|4700)_.*
      | gate_fixture_.*
      | gate_tree_season_cb1_vs_live_trees_measure
      | glyph_.*
      | mapname_discriminator_matches_live_captured_vertex_shader
      | no_captured_draw_binds_the_low_gfx_pixel_shader
      | oracle63_engine_baseline_reproduces
      | perf_reduction_over_full_res_scene
      | retained_capture_interpreter_relocates_through_vfs_and_executes_in_d77_order
      | shipped_gui_scene_and_compositor_accept_exact_trade_cards
      | vanilla_(?:combat|counter|division|faction|land|map_counter|naval)_.*
      | wave9_hidden_counter_gate_reads_draws_and_wvp_cb_writes
    )$/)
)
'''
fail-fast = true
failure-output = "immediate-final"
success-output = "never"
status-level = "fail"
final-status-level = "slow"
slow-timeout = "10s"

[profile.ci]
default-filter = '''
not (
  binary(replay_app_soak)
  | test(/(?x)(^|::)(
      admitted_ui_resolver_rejects_an_installed_but_unrecorded_path
      | alerts_feed_window_resolves_via_shared_parser
      | achievements_gridbox_slots_follow_declared_slot_size
      | absent_world_frame_data_is_omitted_by_topbar_composition
      | backend_listbox_declares_vertical_rows_from_file_template_size
      | captured_pixel_shader_prefilter_covers_full_family_classifiers
      | corpus_.*_when_session_available
      | frame_owned_xui23_carrier_reaches_the_actual_production_renderer
      | positive_event_popup_reaches_the_shipping_compositor_with_shipped_assets
      | gate_a_all_vanilla_mesh_and_anim_files_parse
      | gate_all_vanilla_.*
      | gate_b_diverse_mesh_semantic_checks
      | gate_building_cb1_atlas_uvanim_dead_for_standard
      | gate_captured_.*
      | gate_files_lut_matches_captured_color_cube_byte_exact
      | gate_full_map_river_extraction_vanilla
      | gate_map_effects_reflection_matches_captured
      | gate_per_frame_recompose_is_byte_identical_at_captured_camera
      | gate_river_world_comparison_against_captured_sessions
      | gate_tree_scatter_chunk_law_vs_live_trees_measure
      | gate_vanilla_.*
      | gate_wave1_cap4_.*
      | gated_vanilla_.*
      | hoi_18mbs_loads_from_real_install_when_present
      | installed_.*
      | lod_selection_gate_env_when_session_available
      | low_gfx_and_full_pixel_shaders_identify_by_effect
      | overlay_font_uses_real_hoi18mbs_when_resolver_exists
      | product_resolver_adapter_uses_effective_namespace_without_frozen_counts
      | real_bundle_verdict_is_low_gfx_created_but_unused
      | resolver_decode_byte_equals_captured_payload_from_assets
      | session_20260702b_draw0_ps_cb0_matches_terrain_scene_cb0_evidence
      | shipped_border_textures_match_documented_profiles
      | scrollbar_declared_parts_are_resolved_but_thumb_travel_fails_closed
      | topbar_alert_badges_resolve_via_shared_parser
      | unobtained_world_frame_leaf_is_selectively_omitted_by_topbar_composition
      | unitview_detail_panels_have_all_file_field_slots
      | waroverview_layout_resolves_from_files
      | terrain_id_map_.*_when_available
      | terrain_id_map_orphan_palette_set_is_narrow
      | terrain_texture_table_matches_vanilla_atlas_order_when_available
      | topbar_rects_follow_engine_layout_law
      | vanilla_admission_matches_all_frozen_o05_semantics
      | vanilla_resolver_decodes_render_assets_and_builds_known_land_counter
      | capfix2_prefilter_admits_real_captured_pdxmap_pixel_shader
      | draw_time_cull_matches_the_captured_drawn_set
      | engine_underwater_terrain_diffuse_is_the_shipped_seabed_dds
      | frame(?:162662|4700)_.*
      | gate_fixture_.*
      | gate_tree_season_cb1_vs_live_trees_measure
      | glyph_.*
      | mapname_discriminator_matches_live_captured_vertex_shader
      | no_captured_draw_binds_the_low_gfx_pixel_shader
      | oracle63_engine_baseline_reproduces
      | perf_reduction_over_full_res_scene
      | retained_capture_interpreter_relocates_through_vfs_and_executes_in_d77_order
      | shipped_gui_scene_and_compositor_accept_exact_trade_cards
      | vanilla_(?:combat|counter|division|faction|land|map_counter|naval)_.*
      | wave9_hidden_counter_gate_reads_draws_and_wvp_cb_writes
    )$/)
)
'''
fail-fast = false
failure-output = "immediate-final"
success-output = "never"
status-level = "fail"
final-status-level = "slow"
retries = 0
# Sized to this machine: AMD Ryzen 7 9800X3D, 8 cores / 16 logical CPUs
# ($env:NUMBER_OF_PROCESSORS = 16). nextest's default already equals 16, and
# the gate's tail is spawn-bound (~10.7k sub-second tests = ~1,394 s CPU of
# per-process startup; PROFILE.md s1), so the ci profile oversubscribes to
# 2x logical CPUs to keep the kernel's process-creation pipeline full.
# Revert to 16 if any fsync-heavy spool_trim timing proof flakes under
# contention (PROFILE.md s4/L1).
test-threads = 32
slow-timeout = "10s"

[profile.soak]
default-filter = 'binary(replay_app_soak)'
fail-fast = false
failure-output = "immediate-final"
success-output = "never"
status-level = "slow"
final-status-level = "slow"
retries = 0
slow-timeout = "5m"

