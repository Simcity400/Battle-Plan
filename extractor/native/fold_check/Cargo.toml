[package]
name = "fold_check"
version = "0.1.0"
edition = "2021"

# Fold-equivalence gate (G1). Streams a collector compact record stream (or the
# collector_compact_stream entry of a .battleplan container) through the EXISTING
# production `recorder_host::world_fold::WorldFold` and hashes the per-game-hour
# folded snapshot, so an optimized collector can be certified fold-identical.

[dependencies]
recorder_host = { path = "../recorder_host" }
snapshot = { path = "../snapshot" }
compact_contract = { path = "../compact_contract" }
serde_json = "1"

[[bin]]
name = "fold_check"
path = "src/main.rs"
