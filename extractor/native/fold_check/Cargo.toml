[package]
name = "fold_check"
version = "0.1.0"
edition = "2021"

# Fold-equivalence gate (G1). Streams a collector compact record stream (or the
# collector_compact_stream entry of a .battleplan container) through the shared
# `replay_decoder` facade — which drives the EXISTING production
# `recorder_host::world_fold::WorldFold` — and hashes the per-game-hour folded
# snapshot, so an optimized collector can be certified fold-identical.

[dependencies]
replay_decoder = { path = "../replay_decoder" }
snapshot = { path = "../snapshot" }
compact_contract = { path = "../compact_contract" }
compact_stream = { path = "../compact_stream" }
serde_json = "1"

[dev-dependencies]
# Certification tests build d86 payloads through the lane's OWN encoder rather
# than by hand: a payload the lane contract would refuse to emit must not be
# constructible for a test either, or the test pins a shape production cannot
# produce.
sunk_ship_history_live_lane = { path = "../lanes/sunk_ship_history_live" }

[[bin]]
name = "fold_check"
path = "src/main.rs"
