[package]
name = "wire_format"
version = "0.1.0"
edition = "2021"
description = "Reference implementation of extractor/documents/WIRE_FORMAT.md: primitives, records, frames and schemas for the rebuilt replay stream. Golden vectors live beside the code and are the byte-identity gate."

[dependencies]
blake3 = "1"
# Used ONLY by the measurement binaries that read shipping compact streams
# (`src/bin/bench_real_d63.rs`), never by the library: a harness that re-derives
# the H4CR framing contract instead of calling it drifts from the recorder
# silently. `compact_contract` is a leaf crate with no runtime dependencies of
# its own, so this does not compromise the reference implementation's isolation.
compact_contract = { path = "../compact_contract" }
