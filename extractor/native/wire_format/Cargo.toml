[package]
name = "wire_format"
version = "0.1.0"
edition = "2021"
description = "Reference implementation of extractor/documents/WIRE_FORMAT.md: primitives, records, frames and schemas for the rebuilt replay stream. Golden vectors live beside the code and are the byte-identity gate."

[dependencies]
blake3 = "1"
# Admitted uses are deliberately finite: measurement binaries may use the
# shipping framing/status/stream contract; production library code may use only
# d81's `compact_contract::rail_replay` payload authority and the shared status
# predicates needed to preserve its fold order. No other production codec is
# admitted without updating this allow-list and DOMAIN_SCHEMA_RECIPE.md under
# adversarial review. The allow-list is enforced by
# tests/compact_contract_dependency_policy.rs.
# production-compact-authority-allow=d81:rail_replay,compact_status_unknown_flags_v1,compact_status_is_failure
# `compact_contract` has no normal dependencies, so the
# production exception cannot pull recorder or capture-lane policy into this
# reference implementation. It does not replace capture, measurement, packed
# reopen, or source-parity gates.
compact_contract = { path = "../compact_contract" }
# D13's payload grammar, owner ruling 2026-08-15: ONE shared decoder. This is a
# LEAF crate with no dependencies of its own, so depending on it reverses none of
# this crate's directions -- in particular it is NOT a `recorder_host` dependency
# and carries no recorder or capture-lane policy. It replaces the transcribed
# structural walk in `src/d13.rs`, which went stale against the shipping producer
# within a day of a section being added and refused every payload a shipping
# recorder writes.
d13_grammar = { path = "../d13_grammar" }
# D68's payload grammar (lane KO). Same ruling, same shape: one leaf crate per
# domain, so a converted domain never enters an unrelated consumer's closure.
d68_grammar = { path = "../d68_grammar" }
# D24's payload grammar (lane KO).
d24_grammar = { path = "../d24_grammar" }
portable_content_manifest = { path = "../../../portable_replay/native/content_manifest" }
portable_admission = { path = "../../../portable_replay/native/admission" }
serde_json = "1"
sha2 = "0.10"
