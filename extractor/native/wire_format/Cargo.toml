[package]
name = "wire_format"
version = "0.1.0"
edition = "2021"
description = "Primitives, records, frames, and schemas for the rebuilt replay stream. Golden vectors live beside the code and are the byte-identity gate."

[dependencies]
portable_render_stream = { path = "../../../portable_replay/native/render_stream" }
# D34's air-base-status byte grammar (lane UT). Dependency-free leaf: the
# anchor kinds and row shape live in one place so this crate and the three
# others that read them cannot drift on what a coded anchor MEANS.
d34_grammar = { path = "../d34_grammar" }
# D28's OOB-command byte grammar (lane UT). Same shape, same reason.
d28_grammar = { path = "../d28_grammar" }
# D29's ship-row byte grammar (lane UT). Same shape, same reason.
d29_grammar = { path = "../d29_grammar" }
blake3 = "1"
# Admitted uses are deliberately finite: measurement binaries may use the
# shipping framing/status/stream contract; production library code may use only
# d26's division-equipment grammar, d54's battleplan-link and owner-colour
# grammars, and d81's rail-replay grammar plus its shared status predicates.
# No other production codec is admitted without updating this allow-list under
# adversarial review. It is enforced by
# tests/wire_format_suite/compact_contract_dependency_policy.rs.
# production-compact-authority-allow=d26:division_equipment,d54:battleplan_links,d54:owner_colour,d81:rail_replay,compact_status_unknown_flags_v1,compact_status_is_failure
# `compact_contract`'s only normal dependencies are `sha2` and the
# dependency-free `id_set_codec` grammar leaf, so the production exception
# cannot pull recorder or capture-lane policy into this reference
# implementation. (The claim here used to be "no normal dependencies", which was
# already untrue of `sha2`; the security argument is the absence of POLICY, not
# the absence of edges.) It does not replace capture, measurement, packed
# reopen, or source-parity gates.
compact_contract = { path = "../compact_contract" }
# D11's payload grammar (lane KX). Same dependency-free leaf shape as D13:
# wire_format keeps its semantic projection and messages, while all byte
# boundaries and the nested deployment walk come from the shared grammar.
d11_grammar = { path = "../d11_grammar" }
# D13's payload grammar, owner ruling 2026-08-15: ONE shared decoder. This is a
# LEAF crate with no dependencies of its own, so depending on it reverses none of
# this crate's directions -- in particular it is NOT a `recorder_host` dependency
# and carries no recorder or capture-lane policy. It replaces the transcribed
# structural walk in `src/d13.rs`, which went stale against the shipping producer
# within a day of a section being added and refused every payload a shipping
# recorder writes.
d13_grammar = { path = "../d13_grammar" }
# D68's payload grammar (lane KO). Same ruling, same shape: one leaf crate per
# domain, so a converted domain never enters an unrelated consumer's closure.
d64_grammar = { path = "../d64_grammar" }
d68_grammar = { path = "../d68_grammar" }
# D24's payload grammar (lane KO).
d24_grammar = { path = "../d24_grammar" }
# D48's coverage-trailer grammar (lane NA). Same ruling, same leaf shape. It is
# what lets this port share the D48V byte boundaries with the shipping producer
# WITHOUT widening the `compact_contract` allow-list above: `d48_grammar` and
# its own `id_set_codec` leaf are dependency-free and carry no recorder or
# capture-lane policy. This port keeps its semantic projection, its schema and
# its deliberately stricter railway-identity refusal.
d48_grammar = { path = "../d48_grammar" }
# D21's org-loss window threshold. Dependency-free portable leaf: pinned engine
# evidence, no recorder or capture-lane policy.
portable_engine_evidence = { path = "../../../portable_replay/native/engine_evidence" }
portable_content_manifest = { path = "../../../portable_replay/native/content_manifest" }
portable_admission = { path = "../../../portable_replay/native/admission" }
serde_json = "1"
sha2 = "0.10"
