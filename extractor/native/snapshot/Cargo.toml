[package]
name = "snapshot"
version = "0.1.0"
edition = "2021"
description = "Forward-compatible READ-ONLY reader for the replay snapshot store"

[dependencies]
compact_stream = { path = "../compact_stream" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# DEFLATE compatibility for old .battleplan ZIP containers. SHA-256 + the
# minimal ZIP/Zip64 central-directory reader are implemented in-crate (no
# crypto/zip deps).
flate2 = "1"
# CRC32 for the reference ZIP PACKER (writer side / test-fixture builder). Already
# in the workspace lock. The READER never needs it.
crc32fast = "1"
zstd = "0.13.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[[bin]]
name = "m0_demo"
path = "src/bin/m0_demo.rs"

[[bin]]
name = "pack_replay"
path = "src/bin/pack_replay.rs"
