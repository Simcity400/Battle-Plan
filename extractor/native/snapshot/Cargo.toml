[package]
name = "snapshot"
version = "0.1.0"
edition = "2021"
description = "Forward-compatible READ-ONLY reader for the replay snapshot store"
# src/bin/ no longer exists in this package; every bin is declared explicitly
# below against the neutral sources.
autobins = false

[features]
default = []
# Passthrough for the Lane CE cache-size measurement instrument. Never on by
# default; no production binary in this package enables it.
ce-cache-anatomy = ["portable_replay_format/ce-cache-anatomy"]

[dependencies]
compact_stream = { path = "../compact_stream" }
portable_replay_format = { path = "../../../portable_replay/native/snapshot" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# DEFLATE compatibility for old .battleplan ZIP containers. SHA-256 + the
# minimal ZIP/Zip64 central-directory reader are implemented in-crate (no
# crypto/zip deps).
flate2 = "1"
# CRC32 for the reference ZIP PACKER (writer side / test-fixture builder). Already
# in the workspace lock. The READER never needs it.
crc32fast = "1"
zstd = "0.13.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# The bin sources live in the NEUTRAL layer next to the implementation they
# drive (portable_replay/native/snapshot/src/bin). They were moved there so the
# replay-side pathname-capability audit
# (replay_interface/native/replay_core/src/source.rs::
# production_sources_have_no_descendant_pathname_read) can scan them without
# reaching across the boundary into extractor/. They are still declared here so
# the centralized Release keeps emitting `.cargo-target/release/pack_replay.exe`
# for the `container_verify` production-artifact role, and so every existing
# `cargo run -p snapshot --bin pack_replay ...` invocation is unchanged.

[[bin]]
name = "m0_demo"
path = "../../../portable_replay/native/snapshot/src/bin/m0_demo.rs"

[[bin]]
name = "pack_replay"
path = "../../../portable_replay/native/snapshot/src/bin/pack_replay.rs"

[[bin]]
name = "container_codec_bench"
path = "../../../portable_replay/native/snapshot/src/bin/container_codec_bench.rs"
