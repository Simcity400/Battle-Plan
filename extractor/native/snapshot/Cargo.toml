[package]
name = "snapshot"
version = "0.1.0"
edition = "2021"
description = "Forward-compatible READ-ONLY reader for the replay snapshot store"
# src/bin/ no longer exists in this package; every bin is declared explicitly
# below against the neutral sources.
autobins = false

[features]
default = []
# Passthrough for the H4CP v3 prototype instrument (restored by lane PR).
dq-v3-prototype = ["portable_replay_format/dq-v3-prototype"]
# The `ce-cache-anatomy` and `dq-v3-prototype` passthroughs that stood here were
# the only thing in this workspace that enabled the same-named
# `portable_replay_format` features. They were removed on 2026-08-13 with the
# lane CE and lane DQ instruments in `replay_decoder` that were their sole
# consumers; the neutral-layer features they forwarded to belong to
# `portable_replay/` and are untouched.

[dependencies]
portable_replay_format = { path = "../../../portable_replay/native/snapshot" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# DEFLATE compatibility for old .battleplan ZIP containers. SHA-256 + the
# minimal ZIP/Zip64 central-directory reader are implemented in-crate (no
# crypto/zip deps).
flate2 = "1"
# CRC32 for the reference ZIP PACKER (writer side / test-fixture builder). Already
# in the workspace lock. The READER never needs it.
crc32fast = "1"
zstd = "0.13.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
] }

# The packer source lives in the NEUTRAL layer next to the implementation it
# drives (portable_replay/native/snapshot/src/bin). It lives there so the
# replay-side pathname-capability audit
# (`replay_interface/native/replay_core/src/source.rs::production_sources_have_no_descendant_pathname_read`)
# can scan it without reaching across the boundary into extractor/. It remains
# declared here so
# the centralized Release keeps emitting `.cargo-target/release/pack_replay.exe`
# for the `container_verify` production-artifact role, and so every existing
# `cargo run -p snapshot --bin pack_replay ...` invocation is unchanged.

[[bin]]
name = "pack_replay"
path = "../../../portable_replay/native/snapshot/src/bin/pack_replay.rs"

[dev-dependencies]
# Junction fixtures are made in-process through the shared native mount-point
# helper; the former cmd link shell-outs allocated a visible console window
# per call on console-less harnesses.
portable_test_fs_retry = { path = "../../../portable_replay/native/test_fs_retry" }
