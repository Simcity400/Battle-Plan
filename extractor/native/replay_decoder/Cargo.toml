[package]
name = "replay_decoder"
version = "0.1.0"
edition = "2021"
description = "Shared pull-based decoder for the game compact record stream: frames H4CR records, drives the one production WorldFold, and yields canonical per-game-hour world-state JSON. A thin facade over compact_contract framing + recorder_host fold + the snapshot container reader (no forked decode, no forked fold)."
autobins = false
autotests = false

[features]
default = []
# Historical process-boundary fixture only. Production uses replay_app's
# authenticated internal child mode and must never mint or package this binary.
dev-prefold-worker-bin = []

[dependencies]
compact_stream = { path = "../compact_stream" }
compact_contract = { path = "../compact_contract" }
recorder_host = { path = "../recorder_host" }
snapshot = { path = "../snapshot" }
serde_json = "1"

[[bin]]
name = "replay_prefold_worker"
path = "src/bin/replay_prefold_worker.rs"
required-features = ["dev-prefold-worker-bin"]

[[test]]
name = "prefold_worker_process"
path = "tests/prefold_worker_process.rs"
required-features = ["dev-prefold-worker-bin"]
