[package]
name = "d43_grammar"
version = "0.1.0"
edition = "2021"
description = "The single structural walk of domain 43's (market_trade_live) compact DATA payload: the 48-byte core header, the 48-byte purchase-contract rows, and all nine trailer families (MTD1, MTRF, MTRH, MTRR, MTRD, MTRA, MTS1, MTRB, MTLL) across every legal version, plus the encoder. Owner ruling 2026-08-15 - ONE shared decoder per domain, because the same grammar was transcribed at four sites."

# THIS CRATE HAS NO DEPENDENCIES, AND THAT IS THE POINT.
#
# The duplication this crate replaces existed because of deliberate crate
# directions: `collector` (the producer), `recorder_host` (the fold AND the
# authority validator) and `market_trade_live_lane` (the gate tool) do not
# depend on one another, and none of them may start to. A leaf with no
# dependencies is the only shape all four sites can depend on without any of
# those directions being reversed. Adding a dependency here would put that
# back: every dependency of this crate becomes a dependency of all four.
#
# The one bound this grammar needs and does not own -- the strategic-resource
# count ceiling, which decides an MTRF v3 row's WIDTH -- is therefore taken as
# an ARGUMENT (`ResourceCeiling`), stated by the caller from
# `compact_contract::build_profile::MAX_COMPACT_STRATEGIC_RESOURCE_COUNT`,
# rather than imported. See `lib.rs`, "The one ceiling this crate does not own".
#
# Shape ruling (Codex thread 01a0056e-5193-7001-be11-b124736b4b5d, round 1):
# ONE LEAF CRATE PER DOMAIN, created when that domain is converted -- not one
# shared `domain_grammar` crate with a module per domain. A shared crate would
# put every converted domain into every consumer's dependent closure.
[dependencies]
