[workspace]
resolver = "2"
members = [
    "inline_detour",
    # The MinHook fork this product patches through. It exists because upstream
    # suspends threads and moves instruction pointers inside our own frozen
    # window; see the crate manifest for the three defects that bought it.
    "minhook_h4",
    # The frozen-window guard the four direct-freeze crates share. Dev-only:
    # nothing links it except `[dev-dependencies]`.
    "freeze_window_audit",
    "wire_format",
    "wire_product",
    "compact_stream",
    "compact_contract",
    # D13's payload grammar, owner ruling 2026-08-15: ONE shared decoder. A leaf
    # with no dependencies, because the four sites that walk this grammar sit on
    # both sides of two deliberate crate directions (`wire_format` takes no
    # recorder dependency; `recorder_host` takes no wire dependency) and only a
    # leaf can be shared without reversing either.
    "d13_grammar",
    # D68's payload grammar (lane KO, phase 1 of the same ruling). One leaf
    # crate PER DOMAIN, not one shared grammar crate: a shared crate would put
    # every converted domain into every consumer's dependent closure, so a d43
    # edit would invalidate `wire_format` even though d43 has no wire port
    # (Codex thread 01a0056e-5193-7001-be11-b124736b4b5d, round 1).
    "d68_grammar",
    # D24's payload grammar (lane KO). Its header words at `+40`/`+44` recently
    # stopped being reserved zeros and became the producer's two discovered
    # precipitation ceilings -- the exact kind of change that leaves a reader
    # behind, at a domain whose layout was restated four times.
    "d24_grammar",
    # D43's payload grammar (lane KU, phase 2 of the same ruling). The
    # largest drift surface in the tree: 122 independently duplicated layout
    # facts across four shipping walk sites, nine trailer magics and four
    # live version families (MTRF v1-v3, MTRR v1-v4, MTRD v1-v4).
    "d43_grammar",
    "d74_grammar",
    # D11's payload grammar (lane KX, phase 2 of the same ruling). This is the
    # compile-error win: ten additive trailer families and five shipping sites
    # already shared constants but did not share one structural walk/encoder.
    "d11_grammar",
    # The canonical id-set block (lane NA, d48 B2). Same ruling, same leaf shape,
    # but domain-NEUTRAL rather than per-domain, because the thing shared is a
    # generic set codec and its three consumers sit in three different domains'
    # worlds: `d48_grammar`'s coverage trailer, `compact_contract`'s session
    # state-topology census (a frame-control record, not a domain payload), and
    # `wire_format`'s independent d48 port. Being dependency-free is what lets
    # `wire_format` share the decoder without widening its `compact_contract`
    # allow-list.
    "id_set_codec",
    # D48's coverage-trailer grammar (lane NA, d48 B2). The D48V header, the
    # four-block order, the cardinality and subset rules, and the RLC1/D48V tail
    # split -- shared so the recorder and the independent wire port cannot drift
    # on byte boundaries while keeping their separate semantic projections.
    "d48_grammar",
    "snapshot",
    "collector",
    "recorder_host",
    "scientists_live_lane",
    "replay_decoder",
    "fold_check",
    # Injected D3D11 map-frame capture DLL + attach helper. It patches live
    # game code through `inline_detour`, so it belongs with the rest of the
    # injected code, not in `replay_interface/native` where it used to sit.
    "terrain_capture",
    "lanes/air_wings_variants_lifecycle_live",
    "lanes/air_loss_stats_live",
    "lanes/hub_motorization_live",
    "lanes/scripted_state_flags_variables_live",
    "lanes/occupation_resistance_compliance_live",
    "lanes/characters_leaders_cabinet_live",
    "lanes/compact_replay_verification_gates",
    "lanes/construction_buildings_state_damage_live",
    "lanes/country_dynamic_modifiers_live",
    "lanes/country_economy_production_stockpile_live",
    "lanes/diplomacy_intel_operatives_live",
    "lanes/direct_frd_transitions_live",
    "lanes/focus_research_decisions_depth_live",
    "lanes/division_combat_stats_live",
    "lanes/fow_visibility_live",
    "lanes/spotted_units_live",
    "lanes/d13_tech_change_gate",
    "lanes/d81_rail_change_gate",
    "lanes/land_combat_detail_events_live",
    "lanes/market_trade_live",
    "lanes/army_battleplans_depth_live",
    "lanes/capitulation_war_state_live",
    "lanes/naval_combat_live",
    "lanes/naval_missions_status_live",
    "lanes/session_multiplayer_metadata_live",
    "lanes/supply_logistics_attrition_live",
    "lanes/dynamic_collection_trace_live",
    "lanes/active_command_abilities_live",
    "lanes/resolved_tooltip_instances_live",
    "lanes/fired_event_popups_live",
    "lanes/runtime_text_inputs_live",
    "lanes/production_render_submit_live",
    "lanes/production_render_catalog_capture_contract",
    "lanes/production_render_catalog_live",
    "lanes/production_hook_receipt",
    "lanes/design_catalog_context_live",
    "lanes/hud_role_observer_live",
    "lanes/character_presentation_live",
    "lanes/nuke_stockpile_live",
    "lanes/theatre_selector_live",
    "lanes/country_army_upgrade_requests_live",
    "lanes/sunk_ship_history_live",
    "lanes/decision_panel_live",
    "lanes/passive_clock_witness",
    # Wave-2 scaffold (task 183): the five Wave-5 producer skeletons. They are
    # DECLARED PENDING PRODUCERS, not stubs that pretend to read -- each one
    # names the carrier it owes, the schema its consumer requires, and the exact
    # reverse engineering or capture that must land first, and each refuses
    # installation by name until then. They live here now, landed once by an
    # exclusive lane, because this member list is a single contiguous region:
    # five concurrent new-producer lanes would collide here even though their
    # own sources never overlap.
    "lanes/map_unit_presentation",
    "lanes/xmap17_labels",
    "lanes/xmap20_effects",
    "lanes/xui26_frontend",
    "lanes/victory_points",
    "lanes/map_passive_carriers_live",
]

# Fail-closed doctrine for all untrusted compact-stream, replay-container, and
# manifest parsers. Dependency-local profiles are ignored when this workspace
# is the build root, so the production workspace must carry the policy itself.
[profile.release]
overflow-checks = true

# Native extraction workspace: DLL collector, Rust recorder host, compact
# extraction lane crates, and replay container support.
