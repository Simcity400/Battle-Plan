[package]
name = "d24_grammar"
version = "0.1.0"
edition = "2021"
description = "The single structural walk of domain 24's (weather_live) compact DATA payload: the 48-byte header, the strategic-region row table, the province row table and exact consumption. Owner ruling 2026-08-15 - ONE shared decoder per domain."

# THIS CRATE HAS NO DEPENDENCIES, AND THAT IS THE POINT.
#
# Same reason as `d13_grammar` and `d68_grammar`: the four sites that walk this
# grammar -- the collector's packer, the recorder's fold, the recorder's
# authority validator and the wire port -- sit on both sides of two deliberate
# crate directions (`wire_format` takes no recorder dependency; `recorder_host`
# takes no wire dependency), and a leaf with no dependencies is the only shape
# all four can share without reversing either.
[dependencies]
