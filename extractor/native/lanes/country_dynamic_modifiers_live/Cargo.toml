[package]
name = "country_dynamic_modifiers_live_lane"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
production_hook_receipt = { path = "../production_hook_receipt" }
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
minhook = "0.9.0"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }
