[package]
name = "supply_logistics_attrition_live_lane"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
compact_contract = { path = "../../compact_contract" }
# Province/owner admission bounds shared with the replay consumer, which
# re-applies both when reading these rows back.
portable_admission = { path = "../../../../portable_replay/native/admission" }
serde_json = "1"
snapshot = { path = "../../snapshot" }

[target.'cfg(windows)'.dependencies]
inline_detour = { path = "../../inline_detour" }
minhook = "0.9.0"
windows-sys = { version = "0.61.2", features = [
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }

[[bin]]
name = "supply_logistics_attrition_replay_pack_proof"
path = "src/bin/replay_pack_proof.rs"
