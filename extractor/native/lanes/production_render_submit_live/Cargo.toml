[package]
name = "production_render_submit_live_lane"
version = "0.1.0"
edition = "2021"

[lib]
name = "production_render_submit_live_lane"
path = "src/lib.rs"

[features]
# Declared, never enabled, and deliberately empty in the production workspace.
#
# `src/a729_hook/a25_gui_bridge.rs` — that ONE file, not the `a729_hook` family
# around it — is shared verbatim with the standalone reverse-engineering
# harness at
# `extractor/re_evidence/PRODUCTION_RENDER_SUBMIT_INLINE_HOOKS/hook_harness/`.
# The harness manifest is the authority on which paths are byte-identical, and
# it lists `a729_hook.rs` itself as one of two INTENTIONALLY DIVERGENT paths: a
# direct diff of the two copies is 582 insertions / 728 deletions. Read the
# sentence below as covering `a25_gui_bridge.rs` only.
# The inline-hook installer in that file (`install`, `uninstall`, and the four
# `hook_*` trampolines) is RE evidence and is gated behind this feature so it
# compiles only in the harness. Declaring the feature here keeps the `cfg`
# known to rustc (no `unexpected_cfgs` warning) while guaranteeing the gated
# code is absent from every shipped artifact.
#
# Enabling this feature in the production workspace is unsupported and will not
# compile: the minhook-backed `unshipped_inline_hooks` backend that the gated
# code calls into lives only in the harness, and this crate has no `minhook`
# dependency.
unshipped-render-evidence = []

[dependencies]
portable_render_stream = { path = "../../../../portable_replay/native/render_stream" }
portable_content_manifest = { path = "../../../../portable_replay/native/content_manifest" }
production_render_catalog_capture_contract = { path = "../production_render_catalog_capture_contract" }
compact_contract = { path = "../../compact_contract" }
map_passive_carriers_live_lane = { path = "../map_passive_carriers_live" }
runtime_text_inputs_live_lane = { path = "../runtime_text_inputs_live" }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["d3d11", "d3d11shader", "d3dcommon", "d3dcompiler", "minwindef", "winerror"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
