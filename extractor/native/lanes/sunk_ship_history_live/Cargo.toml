[package]
name = "sunk_ship_history_live_lane"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
compact_contract = { path = "../../compact_contract" }
naval_combat_live_lane = { path = "../naval_combat_live" }
production_hook_receipt = { path = "../production_hook_receipt" }

[target.'cfg(windows)'.dependencies]
inline_detour = { path = "../../inline_detour" }
minhook = "0.9.0"
windows-sys = { version = "0.61.2", features = [
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    # Reserving a two-page region and committing only the first is how the
    # tests place a std::string across a real readable/unreadable boundary,
    # which is the only way to reach the capacity-word refusal exactly.
    "Win32_System_Memory",
    "Win32_System_Threading",
] }
