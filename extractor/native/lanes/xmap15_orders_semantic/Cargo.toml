[package]
name = "xmap15_orders_semantic"
version = "0.1.0"
edition = "2021"
description = "XMAP15 orders/fronts/movement sidecar producer: mints the recorded half of the plan census and gates the rest"

[lib]
path = "src/lib.rs"

[dependencies]
compact_contract = { path = "../../compact_contract" }
# The XMAP15 producer contract and the two row types it mints against. SHARED
# GROUND, not a viewer dependency: the schema lives in portable_replay because
# both workspaces path-depend on it, and the collector already links this crate.
portable_render_stream = { path = "../../../../portable_replay/native/render_stream" }
serde_json = "1"

