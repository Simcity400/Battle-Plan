[package]
name = "compact_replay_verification_gates"
version = "0.1.0"
edition = "2021"

[dependencies]
compact_contract = { path = "../../compact_contract" }
compact_stream = { path = "../../compact_stream" }
characters_leaders_cabinet_live = { path = "../characters_leaders_cabinet_live" }
diplomacy_intel_operatives_live = { path = "../diplomacy_intel_operatives_live" }
recorder_host = { path = "../../recorder_host" }
serde_json = "1"
snapshot = { path = "../../snapshot" }
portable_content_manifest = { path = "../../../../portable_replay/native/content_manifest" }

[[bin]]
name = "compact_replay_gate"
path = "src/main.rs"

[dev-dependencies]
# Waits out the Windows sharing violation a real-time scanner causes on a
# freshly written file. Test-only: nothing this package ships calls it.
portable_test_fs_retry = { path = "../../../../portable_replay/native/test_fs_retry" }
# d57's payload encoder, so the scan test can build a REAL record whose payload
# hour must agree with its H4CR header hour. That agreement is what proves the
# scanner hands the true header to payload validation rather than a placeholder;
# a hand-rolled byte blob could not exercise the cross-check.
session_multiplayer_metadata_live = { path = "../session_multiplayer_metadata_live" }
