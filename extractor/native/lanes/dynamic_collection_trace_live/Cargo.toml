[package]
name = "dynamic_collection_trace_live_lane"
version = "0.1.0"
edition = "2021"

[lib]
name = "dynamic_collection_trace_live_lane"
path = "src/lib.rs"

[dependencies]
sha2 = "0.10"
compact_contract = { path = "../../compact_contract" }

[target.'cfg(windows)'.dependencies]
inline_detour = { path = "../../inline_detour" }
minhook = { package = "minhook_h4", path = "../../minhook_h4" }
windows-sys = { version = "0.61.2", features = [
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Threading",
] }
