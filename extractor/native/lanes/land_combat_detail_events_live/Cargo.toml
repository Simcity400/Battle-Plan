[package]
name = "land_combat_detail_events_live_lane"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
compact_contract = { path = "../../compact_contract" }
production_hook_receipt = { path = "../production_hook_receipt" }
serde_json = "1"
snapshot = { path = "../../snapshot" }

[target.'cfg(windows)'.dependencies]
minhook = "0.9.0"
windows-sys = { version = "0.61.2", features = [
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }
