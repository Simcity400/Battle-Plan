[package]
name = "scripted_state_flags_variables_live_lane"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[features]
default = []
test-support = ["production_hook_receipt/test-support"]

[dependencies]
compact_contract = { path = "../../compact_contract" }
production_hook_receipt = { path = "../production_hook_receipt" }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
minhook = "0.9.0"
runtime_text_inputs_live_lane = { path = "../runtime_text_inputs_live" }
windows-sys = { version = "0.61.2", features = [
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }
