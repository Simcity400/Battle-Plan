[package]
name = "character_presentation_live_lane"
version = "0.1.0"
edition = "2021"

[lib]
name = "character_presentation_live_lane"
path = "src/lib.rs"

[features]
default = []
a729-fixture-hook = []

[target.'cfg(windows)'.dependencies]
inline_detour = { path = "../../inline_detour" }
minhook = "0.9.0"
production_hook_receipt = { path = "../production_hook_receipt" }
runtime_text_inputs_live_lane = { path = "../runtime_text_inputs_live" }
windows-sys = { version = "0.61.2", features = [
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }
