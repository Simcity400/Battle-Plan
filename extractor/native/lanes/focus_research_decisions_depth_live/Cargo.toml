[package]
name = "focus_research_decisions_depth_live"
version = "0.1.0"
edition = "2021"

[lib]
name = "focus_research_decisions_depth_live"
path = "src/lib.rs"

[dependencies]
compact_contract = { path = "../../compact_contract" }
direct_frd_transitions_live = { path = "../direct_frd_transitions_live" }
recorder_host = { path = "../../recorder_host" }
serde_json = "1"
# The SAME SHA-256 the XUI09 consumer seals with: `snapshot` is the extractor's
# facade over `portable_replay/native/snapshot`, which is the crate
# `game_ui/src/research_observer.rs` calls. The producer-side witness law in
# `xui09_research_contract` recomputes the consumer's canonical digests, and a
# second implementation of SHA-256 would be a second thing to keep in step.
snapshot = { path = "../../snapshot" }

# Exact empty default, no fixture-only hook feature: `a729-focus-fixture-hook`
# gated `a729_focus_item_hook::install_for_fixture_capture`, and both are
# deleted. The package builder and the receipt verifier assert this shape.
[features]
default = []

[target.'cfg(windows)'.dependencies]
inline_detour = { path = "../../inline_detour" }
minhook = { package = "minhook_h4", path = "../../minhook_h4" }
windows-sys = { version = "0.61.2", features = [
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Threading",
] }

[dev-dependencies]
freeze_window_audit = { path = "../../freeze_window_audit" }
