[package]
name = "naval_combat_live_lane"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
compact_contract = { path = "../../compact_contract" }
production_hook_receipt = { path = "../production_hook_receipt" }
serde = { version = "1", features = ["derive"] }
