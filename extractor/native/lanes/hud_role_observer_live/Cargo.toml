[package]
name = "hud_role_observer_live_lane"
version = "0.1.0"
edition = "2021"

[lib]
name = "hud_role_observer_live_lane"
path = "src/lib.rs"

[dependencies]
portable_content_manifest = { path = "../../../../portable_replay/native/content_manifest" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
minhook = "0.9.0"
windows-sys = { version = "0.61.2", features = [
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }
