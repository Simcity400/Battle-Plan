[package]
name = "map_unit_presentation"
version = "0.1.0"
edition = "2021"
description = "XMAP13 map-unit-presentation producer: mints the carrier's recorded half and emits the named gate for the rest"

[lib]
path = "src/lib.rs"

[dependencies]
compact_contract = { path = "../../compact_contract" }
# The XMAP13 producer contract: the leaf classification this producer mints
# against, the identity spelling it writes, and the per-hour gate it emits. It
# is SHARED GROUND, not a viewer dependency -- the schema types are map_viewer's
# and this workspace may not depend on that workspace, so the contract both
# sides are bound to lives in portable_replay. The collector already links this
# crate.
portable_render_stream = { path = "../../../../portable_replay/native/render_stream" }
serde_json = "1"
# The theatre selector's own wire tokens. The army-group census this producer
# needs is selected out of the published section set by the ArmyGroup token, and
# a renamed token has to fail this crate's build rather than match nothing.
theatre_selector_live_lane = { path = "../theatre_selector_live" }
