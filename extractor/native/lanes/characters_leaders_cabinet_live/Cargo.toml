[package]
name = "characters_leaders_cabinet_live"
version = "0.1.0"
edition = "2021"

[lib]
name = "characters_leaders_cabinet_live_lane"
path = "src/lib.rs"

[features]
replay-verify = ["dep:snapshot"]

[dependencies]
compact_contract = { path = "../../compact_contract" }
snapshot = { path = "../../snapshot", optional = true }

[[bin]]
name = "appointed_fixture_gate"
path = "src/bin/appointed_fixture_gate.rs"

[[bin]]
name = "replay_fixture_verify"
path = "src/bin/replay_fixture_verify.rs"
required-features = ["replay-verify"]

[[bin]]
name = "replay_record_verify"
path = "src/bin/replay_record_verify.rs"
required-features = ["replay-verify"]

[[bin]]
name = "adapter_fixture_gate"
path = "src/bin/adapter_fixture_gate.rs"

[[bin]]
name = "scheduled_adapter_benchmark"
path = "src/bin/scheduled_adapter_benchmark.rs"
