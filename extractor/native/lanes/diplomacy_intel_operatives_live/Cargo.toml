[package]
name = "diplomacy_intel_operatives_live"
version = "0.1.0"
edition = "2021"

[lib]
name = "diplomacy_intel_operatives_live"
path = "src/lib.rs"

[dependencies]
compact_contract = { path = "../../compact_contract" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
snapshot = { path = "../../snapshot" }

[target.'cfg(windows)'.dependencies]
minhook = "0.9.0"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }

[[bin]]
name = "domain53_proof"
path = "src/bin/domain53_proof.rs"

[[bin]]
name = "d53_field_delta_measure"
path = "src/bin/d53_field_delta_measure.rs"

[[bin]]
name = "prefetch_model_bench"
path = "src/bin/prefetch_model_bench.rs"
