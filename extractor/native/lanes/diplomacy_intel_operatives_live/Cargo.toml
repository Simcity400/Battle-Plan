[package]
name = "diplomacy_intel_operatives_live"
version = "0.1.0"
edition = "2021"

[lib]
name = "diplomacy_intel_operatives_live"
path = "src/lib.rs"

[dependencies]
compact_contract = { path = "../../compact_contract" }
map_passive_carriers_live_lane = { path = "../map_passive_carriers_live" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
snapshot = { path = "../../snapshot" }
portable_render_stream = { path = "../../../../portable_replay/native/render_stream" }

[target.'cfg(windows)'.dependencies]
inline_detour = { path = "../../inline_detour" }
minhook = { package = "minhook_h4", path = "../../minhook_h4" }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_Threading",
] }
