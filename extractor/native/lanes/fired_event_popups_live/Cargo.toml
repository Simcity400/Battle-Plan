[package]
name = "fired_event_popups_live_lane"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[features]
default = []
# `unshipped-d75-full-evidence` — the diagnostic reproduction of the historical
# popup/UI hook graph — was retired on 2026-08-13. Its seven gates read
# `any(test, feature = "unshipped-d75-full-evidence")` and are now plain
# `cfg(test)`, so the code keeps every test that covered it and NO non-test
# build can carry the historical graph any more. Shipped production capture
# uses only the three semantic detours, as it always did.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
scripted_state_flags_variables_live_lane = { path = "../scripted_state_flags_variables_live" }
production_hook_receipt = { path = "../production_hook_receipt" }
compact_contract = { path = "../../compact_contract" }

[target.'cfg(windows)'.dependencies]
inline_detour = { path = "../../inline_detour" }

[dev-dependencies]
scripted_state_flags_variables_live_lane = { path = "../scripted_state_flags_variables_live", features = ["test-support"] }
