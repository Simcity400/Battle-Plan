[package]
name = "fired_event_popups_live_lane"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[features]
default = []
# Diagnostic-only reproduction of the historical popup/UI hook graph. Shipped
# production capture uses only the three semantic detours.
unshipped-d75-full-evidence = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
scripted_state_flags_variables_live_lane = { path = "../scripted_state_flags_variables_live" }
production_hook_receipt = { path = "../production_hook_receipt" }
compact_contract = { path = "../../compact_contract" }

[dev-dependencies]
scripted_state_flags_variables_live_lane = { path = "../scripted_state_flags_variables_live", features = ["test-support"] }
