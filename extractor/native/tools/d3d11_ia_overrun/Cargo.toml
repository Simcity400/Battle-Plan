# Measurement tool, not product. Its own workspace root on purpose: nothing in
# the extractor or replay workspaces may depend on it, and keeping it out of
# `extractor/native/Cargo.toml`'s member list is what keeps the landing gate
# from planning it (`Get-ShippingPackageIds` walks forward from the product
# roots, and `$Topology.Roots` only knows the workspaces the gate lists).
[package]
name = "d3d11_ia_overrun"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
resolver = "2"

[[bin]]
name = "d3d11_ia_overrun"
path = "src/ia_overrun_probe.rs"

[dependencies]
winapi = { version = "0.3.9", features = [
    "d3d11",
    "d3dcommon",
    "d3dcompiler",
    "dxgi",
    "dxgi1_2",
    "dxgiformat",
    "dxgitype",
    "minwindef",
    "unknwnbase",
    "winerror",
] }
