[package]
name = "inline_detour"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[target.'cfg(windows)'.dependencies]
minhook = { package = "minhook_h4", path = "../minhook_h4" }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }

# THE ONLY ACTIVATION OF THE TEST-SUPPORT FEATURE IN THIS WORKSPACE, and it is
# a DEV edge, so it is not in the graph of `cargo build --release -p collector`
# at all. `src/fault_tests.rs::inertness` is the standing check on that, and the
# built-artifact scan in `runs/ln_fault_inject/` is the other half.
#
# The same package under the same name: cargo unifies the two edges onto one
# crate, which is required rather than incidental -- the fault must be injected
# into the MinHook instance the production functions call, and a second
# compilation of the C would be a second `g_hooks` table nothing patches
# through.
[target.'cfg(windows)'.dev-dependencies]
minhook = { package = "minhook_h4", path = "../minhook_h4", features = ["test_support"] }
freeze_window_audit = { path = "../freeze_window_audit" }
