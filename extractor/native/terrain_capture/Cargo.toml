[package]
name = "terrain_capture"
version = "0.1.0"
edition = "2021"
description = "Rust-native D3D11 TerrainIDMap extraction contract for the Battle Plan map renderer"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "terrain_capture_attach"
path = "src/bin/terrain_capture_attach.rs"

[[bin]]
name = "fix_bundle_cb_names"
path = "src/bin/fix_bundle_cb_names.rs"

[[bin]]
name = "capture_harness"
path = "src/bin/capture_harness.rs"

[dependencies]
inline_detour = { path = "../inline_detour" }
minhook = "0.9.0"
# The engine calendar this module stamps onto captured records is the same
# calendar the recorder and the replay consumer apply; it has one home.
portable_admission = { path = "../../../portable_replay/native/admission" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
snapshot = { package = "portable_replay_format", path = "../../../portable_replay/native/snapshot" }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    # Win32_Graphics_Gdi is not referenced directly, but WNDCLASSW (used by
    # capture_harness) is gated behind it in windows-sys because of its HBRUSH field.
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
winapi = { version = "0.3.9", features = [
    "d3d11",
    "d3d11shader",
    "d3dcompiler",
    "d3dcommon",
    "dxgi",
    "dxgiformat",
    "guiddef",
    "minwindef",
    "unknwnbase",
    "winerror",
] }

# NO dev-dependency on `map_viewer`. This crate is the PRODUCER half of the
# map-frame constant-buffer naming contract and `replay_interface/native`'s
# `map_viewer` is the CONSUMER half; the two live in workspaces that
# deliberately do not depend on each other
# (`replay_interface/native/game_ui/tests/replay_dependency_boundary.rs`).
# The agreement is pinned by paired tests instead of by the type system, the
# same mechanism `extractor/native/wire_format/tests/
# producer_consumer_admission_agreement.rs` uses:
#   producer half: `map_frame_constant_buffer_naming_contract` in src/lib.rs
#   consumer half: `map_frame_constant_buffer_naming_contract` in
#                  `replay_interface/native/map_viewer/src/constants.rs`
# Both halves must exist; a name enforced on one side and not its sibling is
# not enforced.
