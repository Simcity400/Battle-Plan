[package]
name = "recorder_host"
version = "0.1.0"
edition = "2021"

[features]
default = []
# Evidence-only actuator surface. Production collector_record is built without
# this feature, so process creation, resume, minimize, and termination imports
# are absent from the shipped observer binary.
evidence-client-driving = []
# Measurement-only: wrap the global allocator so `mem_account::live_heap_bytes`
# reports the live Rust-allocator heap, which is the oracle the always-on component table
# is reconciled against. Off in production: it puts an atomic RMW on every
# allocation, and the finalize path allocates hundreds of thousands of times per
# game hour. It cannot change a produced byte.
mem-alloc-trace = []
# Lane PR census profiler (`src/bin/pr_census_profile.rs`). Mounts the effective
# VFS a sealed manifest records and runs THE attach-time content census over the
# real install, timing mount and walk and checking the rows against the sealed
# manifest. Measurement only: never on by default, never packaged.
pr-census-profile = []

[dependencies]
# D34's air-base-status byte grammar (lane UT). Dependency-free leaf: the
# anchor kinds and row shape live in one place so this crate and the three
# others that read them cannot drift on what a coded anchor MEANS.
d34_grammar = { path = "../d34_grammar" }
# D28's OOB-command byte grammar (lane UT). Same shape, same reason.
d28_grammar = { path = "../d28_grammar" }
# D29's ship-row byte grammar (lane UT). Same shape, same reason.
d29_grammar = { path = "../d29_grammar" }
compact_stream = { path = "../compact_stream" }
# D11's base payload, ten trailer families and nested PDQ1 codec. Like the
# other domain grammar leaves below, it has no dependencies so every writer
# and reader can share one structural walk without reversing crate direction.
d11_grammar = { path = "../d11_grammar" }
# D13's payload grammar, owner ruling 2026-08-15: ONE shared decoder. A LEAF with
# no dependencies, which is the only shape the four D13 sites could share -- the
# producer, this fold, this crate's authority validator and the wire port sit on
# both sides of two deliberate crate directions. Two of those four went stale in
# a day when a tail was added, and one of them excluded 100% of a live capture's
# D13 records.
d13_grammar = { path = "../d13_grammar" }
# D68's payload grammar (lane KO). Same ruling, same shape: one leaf crate per
# domain, so a converted domain never enters an unrelated consumer's closure.
d68_grammar = { path = "../d68_grammar" }
# D24's payload grammar (lane KO).
d24_grammar = { path = "../d24_grammar" }
# D43's payload grammar (lane KU). The largest of them: 122 independently
# duplicated layout facts across four shipping walk sites, nine trailer magics
# and four live version families whose VERSION WORD decides a row's width.
d43_grammar = { path = "../d43_grammar" }
d74_grammar = { path = "../d74_grammar" }
compact_contract = { path = "../compact_contract" }
# The admission bounds this fold shares with the replay consumer. Both cargo
# workspaces path-depend on this crate so each bound has one home; see
# `portable_replay/native/admission/src/lib.rs`.
portable_admission = { path = "../../../portable_replay/native/admission" }
direct_frd_transitions_live = { path = "../lanes/direct_frd_transitions_live" }
air_loss_stats_live_lane = { path = "../lanes/air_loss_stats_live" }
hub_motorization_live_lane = { path = "../lanes/hub_motorization_live" }
air_wings_variants_lifecycle_live_lane = { path = "../lanes/air_wings_variants_lifecycle_live" }
characters_leaders_cabinet_live_lane = { package = "characters_leaders_cabinet_live", path = "../lanes/characters_leaders_cabinet_live" }
construction_buildings_state_damage_live_lane = { package = "construction_buildings_state_damage_live", path = "../lanes/construction_buildings_state_damage_live" }
country_economy_production_stockpile_live_lane = { path = "../lanes/country_economy_production_stockpile_live" }
scripted_state_flags_variables_live_lane = { path = "../lanes/scripted_state_flags_variables_live" }
occupation_resistance_compliance_live_lane = { path = "../lanes/occupation_resistance_compliance_live" }
diplomacy_intel_operatives_live = { path = "../lanes/diplomacy_intel_operatives_live" }
map_passive_carriers_live_lane = { path = "../lanes/map_passive_carriers_live" }
capitulation_war_state_live = { path = "../lanes/capitulation_war_state_live" }
land_combat_detail_events_live_lane = { path = "../lanes/land_combat_detail_events_live" }
naval_combat_live_lane = { path = "../lanes/naval_combat_live" }
army_battleplans_depth_live_lane = { path = "../lanes/army_battleplans_depth_live" }
naval_missions_status_live_lane = { path = "../lanes/naval_missions_status_live" }
session_multiplayer_metadata_live = { path = "../lanes/session_multiplayer_metadata_live" }
dynamic_collection_trace_live_lane = { path = "../lanes/dynamic_collection_trace_live" }
resolved_tooltip_instances_live_lane = { path = "../lanes/resolved_tooltip_instances_live" }
fired_event_popups_live_lane = { path = "../lanes/fired_event_popups_live" }
design_catalog_context_live_lane = { path = "../lanes/design_catalog_context_live" }
hud_role_observer_live_lane = { path = "../lanes/hud_role_observer_live" }
character_presentation_live_lane = { path = "../lanes/character_presentation_live" }
nuke_stockpile_live_lane = { path = "../lanes/nuke_stockpile_live" }
theatre_selector_live_lane = { path = "../lanes/theatre_selector_live" }
# The XMAP13 producer. The fold writes its carrier and its per-hour gate, and
# the producer reads the fold's own published sections rather than its
# accumulators, so it can only claim what the recording carries.
map_unit_presentation = { path = "../lanes/map_unit_presentation" }
# The XMAP15 producer. Its plan owners take their country from XMAP13's
# formation census, so the fold hands one producer's output to the other rather
# than letting two readings of the same sections disagree.
xmap15_orders_semantic = { path = "../lanes/xmap15_orders_semantic" }
country_army_upgrade_requests_live_lane = { path = "../lanes/country_army_upgrade_requests_live" }
sunk_ship_history_live_lane = { path = "../lanes/sunk_ship_history_live" }
decision_panel_live_lane = { path = "../lanes/decision_panel_live" }
active_command_abilities_live_lane = { path = "../lanes/active_command_abilities_live" }
production_render_submit_live_lane = { path = "../lanes/production_render_submit_live" }
scientists_live_lane = { path = "../scientists_live_lane" }
supply_logistics_attrition_live_lane = { path = "../lanes/supply_logistics_attrition_live" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
snapshot = { path = "../snapshot" }
# H4CP v3 reducer seam (stage 1): the fold emits grain mutations for the
# covered sections straight from its reducers; dormant unless enabled.
fold_v3 = { path = "../fold_v3" }
wire_product = { path = "../wire_product" }
portable_render_stream = { path = "../../../portable_replay/native/render_stream" }
# The a729 arithmetic the land indicator's progress bar and tint comparison are
# made of, pinned beside the decompiles it was read from
# (`xmap14_land_indicator_operands`). ONE implementation: the fold derives the
# leaves with it and the evidence crate's own tests hold it to the bytes.
portable_engine_evidence = { path = "../../../portable_replay/native/engine_evidence" }
portable_content_manifest = { path = "../../../portable_replay/native/content_manifest" }
mimalloc = "0.1.52"
# Needed to read raw archive entry NAMES (case preserved) for the domain-98
# localisation case-ambiguity refusal; the effective VFS only exposes normalized
# lowercase logical paths. Same version/features as the shared content crate.
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
# Waits out the Windows sharing violation a real-time scanner causes on a
# freshly written file. Test-only: nothing this package ships calls it.
portable_test_fs_retry = { path = "../../../portable_replay/native/test_fs_retry" }
collector = { path = "../collector", features = ["test-support"] }
compact_contract = { path = "../compact_contract", features = ["test-support"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[[bin]]
name = "collector_record"
path = "src/main.rs"

[[bin]]
name = "collector_record_evidence"
path = "src/main.rs"
required-features = ["evidence-client-driving"]

[[bin]]
name = "stream_fold"
path = "src/bin/stream_fold.rs"

[[bin]]
name = "domain_roster"
path = "src/bin/domain_roster.rs"

[[bin]]
name = "pr_census_profile"
path = "src/bin/pr_census_profile.rs"
required-features = ["pr-census-profile"]
