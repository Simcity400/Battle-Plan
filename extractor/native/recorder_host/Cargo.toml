characters_leaders_cabinet_live_lane = { package = "characters_leaders_cabinet_live", path = "../lanes/characters_leaders_cabinet_live" }
construction_buildings_state_damage_live_lane = { package = "construction_buildings_state_damage_live", path = "../lanes/construction_buildings_state_damage_live" }
country_economy_production_stockpile_live_lane = { path = "../lanes/country_economy_production_stockpile_live" }
