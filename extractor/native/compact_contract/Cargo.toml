[package]
name = "compact_contract"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[features]
test-support = []

[dependencies]
sha2 = "0.10"
# The canonical id-set block, used by the session state-topology census (H4SC).
# A dependency-free grammar leaf: it carries no recorder or capture-lane policy,
# so `wire_format`'s standing d81-only allow-list on this crate is unaffected.
id_set_codec = { path = "../id_set_codec" }

[dev-dependencies]
serde_json = "1"
