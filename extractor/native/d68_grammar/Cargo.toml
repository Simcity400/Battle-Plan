[package]
name = "d68_grammar"
version = "0.1.0"
edition = "2021"
description = "The single structural walk of domain 68's (session_header_live) compact DATA payload: the 16-byte header, the five-word scalar block, the three length-prefixed tokens behind it, and exact consumption. Owner ruling 2026-08-15 - ONE shared decoder per domain, because the same grammar was transcribed at four sites."

# THIS CRATE HAS NO DEPENDENCIES, AND THAT IS THE POINT.
#
# The duplication this crate replaces existed because of deliberate crate
# directions: `wire_format` takes no `recorder_host` dependency (it is an
# independent reference implementation of WIRE_FORMAT.md), and `recorder_host`
# does not depend on `wire_format`. A leaf with no dependencies is the only
# shape all four sites -- the collector's packer, the recorder's fold, the
# recorder's authority validator and the wire port -- can depend on without any
# of those directions being reversed. Adding a dependency here would put that
# back: every dependency of this crate becomes a dependency of all four.
#
# Shape ruling (Codex thread 01a0056e-5193-7001-be11-b124736b4b5d, round 1):
# ONE LEAF CRATE PER DOMAIN, created when that domain is converted -- not one
# shared `domain_grammar` crate with a module per domain. A shared crate would
# put every converted domain into every consumer's dependent closure, so a d43
# edit would invalidate `wire_format` even though d43 has no wire port.
[dependencies]
