[package]
name = "collector"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[build-dependencies]
# Compiles src/seh_read.c (the SEH-guarded crash-safe read shim) into the
# cdylib. MSVC only; see build.rs.
cc = "1"

[dependencies]
compact_contract = { path = "../compact_contract" }
# D11's base and all ten trailers are emitted through this leaf.
d11_grammar = { path = "../d11_grammar" }
# D13's payload grammar, owner ruling 2026-08-15: ONE shared decoder, and
# the producer writes THROUGH it. A leaf with no dependencies of its own, so
# this crate gains no recorder or wire dependency. Sharing only the constants
# would leave the drift that matters: a packer can append a section every
# reader is unaware of, which is exactly what cost a live capture its whole
# D13 domain. Emitting through the leaf makes the section inventory one
# declaration for the writer and all three readers.
d13_grammar = { path = "../d13_grammar" }
# D68's payload grammar (lane KO). Same ruling, same shape: one leaf crate per
# domain, so a converted domain never enters an unrelated consumer's closure.
d68_grammar = { path = "../d68_grammar" }
# D24's payload grammar (lane KO).
d24_grammar = { path = "../d24_grammar" }
# D43's payload grammar (lane KU). This packer writes it; the fold, the
# authority validator and the market_trade lane gate read it.
d43_grammar = { path = "../d43_grammar" }
d74_grammar = { path = "../d74_grammar" }
direct_frd_transitions_live = { path = "../lanes/direct_frd_transitions_live" }
air_loss_stats_live_lane = { path = "../lanes/air_loss_stats_live" }
hub_motorization_live_lane = { path = "../lanes/hub_motorization_live" }
air_wings_variants_lifecycle_live_lane = { path = "../lanes/air_wings_variants_lifecycle_live" }
characters_leaders_cabinet_live_lane = { package = "characters_leaders_cabinet_live", path = "../lanes/characters_leaders_cabinet_live" }
construction_buildings_state_damage_live_lane = { package = "construction_buildings_state_damage_live", path = "../lanes/construction_buildings_state_damage_live" }
country_dynamic_modifiers_live_lane = { path = "../lanes/country_dynamic_modifiers_live" }
scripted_state_flags_variables_live_lane = { path = "../lanes/scripted_state_flags_variables_live" }
occupation_resistance_compliance_live_lane = { path = "../lanes/occupation_resistance_compliance_live" }
diplomacy_intel_operatives_live = { path = "../lanes/diplomacy_intel_operatives_live" }
capitulation_war_state_live = { path = "../lanes/capitulation_war_state_live" }
land_combat_detail_events_live_lane = { path = "../lanes/land_combat_detail_events_live" }
naval_combat_live_lane = { path = "../lanes/naval_combat_live" }
army_battleplans_depth_live_lane = { path = "../lanes/army_battleplans_depth_live" }
naval_missions_status_live_lane = { path = "../lanes/naval_missions_status_live" }
session_multiplayer_metadata_live_lane = { package = "session_multiplayer_metadata_live", path = "../lanes/session_multiplayer_metadata_live" }
dynamic_collection_trace_live_lane = { path = "../lanes/dynamic_collection_trace_live" }
active_command_abilities_live_lane = { path = "../lanes/active_command_abilities_live" }
resolved_tooltip_instances_live_lane = { path = "../lanes/resolved_tooltip_instances_live" }
fired_event_popups_live_lane = { path = "../lanes/fired_event_popups_live" }
runtime_text_inputs_live_lane = { path = "../lanes/runtime_text_inputs_live" }
production_render_submit_live_lane = { path = "../lanes/production_render_submit_live" }
map_passive_carriers_live_lane = { path = "../lanes/map_passive_carriers_live" }
production_hook_receipt = { path = "../lanes/production_hook_receipt" }
production_render_catalog_live = { package = "production_render_catalog_live_lane", path = "../lanes/production_render_catalog_live" }
portable_content_manifest = { path = "../../../portable_replay/native/content_manifest" }
design_catalog_context_live_lane = { path = "../lanes/design_catalog_context_live" }
hud_role_observer_live_lane = { path = "../lanes/hud_role_observer_live" }
character_presentation_live_lane = { path = "../lanes/character_presentation_live" }
nuke_stockpile_live_lane = { path = "../lanes/nuke_stockpile_live" }
theatre_selector_live_lane = { path = "../lanes/theatre_selector_live" }
country_army_upgrade_requests_live_lane = { path = "../lanes/country_army_upgrade_requests_live" }
country_economy_production_stockpile_live_lane = { path = "../lanes/country_economy_production_stockpile_live" }
sunk_ship_history_live_lane = { path = "../lanes/sunk_ship_history_live" }
decision_panel_live_lane = { path = "../lanes/decision_panel_live" }
division_combat_stats_live_lane = { package = "division_combat_stats_live", path = "../lanes/division_combat_stats_live" }
fow_visibility_live_lane = { package = "fow_visibility_live", path = "../lanes/fow_visibility_live" }
spotted_units_live_lane = { package = "spotted_units_live", path = "../lanes/spotted_units_live" }
d13_tech_change_gate_lane = { package = "d13_tech_change_gate", path = "../lanes/d13_tech_change_gate" }
supply_logistics_attrition_live_lane = { path = "../lanes/supply_logistics_attrition_live" }
focus_research_decisions_depth_live = { path = "../lanes/focus_research_decisions_depth_live" }
# Wave-2 scaffold (task 183): the five Wave-5 producer skeletons. Real
# dependencies, not placeholder manifest rows -- `attach_log.rs`'s
# `PENDING_PRODUCER_SLOTS` reads each crate's declaration, so a crate deleted
# here fails the collector's build rather than silently becoming unreachable.
# This block is a single contiguous region, which is why all five land at once.
xmap17_labels = { path = "../lanes/xmap17_labels" }
xui26_frontend = { path = "../lanes/xui26_frontend" }
xmap20_effects = { path = "../lanes/xmap20_effects" }
victory_points = { path = "../lanes/victory_points" }
portable_render_stream = { path = "../../../portable_replay/native/render_stream" }
serde = "1"
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
inline_detour = { path = "../inline_detour" }
minhook = { package = "minhook_h4", path = "../minhook_h4" }
windows-sys = { version = "0.61.2", features = [
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Threading",
] }

[features]
test-support = []
# Capture-floor range/byte/depth tracer (stage S0 ground truth). Records every
# guarded read of exactly ONE extraction frame to a sidecar, then disarms.
# Diagnostic only: with the feature off, `attach_log`'s three read primitives
# emit no tracer call, no branch and no atomic load, and the module is not
# compiled at all. NEVER enable it for a shipped capture -- a traced frame's
# timings are not comparable with an untraced one's.
range-tracer = []
# This table is complete. Three evidence features stood here - A25 runtime
# text, A39 character presentation, A31 focus presentation - and were the named
# conditions that two lane FIXTURE HOOK installers and one collector-side
# fixture ABI sat behind. Those installers are deleted, so there is nothing
# left for a feature to gate: a capability that does not exist needs no gate
# and cannot be reached by typing a feature name. Their three
# `CollectorFeatureBits` wire bits (1<<3, 1<<4, 1<<5) are unassigned in the
# same change. Do not add a feature here to re-gate a fixture hook.
# `Assert-CollectorRetiredEvidenceFeatureAbsence` refuses the retired prefix
# and any forwarding of a lane fixture feature, before a package is built.
#
# Note for anyone editing these comments: the package builder and two verifiers
# read this file's TEXT as well as its parsed tables, so do not spell the
# retired feature names or the retired lane feature names literally here.

[dev-dependencies]
# Waits out the Windows sharing violation a real-time scanner causes on a
# freshly written file (lane KY). Test-only: nothing this package ships calls it.
portable_test_fs_retry = { path = "../../../portable_replay/native/test_fs_retry" }
# `test-support` enables the lane's lifecycle-claiming helper for tests only.
# A production `cargo build -p collector` does not carry it.
division_combat_stats_live_lane = { package = "division_combat_stats_live", path = "../lanes/division_combat_stats_live", features = ["test-support"] }
compact_contract = { path = "../compact_contract", features = ["test-support"] }
# `test-support` mints the matched installed/released receipt pair that
# `validate_released_standard_receipts` is exercised with. Tests only.
production_hook_receipt = { path = "../lanes/production_hook_receipt", features = ["test-support"] }
# Lane JO / gap-map row G4-X9S1: the D13 XUI09 witness crosses the encoder in
# THIS crate, the fold in `recorder_host` and the read law in
# `focus_research_decisions_depth_live`, and the collector's test build is the
# only place all three are visible at once — the lane crate cannot see the
# encoder (this crate depends on IT) and `recorder_host` cannot see the law
# (the law's crate depends on IT). A joint certification that used anything but
# the real encoder or the real fold would certify a transcription.
#
# TESTS ONLY, and it introduces no cycle Cargo did not already accept:
# `recorder_host` dev-depends on this crate, so the edge back is a dev edge,
# exactly as it already is through `focus_research_decisions_depth_live`.
recorder_host = { path = "../recorder_host" }
