[package]
name = "combat_panel"
version = "0.1.0"
edition = "2021"

# Stage 4 — the COMBAT-PANEL ADAPTER (plan §C.2 + §G + BINDING_MAP_diplomacy_combat.md).
# Reads the snapshot `combats[]` array (13 live land combats in the sample), the
# `provinces` / `map.control_by_province` controller facts, and the static province
# meta, and produces the ROSTER-AGGREGATION view-model: per-combat side identity +
# location + duration + lifecycle, with EVERY battle-DETAIL field (combat_width /
# terrain / progress-bar / tactics / modifiers / air / per-division & per-ship rows)
# badged UNAVAILABLE ("—"), never fabricated. Renders clickable map bubbles + the
# stacked landcombat panel, reusing the gui_runtime canvas + render primitives.

[dependencies]
assets = { path = "../assets" }
snapshot = { path = "../snapshot" }
serde_json = "1"

# Rendering deps are used by the demo bin + the `view` render module. The core
# model/aggregate modules do NOT import these — the lib stays substrate-light and
# headlessly testable.
render = { path = "../render" }
gui_runtime = { path = "../gui_runtime" }

[dev-dependencies]
