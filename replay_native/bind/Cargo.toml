[package]
name = "bind"
version = "0.1.0"
edition = "2021"
description = "Declarative binding spec (typed Rust structs) + formatters: applies a topbar element -> snapshot-path -> formatter -> fidelity map to the gui_runtime scene-graph, honouring no-fabrication (unavailable -> not-captured glyph, never a fabricated 0)."

[dependencies]
snapshot = { path = "../snapshot" }
gui_runtime = { path = "../gui_runtime" }
assets = { path = "../assets" }
render = { path = "../render" }
serde_json = "1"

[[bin]]
name = "m3_demo"
path = "src/bin/m3_demo.rs"

[[bin]]
name = "m5_demo"
path = "src/bin/m5_demo.rs"
