[package]
name = "app"
version = "0.1.0"
edition = "2021"
description = "STAGE 1 interactive shell — a native winit window + wgpu surface that drives the existing offscreen engine: map (pan/zoom/pick) as the bottom layer, a window stack (topbar always-on + state panel on pick), an on-screen time scrubber that re-binds every open surface in-process via the scrub LRU, and a select->drill-in dispatch registry. READ-ONLY on assets + the snapshot store; no commits; no personal path in source (paths via resolver/CLI/env)."

[dependencies]
snapshot = { path = "../snapshot" }
assets = { path = "../assets" }
render = { path = "../render" }
gui_runtime = { path = "../gui_runtime" }
bind = { path = "../bind" }
scrub = { path = "../scrub" }
focus_tree = { path = "../focus_tree" }
combat_panel = { path = "../combat_panel" }
widgets = { path = "../widgets" }
serde_json = "1"
inventory = "0.3"
wgpu = "0.20"
winit = "0.29"
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }

[[bin]]
name = "replay_app"
path = "src/main.rs"

[lib]
name = "app"
path = "src/lib.rs"
