[package]
name = "focus_tree"
version = "0.1.0"
edition = "2021"

# Stage 3 — the FOCUS-TREE ADAPTER (plan §B.5 + §E). Parses
# common/national_focus/*.txt (mod-resolved via the assets resolver) into a
# node+edge GRAPH, resolves relative_position_id chains to absolute positions,
# runs the deliberately-small OFFSET-TRIGGER EVALUATOR (§E) on the supported
# subset (badging unsupported), and binds node state from the snapshot focus
# domain. Feeds the generic gui_runtime drag_scroll canvas + node prototype.

[dependencies]
assets = { path = "../assets" }
snapshot = { path = "../snapshot" }
serde_json = "1"

# Rendering deps are used by the demo bins + the `view` render module (the
# adapter feeding the gui_runtime drag_scroll canvas). The core parser/eval/bind
# modules do NOT import these — the lib stays substrate-light.
render = { path = "../render" }
gui_runtime = { path = "../gui_runtime" }

[dev-dependencies]
