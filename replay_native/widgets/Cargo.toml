[package]
name = "widgets"
version = "0.1.0"
edition = "2021"

# BATCH 1 — the 8 SHARED RENDER PRIMITIVES the BATCH-2 view clusters bind against.
# This crate is deliberately ADDITIVE and SUBSTRATE-LIGHT: it depends only on the
# stable lower layers (`render` for the GPU quad primitives, `gui_runtime` for the
# scene-graph Rect / markup wrap / font cache, `assets` for BmFont/SpriteManifest) plus
# `serde_json` (the N5 event-card adapter reads the `events.json` value shape).
# It does NOT depend on `focus_tree` or `combat_panel` (Codex build-risk guard: a
# concurrent cluster agent editing those must never break us, and vice-versa) — the
# placed-graph and centroid-bubble PATTERNS are re-implemented here, not imported.
#
# No-fabrication is enforced AT THE PUBLIC BOUNDARY (Codex's sharpest note): every
# visible label/title/stat/cell is a `DisplayAtom`-style honesty value, and every
# "is there a thing here?" slot is an explicit availability enum (Known / Empty /
# Unavailable), never a bare `Option<String>` the caller can silently fabricate into.

[dependencies]
render = { path = "../render" }
gui_runtime = { path = "../gui_runtime" }
assets = { path = "../assets" }
serde_json = "1"

[lib]
name = "widgets"
path = "src/lib.rs"

[dev-dependencies]
